<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">MrStore — O teu homelab. As tuas apps. Uma só loja.</title>
<desc id="desc">Identidade MrStore em laranja e grafite, com símbolo de caixa e uma montra ilustrativa de aplicações self-hosted. A integração atual é com ZimaOS v2.</desc>
