<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">MrStore — O teu homelab. As tuas apps. Uma só loja.</title>
  <desc id="desc">Novo rebrand MrStore: cartaz editorial laranja com monograma M, tipografia grande sobre grafite e constelação geométrica de aplicações. Integração atual ZimaOS v2.</desc>
  <defs>
    <linearGradient id="orange-panel" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#FFC06A"/><stop offset=".45" stop-color="#FF9437"/><stop offset="1" stop-color="#F6681B"/>
    </linearGradient>
    <linearGradient id="charcoal" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#111720"/><stop offset=".65" stop-color="#0D1119"/><stop offset="1" stop-color="#1A161B"/>
    </linearGradient>
    <linearGradient id="bright" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#FFC476"/><stop offset=".45" stop-color="#FF963B"/><stop offset="1" stop-color="#FF6B22"/>
    </linearGradient>
    <radialGradient id="glow" cx=".58" cy=".5" r=".58">
      <stop stop-color="#FE7F2D" stop-opacity=".30"/><stop offset="1" stop-color="#FE7F2D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="27" height="27" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.05" fill="#FAAB71" opacity=".12"/></pattern>
    <pattern id="slash" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect x="0" y="0" width="1.5" height="32" fill="#2E1A15" opacity=".13"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="165%" height="180%"><feDropShadow dx="0" dy="19" stdDeviation="17" flood-color="#331408" flood-opacity=".35"/></filter>
    <clipPath id="round"><rect width="1600" height="480" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1600" height="480" fill="url(#charcoal)"/>
    <rect x="450" width="1150" height="480" fill="url(#dots)"/>
    <circle cx="1390" cy="215" r="325" fill="url(#glow)"/>
    <path d="M1160 -60 1680 430" fill="none" stroke="#D8855A" stroke-opacity=".075" stroke-width="160"/>
    <rect width="450" height="480" fill="url(#orange-panel)"/>
    <rect width="450" height="480" fill="url(#slash)"/>
    <path d="M449 0V480" stroke="#FFD098" stroke-opacity=".75" stroke-width="2"/>
    <path d="M0 0H450L383 67H0Z" fill="#FFFFFF" opacity=".065"/>
    <circle cx="-28" cy="512" r="285" fill="none" stroke="#581E12" stroke-opacity=".13" stroke-width="2"/>
    <circle cx="-28" cy="512" r="232" fill="none" stroke="#581E12" stroke-opacity=".13" stroke-width="2"/>
    <g font-family="Arial,Helvetica,sans-serif" fill="#261914">
      <text x="47" y="62" font-size="14" font-weight="800" letter-spacing="3">MRSTORE  /  NEW IDENTITY</text>
      <text x="398" y="61" text-anchor="end" font-size="13" font-weight="900">26 / 01</text>
    </g>
    <g filter="url(#shadow)" transform="rotate(-7 226 222)">
      <rect x="104" y="104" width="244" height="242" rx="54" fill="#161820" stroke="#FFF1DF" stroke-opacity=".3" stroke-width="2"/>
      <rect x="122" y="121" width="208" height="208" rx="44" fill="none" stroke="#FFAD61" stroke-opacity=".24" stroke-width="2"/>
      <path d="M153 287V171L225 242 297 171V287" fill="none" stroke="#F8F8F7" stroke-width="33" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M153 287V171" stroke="url(#bright)" stroke-width="9" stroke-linecap="round"/>
      <circle cx="297" cy="287" r="15" fill="#FF9536" stroke="#171920" stroke-width="5"/>
    </g>
    <rect x="326" y="92" width="57" height="57" rx="17" transform="rotate(14 354 120)" fill="#FFF0DD" stroke="#FFB36A" stroke-width="3"/>
    <path d="M341 120h27M354.5 106.5v27" stroke="#F37724" stroke-width="6" stroke-linecap="round"/>
    <g fill="#281811" font-family="Arial,Helvetica,sans-serif">
      <text x="47" y="410" font-size="19" font-weight="900" letter-spacing="2.2">NOT JUST AN APP STORE.</text>
      <text x="47" y="438" font-size="12" font-weight="700" letter-spacing="3.3" opacity=".8">MADE FOR HOMELABS.</text>
    </g>
    <g transform="translate(520 0)" font-family="Arial,Helvetica,sans-serif">
      <circle cx="7" cy="77" r="6" fill="#FF9337"/>
      <text x="24" y="82" fill="#FFC08B" font-size="15" font-weight="800" letter-spacing="3">THE SELF-HOSTED APP UNIVERSE</text>
      <path d="M0 106H273" stroke="url(#bright)" stroke-width="3" stroke-linecap="round"/>
      <text x="-3" y="233" fill="#FFFFFF" font-size="129" font-weight="900" letter-spacing="-8">Mr<tspan fill="url(#bright)">Store</tspan></text>
      <text x="2" y="313" fill="#F8F6F5" font-size="43" font-weight="700" letter-spacing="-.7">O teu homelab. As tuas apps.</text>
      <text x="2" y="366" fill="#FC9D4E" font-size="43" font-weight="800" letter-spacing="-.7">Uma só loja.</text>
      <text x="2" y="436" fill="#AEB3BC" font-size="14" font-weight="800" letter-spacing="2.7">DESCOBRE  /  EXPLORA  /  ORGANIZA</text>
    </g>
    <!-- Graphic system: connected apps, not an imitation screenshot -->
    <g fill="none" stroke="#FFAA62" stroke-width="2" stroke-opacity=".36">
      <path d="M1320 157 1410 112 1513 182 1450 302 1320 329 1268 257Z"/>
      <path d="M1320 157 1450 302M1268 257 1513 182M1410 112 1320 329" stroke-dasharray="6 10" stroke-opacity=".21"/>
      <circle cx="1399" cy="222" r="170" stroke-opacity=".13"/>
      <circle cx="1399" cy="222" r="121" stroke-dasharray="5 11" stroke-opacity=".19"/>
    </g>
    <g fill="#FFB778">
      <circle cx="1410" cy="112" r="5"/><circle cx="1268" cy="257" r="5"/><circle cx="1320" cy="329" r="5"/>
      <circle cx="1513" cy="182" r="5"/><circle cx="1450" cy="302" r="5"/>
    </g>
    <g transform="rotate(-12 1334 184)">
      <rect x="1296" y="143" width="77" height="77" rx="21" fill="#31251F" stroke="#ED8E4A" stroke-width="2"/>
      <path d="M1320 183l14-13 15 13-15 13Z" fill="none" stroke="#FFBE84" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(10 1488 246)">
      <rect x="1440" y="197" width="96" height="96" rx="25" fill="#FF8C34" stroke="#FFD19A" stroke-opacity=".55" stroke-width="2"/>
      <rect x="1465" y="222" width="46" height="46" rx="12" fill="#241820"/>
      <path d="M1479 245h18m-9-9v18" stroke="#FFC990" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="rotate(12 1337 342)">
      <rect x="1307" y="310" width="60" height="60" rx="17" fill="#28222A" stroke="#AA6A49" stroke-width="2"/>
      <circle cx="1337" cy="340" r="11" fill="none" stroke="#FFE1BE" stroke-width="5"/>
    </g>
    <g font-family="Arial,Helvetica,sans-serif">
      <rect x="1204" y="406" width="343" height="43" rx="21.5" fill="#36261F" stroke="#8E5539" stroke-width="1.4"/>
      <circle cx="1230" cy="427" r="6" fill="#FF9F43"/>
      <text x="1247" y="432" font-size="15" font-weight="800" letter-spacing=".7" fill="#FFD0A1">ZIMAOS V2</text>
      <path d="M1352 416v22" stroke="#8E5539"/>
      <text x="1371" y="432" font-size="12" font-weight="750" fill="#C0B3AF">INTEGRAÇÃO ATUAL</text>
    </g>
    <path d="M450 478H1600" stroke="url(#bright)" stroke-opacity=".72" stroke-width="3"/>
  </g>
</svg>
