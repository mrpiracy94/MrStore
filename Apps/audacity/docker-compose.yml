name: audacity
services:
  audacity:
    image: lscr.io/linuxserver/audacity:latest
    container_name: audacity
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Audacity"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21016"
        protocol: tcp
      - target: 3001
        published: "21017"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/audacity/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.audacity
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: audacity
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/audacity.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/audacity.png
  title:
    en_US: "Audacity"
  tagline:
    en_US: "Audacity (LinuxServer.io)"
  description:
    en_US: "Audacity — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/audacity:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-audacity/"
  port_map: "21016"
  index: /
