name: zen
services:
  zen:
    image: lscr.io/linuxserver/zen:latest
    container_name: zen
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Zen Browser"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21178"
        protocol: tcp
      - target: 3001
        published: "21179"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/zen/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.zen
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: zen
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/zen/icon.svg
  thumbnail: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/zen/icon.svg
  title:
    en_US: "Zen Browser"
  tagline:
    en_US: "Zen Browser (LinuxServer.io)"
  description:
    en_US: "Zen Browser — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/zen:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-zen/"
  port_map: "21178"
  index: /
