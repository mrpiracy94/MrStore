name: gzdoom
services:
  gzdoom:
    image: lscr.io/linuxserver/gzdoom:latest
    container_name: gzdoom
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=GZDoom"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21068"
        protocol: tcp
      - target: 3001
        published: "21069"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gzdoom/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.gzdoom
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: gzdoom
  author: MrStore
  developer: LinuxServer.io
  category: Others
  icon: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/gzdoom/icon.svg
  thumbnail: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/gzdoom/icon.svg
  title:
    en_US: "GZDoom"
  tagline:
    en_US: "GZDoom (LinuxServer.io)"
  description:
    en_US: "GZDoom — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/gzdoom:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-gzdoom/"
  port_map: "21068"
  index: /
