name: healthchecks
services:
  healthchecks:
    image: ghcr.io/mrpiracy94/mrstore-healthchecks@sha256:32c4096680c75431b0e7c20a0064f3e54b25cf55e67c012092f29d1fe61b4b81
    container_name: healthchecks
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "SECRET_KEY=CHANGE_ME_SECRET_KEY"
      - "SITE_ROOT=http://zimaos.local:20037"
      - "SITE_NAME=Healthchecks"
      - "SUPERUSER_EMAIL=CHANGE_ME_EMAIL"
      - "SUPERUSER_PASSWORD=CHANGE_ME"
    ports:
      - target: 8000
        published: "20037"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/healthchecks/config
        target: /config
    x-casaos:
      envs:
        - container: SECRET_KEY
          description:
            en_US: Required private random Django secret; never publish it
        - container: SITE_ROOT
          description:
            en_US: Set actual NAS URL including port 20037 before installation
        - container: SITE_NAME
          description:
            en_US: Human-readable instance name
        - container: SUPERUSER_EMAIL
          description:
            en_US: Replace with your own administrator email
        - container: SUPERUSER_PASSWORD
          description:
            en_US: Replace with a strong unique password before installation
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "8000"
          description:
            en_US: Port 8000/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.healthchecks
  version: "1.0.2"
  update_at: "2026-10-10"
  architectures:
    - amd64
    - arm64
  main: healthchecks
  author: MrStore
  developer: LinuxServer.io
  category: Others
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/healthchecks.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/healthchecks.png
  title:
    en_US: "Healthchecks"
  tagline:
    en_US: "Healthchecks (LinuxServer.io, correções de segurança MrStore)"
  description:
    en_US: "Monitorização de tarefas agendadas. A imagem LinuxServer exige SECRET_KEY, SITE_ROOT, SITE_NAME, SUPERUSER_EMAIL e SUPERUSER_PASSWORD. Todos estão agora disponíveis na instalação: gerar chave privada, definir email/password seguros e trocar zimaos.local pelo hostname ou IP real. UI na porta 20037; dados mantidos em /config. Nunca usar CHANGE_ME. Docs: https://docs.linuxserver.io/images/docker-healthchecks/"
  port_map: "20037"
  index: /
