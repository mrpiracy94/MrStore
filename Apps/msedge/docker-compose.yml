name: msedge
services:
  msedge:
    image: lscr.io/linuxserver/msedge:latest
    container_name: msedge
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Microsoft Edge"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21100"
        protocol: tcp
      - target: 3001
        published: "21101"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/msedge/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.msedge
  version: "1.0.1"
  update_at: "2026-10-09"
  architectures:
    - amd64
  main: msedge
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/57e939e504eda0ea764098015da93aa666ad6f31/png/microsoft-edge.png
  thumbnail: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/57e939e504eda0ea764098015da93aa666ad6f31/png/microsoft-edge.png
  title:
    en_US: "Microsoft Edge"
  tagline:
    en_US: "Microsoft Edge (LinuxServer.io)"
  description:
    en_US: "Microsoft Edge — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/msedge:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-msedge/"
  port_map: "21100"
  index: /
