name: duckdns
services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "SUBDOMAINS=CHANGE_ME_SUBDOMAIN"
      - "TOKEN=CHANGE_ME"
    volumes:
      - type: bind
        source: /DATA/AppData/duckdns/config
        target: /config
    x-casaos:
      envs:
        - container: SUBDOMAINS
          description:
            en_US: Your real DuckDNS subdomain(s), without the .duckdns.org suffix
        - container: TOKEN
          description:
            en_US: Secret token from DuckDNS; set securely before installation
        - container: TZ
          description:
            en_US: Timezone
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.duckdns
  version: "1.0.1"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: duckdns
  author: MrStore
  developer: LinuxServer.io
  category: Networking
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/duckdns.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/duckdns.png
  title:
    en_US: "DuckDNS"
  tagline:
    en_US: "DuckDNS (LinuxServer.io)"
  description:
    en_US: "Atualiza dinamicamente o endereço DNS. Antes de instalar, configurar SUBDOMAINS com o subdomínio registado e TOKEN com o token privado obtido em duckdns.org; não utilizar os valores CHANGE_ME. App sem interface web. Docs: https://docs.linuxserver.io/images/docker-duckdns/"
  port_map: "0"
  index: /
