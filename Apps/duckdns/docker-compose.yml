name: duckdns
services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "SUBDOMAINS=sub"
      - "TOKEN=${DUCKDNS_TOKEN:?Set DUCKDNS_TOKEN before deployment}"
    volumes:
      - type: bind
        source: /DATA/AppData/duckdns/config
        target: /config
    x-casaos:
      envs:
        - container: TOKEN
          description:
            en_US: Required secret; configure a unique value before deployment
        - container: TZ
          description:
            en_US: Timezone
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  tips:
    before_install:
      en_US: "SECURITY: Configure required Compose variables DUCKDNS_TOKEN before installing. The ZimaOS v2 catalog builder strips service-level x-casaos.envs, so automatic password entry is NOT confirmed. Do not install until your ZimaOS installer securely injects these values. No default credentials are provided. See docs/SECURE_DEPLOYMENT.md in MrStore."
      pt_PT: "SEGURANÇA: Configura as variáveis Compose obrigatórias DUCKDNS_TOKEN antes da instalação. O builder ZimaOS v2 remove os campos x-casaos.envs dos serviços; não está confirmado que a interface peça credenciais. Não instales até o ZimaOS conseguir transmitir os valores com segurança. Não existem passwords predefinidas. Consulta docs/SECURE_DEPLOYMENT.md na MrStore."
  id: io.github.mrpiracy94.duckdns
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: duckdns
  author: MrStore
  developer: LinuxServer.io
  category: Networking
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/duckdns.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/duckdns.png
  title:
    en_US: "DuckDNS"
  tagline:
    en_US: "DuckDNS (LinuxServer.io)"
  description:
    en_US: "DuckDNS — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/duckdns:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-duckdns/"
  port_map: "0"
  index: /
