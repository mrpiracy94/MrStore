name: homarr
services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    environment:
      - "SECRET_ENCRYPTION_KEY=CHANGE_ME_64_HEX"
    ports:
      - target: 7575
        published: "7575"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/homarr
        target: /appdata
    x-casaos:
      envs:
        - container: SECRET_ENCRYPTION_KEY
          description:
            en_US: SECRET_ENCRYPTION_KEY
      ports:
        - container: "7575"
          description:
            en_US: Port 7575/tcp
      volumes:
        - container: /appdata
          description:
            en_US: /appdata

x-casaos:
  id: io.github.mrpiracy94.homarr
  version: "1.0.1"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: homarr
  author: MrStore
  developer: Homarr
  category: Others
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/homarr.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/homarr.png
  title:
    en_US: "Homarr"
  tagline:
    en_US: "Dashboard para a casa/homelab"
  description:
    en_US: "Dashboard para o homelab. Docker socket removido por omissão para reduzir privilégios; gestão e descoberta de containers Docker exigem proxy com permissões limitadas, configurado separadamente. Obrigatório substituir SECRET_ENCRYPTION_KEY por 64 caracteres hexadecimais privados ANTES da instalação; guardar a chave para recuperar os dados. Os dados persistem em /DATA/AppData/homarr."
  port_map: "7575"
  index: /
