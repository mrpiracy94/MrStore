name: homarr
services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    environment:
      - "SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_ENCRYPTION_KEY:?Set HOMARR_SECRET_ENCRYPTION_KEY before deployment}"
    ports:
      - target: 7575
        published: "7575"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/homarr
        target: /appdata
    x-casaos:
      envs:
        - container: SECRET_ENCRYPTION_KEY
          description:
            en_US: SECRET_ENCRYPTION_KEY
      ports:
        - container: "7575"
          description:
            en_US: Port 7575/tcp
      volumes:
        - container: /appdata
          description:
            en_US: /appdata

x-casaos:
  tips:
    before_install:
      en_US: "SECURITY: Configure required Compose variables HOMARR_SECRET_ENCRYPTION_KEY before installing. The ZimaOS v2 catalog builder strips service-level x-casaos.envs, so automatic password entry is NOT confirmed. Do not install until your ZimaOS installer securely injects these values. No default credentials are provided. See docs/SECURE_DEPLOYMENT.md in MrStore."
      pt_PT: "SEGURANÇA: Configura as variáveis Compose obrigatórias HOMARR_SECRET_ENCRYPTION_KEY antes da instalação. O builder ZimaOS v2 remove os campos x-casaos.envs dos serviços; não está confirmado que a interface peça credenciais. Não instales até o ZimaOS conseguir transmitir os valores com segurança. Não existem passwords predefinidas. Consulta docs/SECURE_DEPLOYMENT.md na MrStore."
  id: io.github.mrpiracy94.homarr
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: homarr
  author: MrStore
  developer: Homarr
  category: Others
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/homarr.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/homarr.png
  title:
    en_US: "Homarr"
  tagline:
    en_US: "Dashboard para a casa/homelab"
  description:
    en_US: "Dashboard para a casa/homelab. Estado: projeto muito ativo (conhecimento até meados de 2026); NÃO verificado em out/2026. Confirma portas e variáveis na documentação do projeto."
  port_map: "7575"
  index: /
