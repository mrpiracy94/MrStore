name: phpmyadmin
services:
  phpmyadmin:
    image: ghcr.io/mrpiracy94/mrstore-phpmyadmin:lsio-composer-twig-symfony-secfix-20261010@sha256:e013e13d834b9ae5c0cf47f9edb5501aa99a60109813ef3280131621498b1749
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "PMA_ARBITRARY=1"
    ports:
      - target: 80
        published: "20042"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/phpmyadmin/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "80"
          description:
            en_US: Port 80/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.phpmyadmin
  version: "1.0.1"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: phpmyadmin
  author: MrStore
  developer: LinuxServer.io
  category: Developer
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/phpmyadmin.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/phpmyadmin.png
  title:
    en_US: "phpMyAdmin"
  tagline:
    en_US: "phpMyAdmin (LinuxServer.io)"
  description:
    en_US: "phpMyAdmin LinuxServer original com Twig, Symfony Cache e pacotes Alpine atualizados individualmente para corrigir CVEs. Imagem GHCR verificada em AMD64/ARM64 com 0 HIGH/CRITICAL no Trivy, página web, /config e consulta MariaDB. Mantém 20042→80 e a configuração PUID/PGID/PMA_ARBITRARY; antes de atualizar faz backup de /DATA/AppData/phpmyadmin/config. Ver docs/PHPMYADMIN_LSIO_SECURITY_PATCH.md."
  port_map: "20042"
  index: /
