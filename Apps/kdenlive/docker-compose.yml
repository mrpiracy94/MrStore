name: kdenlive
services:
  kdenlive:
    image: lscr.io/linuxserver/kdenlive:latest
    container_name: kdenlive
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Kdenlive"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21080"
        protocol: tcp
      - target: 3001
        published: "21081"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kdenlive/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.kdenlive
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: kdenlive
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/kdenlive.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/kdenlive.png
  title:
    en_US: "Kdenlive"
  tagline:
    en_US: "Kdenlive (LinuxServer.io)"
  description:
    en_US: "Kdenlive — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/kdenlive:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-kdenlive/"
  port_map: "21080"
  index: /
