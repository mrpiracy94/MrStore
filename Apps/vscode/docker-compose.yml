name: vscode
services:
  vscode:
    image: lscr.io/linuxserver/vscode:latest
    container_name: vscode
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=VS Code"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21184"
        protocol: tcp
      - target: 3001
        published: "21185"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscode/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.vscode
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: vscode
  author: MrStore
  developer: LinuxServer.io
  category: Developer
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/vscode.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/vscode.png
  title:
    en_US: "VS Code"
  tagline:
    en_US: "VS Code (LinuxServer.io)"
  description:
    en_US: "VS Code — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/vscode:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-vscode/"
  port_map: "21184"
  index: /
