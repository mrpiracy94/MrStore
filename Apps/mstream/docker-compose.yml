name: mstream
services:
  mstream:
    image: lscr.io/linuxserver/mstream:latest
    container_name: mstream
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 3000
        published: "3000"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mstream/config
        target: /config
      - type: bind
        source: /DATA/Media/Music
        target: /music
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /music
          description:
            en_US: /music

x-casaos:
  id: io.github.mrpiracy94.mstream
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: mstream
  author: MrStore
  developer: LinuxServer.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/mstream.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/mstream.png
  title:
    en_US: "mStream"
  tagline:
    en_US: "mStream (LinuxServer.io)"
  description:
    en_US: "mStream — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/mstream:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-mstream/"
  port_map: "3000"
  index: /
