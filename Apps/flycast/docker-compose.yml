name: flycast
services:
  flycast:
    image: lscr.io/linuxserver/flycast:latest
    container_name: flycast
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Flycast"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21058"
        protocol: tcp
      - target: 3001
        published: "21059"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/flycast/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.flycast
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
  main: flycast
  author: MrStore
  developer: LinuxServer.io
  category: Others
  icon: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/flycast/icon.svg
  thumbnail: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/flycast/icon.svg
  title:
    en_US: "Flycast"
  tagline:
    en_US: "Flycast (LinuxServer.io)"
  description:
    en_US: "Flycast — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/flycast:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-flycast/"
  port_map: "21058"
  index: /
