name: eden
services:
  eden:
    image: lscr.io/linuxserver/eden:latest
    container_name: eden
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Eden"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21050"
        protocol: tcp
      - target: 3001
        published: "21051"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/eden/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.eden
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
  main: eden
  author: MrStore
  developer: LinuxServer.io
  category: Others
  icon: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/eden/icon.svg
  thumbnail: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/eden/icon.svg
  title:
    en_US: "Eden"
  tagline:
    en_US: "Eden (LinuxServer.io)"
  description:
    en_US: "Eden — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/eden:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-eden/"
  port_map: "21050"
  index: /
