name: wireguard
services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "SERVERURL=auto"
      - "PEERS=1"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - target: 51820
        published: "51820"
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/wireguard/config
        target: /config
      - type: bind
        source: /lib/modules
        target: /lib/modules
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "51820"
          description:
            en_US: Port 51820/udp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /lib/modules
          description:
            en_US: /lib/modules

x-casaos:
  id: io.github.mrpiracy94.wireguard
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: wireguard
  author: MrStore
  developer: LinuxServer.io
  category: Networking
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/wireguard.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/wireguard.png
  title:
    en_US: "WireGuard"
  tagline:
    en_US: "WireGuard (LinuxServer.io)"
  description:
    en_US: "WireGuard — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/wireguard:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-wireguard/"
  port_map: "0"
  index: /
