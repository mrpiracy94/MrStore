name: qdirstat
services:
  qdirstat:
    image: lscr.io/linuxserver/qdirstat:latest
    container_name: qdirstat
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=QDirStat"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21122"
        protocol: tcp
      - target: 3001
        published: "21123"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/qdirstat/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.qdirstat
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: qdirstat
  author: MrStore
  developer: LinuxServer.io
  category: Others
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/qdirstat.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/qdirstat.png
  title:
    en_US: "QDirStat"
  tagline:
    en_US: "QDirStat (LinuxServer.io)"
  description:
    en_US: "QDirStat — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/qdirstat:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-qdirstat/"
  port_map: "21122"
  index: /
