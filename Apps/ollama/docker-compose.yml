name: ollama
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - target: 11434
        published: "11434"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ollama
        target: /root/.ollama
    x-casaos:
      envs: []
      ports:
        - container: "11434"
          description:
            en_US: Port 11434/tcp
      volumes:
        - container: /root/.ollama
          description:
            en_US: /root/.ollama

x-casaos:
  id: io.github.mrpiracy94.ollama
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: ollama
  author: MrStore
  developer: Ollama
  category: Others
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/ollama.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/ollama.png
  title:
    en_US: "Ollama"
    pt_PT: "Ollama"
  tagline:
    en_US: "Modelos de IA locais (CPU por omissão)"
  description:
    en_US: "Modelos de IA locais (CPU por omissão). Estado: projeto muito ativo (conhecimento até meados de 2026); NÃO verificado em out/2026. Confirma portas e variáveis na documentação do projeto."
    pt_PT: "Executa modelos de inteligência artificial no teu próprio servidor. Verifica os recursos de CPU, RAM e GPU e o espaço necessário para os modelos."
  port_map: "11434"
  index: /
