name: audiobookshelf
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
    ports:
      - target: 80
        published: "30006"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/audiobookshelf/config
        target: /config
      - type: bind
        source: /DATA/AppData/audiobookshelf/metadata
        target: /metadata
      - type: bind
        source: /DATA/Media/Audiobooks
        target: /audiobooks
      - type: bind
        source: /DATA/Media/Podcasts
        target: /podcasts
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: TZ
      ports:
        - container: "80"
          description:
            en_US: Port 80/tcp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /metadata
          description:
            en_US: /metadata
        - container: /audiobooks
          description:
            en_US: /audiobooks
        - container: /podcasts
          description:
            en_US: /podcasts

x-casaos:
  id: io.github.mrpiracy94.audiobookshelf
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: audiobookshelf
  author: MrStore
  developer: Audiobookshelf
  category: Media
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/audiobookshelf.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/audiobookshelf.png
  title:
    en_US: "Audiobookshelf"
  tagline:
    en_US: "Audiolivros e podcasts"
  description:
    en_US: "Audiolivros e podcasts. Estado: projeto muito ativo (conhecimento até meados de 2026); NÃO verificado em out/2026. Confirma portas e variáveis na documentação do projeto."
  port_map: "30006"
  index: /
