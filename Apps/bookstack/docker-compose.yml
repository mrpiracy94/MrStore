name: bookstack
services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "APP_URL=http://zimaos.local:20026"
      - "APP_KEY=${BOOKSTACK_APP_KEY:?Set BOOKSTACK_APP_KEY before deployment}"
      - "DB_HOST=${BOOKSTACK_DB_HOST:?Set BOOKSTACK_DB_HOST before deployment}"
      - "DB_PORT=3306"
      - "DB_USERNAME=bookstack"
      - "DB_PASSWORD=${BOOKSTACK_DB_PASSWORD:?Set BOOKSTACK_DB_PASSWORD before deployment}"
      - "DB_DATABASE=bookstackapp"
    ports:
      - target: 80
        published: "20026"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/bookstack/config
        target: /config
    x-casaos:
      envs:
        - container: APP_URL
          description:
            en_US: External browser URL, replace host/domain before installing
        - container: APP_KEY
          description:
            en_US: Generate and set a private Laravel APP_KEY before installing
        - container: DB_HOST
          description:
            en_US: Mandatory address of an EXISTING reachable MariaDB/MySQL server
        - container: DB_PORT
          description:
            en_US: Existing database TCP port
        - container: DB_USERNAME
          description:
            en_US: Existing database user
        - container: DB_PASSWORD
          description:
            en_US: Set your existing database password; never use CHANGE_ME
        - container: DB_DATABASE
          description:
            en_US: Existing database name
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "80"
          description:
            en_US: Port 80/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.bookstack
  version: "1.0.1"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: bookstack
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/bookstack.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/bookstack.png
  title:
    en_US: "BookStack"
  tagline:
    en_US: "BookStack (LinuxServer.io)"
  description:
    en_US: "BookStack — exige configuração manual ANTES da instalação: servidor MariaDB/MySQL EXTERNO já criado e acessível, DB_HOST, DB_USERNAME, DB_PASSWORD e DB_DATABASE válidos, APP_KEY gerada e APP_URL ajustada ao nome/domínio real do NAS (porta 20026). Esta entrada NÃO inclui base de dados e NÃO é instalação de um clique. Nunca uses CHANGE_ME em produção. Docs: https://docs.linuxserver.io/images/docker-bookstack/"
  port_map: "20026"
  index: /
