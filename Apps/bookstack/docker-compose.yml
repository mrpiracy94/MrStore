name: bookstack
services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "APP_URL=http://zimaos.local:6875"
      - "DB_HOST=bookstack_db"
      - "DB_PORT=3306"
      - "DB_USER=bookstack"
      - "DB_PASS=CHANGE_ME"
      - "DB_DATABASE=bookstackapp"
    ports:
      - target: 80
        published: "20026"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/bookstack/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "80"
          description:
            en_US: Port 80/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.bookstack
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: bookstack
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/bookstack.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/bookstack.png
  title:
    en_US: "BookStack"
  tagline:
    en_US: "BookStack (LinuxServer.io)"
  description:
    en_US: "BookStack — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/bookstack:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-bookstack/"
  port_map: "20026"
  index: /
