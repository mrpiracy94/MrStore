name: nextcloud
services:
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 443
        published: "20019"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/nextcloud/config
        target: /config
      - type: bind
        source: /DATA/AppData/nextcloud/data
        target: /data
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "443"
          description:
            en_US: Port 443/tcp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /data
          description:
            en_US: /data

x-casaos:
  id: io.github.mrpiracy94.nextcloud
  version: "1.0.1"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: nextcloud
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/nextcloud.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/nextcloud.png
  title:
    en_US: "Nextcloud"
    pt_PT: "Nextcloud"
  tagline:
    en_US: "Nextcloud (LinuxServer.io)"
  description:
    en_US: "Nextcloud — origem: LinuxServer.io. O serviço LinuxServer.io usa HTTPS na porta interna 443, publicada na porta 20019. O certificado inicial pode ser autoassinado e exigir confirmação no browser; valida a instalação no ZimaOS. Docs: https://docs.linuxserver.io/images/docker-nextcloud/"
    pt_PT: "Nuvem pessoal para sincronizar ficheiros, contactos e colaboração. Analisa os requisitos de base de dados, armazenamento e HTTPS, e confirma as credenciais e backups."
  port_map: "20019"
  scheme: https
  index: /
