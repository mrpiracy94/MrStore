name: stirling-pdf
services:
  stirling-pdf:
    image: docker.io/stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    environment:
      - "LANGS=pt_PT"
    ports:
      - target: 8080
        published: "30005"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/stirling-pdf/tessdata
        target: /usr/share/tessdata
      - type: bind
        source: /DATA/AppData/stirling-pdf/configs
        target: /configs
    x-casaos:
      envs:
        - container: LANGS
          description:
            en_US: LANGS
      ports:
        - container: "8080"
          description:
            en_US: Port 8080/tcp
      volumes:
        - container: /usr/share/tessdata
          description:
            en_US: /usr/share/tessdata
        - container: /configs
          description:
            en_US: /configs

x-casaos:
  id: io.github.mrpiracy94.stirling-pdf
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: stirling-pdf
  author: MrStore
  developer: Stirling PDF
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/stirling-pdf.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/stirling-pdf.png
  title:
    en_US: "Stirling PDF"
  tagline:
    en_US: "Ferramentas PDF"
  description:
    en_US: "Ferramentas PDF. Estado: projeto muito ativo (conhecimento até meados de 2026); NÃO verificado em out/2026. Confirma portas e variáveis na documentação do projeto."
  port_map: "30005"
  index: /
