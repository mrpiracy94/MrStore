name: kavita
services:
  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 5000
        published: "5000"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kavita/config
        target: /config
      - type: bind
        source: /DATA/Media/Books
        target: /data
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "5000"
          description:
            en_US: Port 5000/tcp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /data
          description:
            en_US: /data

x-casaos:
  id: io.github.mrpiracy94.kavita
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: kavita
  author: MrStore
  developer: LinuxServer.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/kavita.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/kavita.png
  title:
    en_US: "Kavita"
  tagline:
    en_US: "Kavita (LinuxServer.io)"
  description:
    en_US: "Kavita — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/kavita:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-kavita/"
  port_map: "5000"
  index: /
