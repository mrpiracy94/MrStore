name: homepage
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      - "HOMEPAGE_ALLOWED_HOSTS=zimaos.local:30007"
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 3000
        published: "30007"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/homepage
        target: /app/config
    x-casaos:
      envs:
        - container: HOMEPAGE_ALLOWED_HOSTS
          description:
            en_US: HOMEPAGE_ALLOWED_HOSTS
        - container: PUID
          description:
            en_US: PUID
        - container: PGID
          description:
            en_US: PGID
        - container: TZ
          description:
            en_US: TZ
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
      volumes:
        - container: /app/config
          description:
            en_US: /app/config

x-casaos:
  id: io.github.mrpiracy94.homepage
  version: "1.0.1"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: homepage
  author: MrStore
  developer: Homepage
  category: Others
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/homepage.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/homepage.png
  title:
    en_US: "Homepage"
  tagline:
    en_US: "Dashboard configurável"
  description:
    en_US: "Dashboard configurável. Proteção do cabeçalho Host ativada para zimaos.local:30007; se usas IP, outro hostname ou proxy, edita HOMEPAGE_ALLOWED_HOSTS na instalação. O Docker socket foi removido para reduzir privilégios: widgets/integracões Docker ficam desativados por omissão. Mantêm-se a porta 30007 e os dados em /DATA/AppData/homepage."
  port_map: "30007"
  index: /
