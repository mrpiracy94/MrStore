name: yaak
services:
  yaak:
    image: lscr.io/linuxserver/yaak:latest
    container_name: yaak
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Yaak"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21176"
        protocol: tcp
      - target: 3001
        published: "21177"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.yaak
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: yaak
  author: MrStore
  developer: LinuxServer.io
  category: Developer
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/c00fb6e6dc50b59217a915188be27d0ea55801c8/linuxserver.io/img/yaak-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/c00fb6e6dc50b59217a915188be27d0ea55801c8/linuxserver.io/img/yaak-logo.png
  title:
    en_US: "Yaak"
  tagline:
    en_US: "Yaak (LinuxServer.io)"
  description:
    en_US: "Yaak — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/yaak:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-yaak/"
  port_map: "21176"
  index: /
