name: onlyoffice
services:
  onlyoffice:
    image: lscr.io/linuxserver/onlyoffice:latest
    container_name: onlyoffice
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 80
        published: "20020"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/onlyoffice/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "80"
          description:
            en_US: Port 80/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.onlyoffice
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: onlyoffice
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/onlyoffice.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/onlyoffice.png
  title:
    en_US: "ONLYOFFICE"
  tagline:
    en_US: "ONLYOFFICE (LinuxServer.io)"
  description:
    en_US: "ONLYOFFICE — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/onlyoffice:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-onlyoffice/"
  port_map: "20020"
  index: /
