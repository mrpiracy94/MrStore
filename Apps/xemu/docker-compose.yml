name: xemu
services:
  xemu:
    image: lscr.io/linuxserver/xemu:latest
    container_name: xemu
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=xemu"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21174"
        protocol: tcp
      - target: 3001
        published: "21175"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/xemu/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.xemu
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: xemu
  author: MrStore
  developer: LinuxServer.io
  category: Others
  icon: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/xemu/icon.svg
  thumbnail: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/xemu/icon.svg
  title:
    en_US: "xemu"
  tagline:
    en_US: "xemu (LinuxServer.io)"
  description:
    en_US: "xemu — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/xemu:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-xemu/"
  port_map: "21174"
  index: /
