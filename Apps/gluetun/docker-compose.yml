name: gluetun
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - "VPN_SERVICE_PROVIDER=${GLUETUN_VPN_SERVICE_PROVIDER:?Set GLUETUN_VPN_SERVICE_PROVIDER before deployment}"
      - "VPN_TYPE=wireguard"
      - "WIREGUARD_PRIVATE_KEY=${GLUETUN_WIREGUARD_PRIVATE_KEY:?Set GLUETUN_WIREGUARD_PRIVATE_KEY before deployment}"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8888
        published: "30019"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gluetun
        target: /gluetun
    x-casaos:
      envs:
        - container: VPN_SERVICE_PROVIDER
          description:
            en_US: VPN_SERVICE_PROVIDER
        - container: VPN_TYPE
          description:
            en_US: VPN_TYPE
        - container: WIREGUARD_PRIVATE_KEY
          description:
            en_US: WIREGUARD_PRIVATE_KEY
        - container: TZ
          description:
            en_US: TZ
      ports:
        - container: "8888"
          description:
            en_US: Port 8888/tcp
      volumes:
        - container: /gluetun
          description:
            en_US: /gluetun

x-casaos:
  tips:
    before_install:
      en_US: "SECURITY: Configure required Compose variables GLUETUN_VPN_SERVICE_PROVIDER, GLUETUN_WIREGUARD_PRIVATE_KEY before installing. The ZimaOS v2 catalog builder strips service-level x-casaos.envs, so automatic password entry is NOT confirmed. Do not install until your ZimaOS installer securely injects these values. No default credentials are provided. See docs/SECURE_DEPLOYMENT.md in MrStore."
      pt_PT: "SEGURANÇA: Configura as variáveis Compose obrigatórias GLUETUN_VPN_SERVICE_PROVIDER, GLUETUN_WIREGUARD_PRIVATE_KEY antes da instalação. O builder ZimaOS v2 remove os campos x-casaos.envs dos serviços; não está confirmado que a interface peça credenciais. Não instales até o ZimaOS conseguir transmitir os valores com segurança. Não existem passwords predefinidas. Consulta docs/SECURE_DEPLOYMENT.md na MrStore."
  id: io.github.mrpiracy94.gluetun
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: gluetun
  author: MrStore
  developer: Gluetun
  category: Networking
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/gluetun.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/gluetun.png
  title:
    en_US: "Gluetun"
  tagline:
    en_US: "Cliente VPN para outros contentores"
  description:
    en_US: "Cliente VPN para outros contentores. Estado: projeto muito ativo (conhecimento até meados de 2026); NÃO verificado em out/2026. Confirma portas e variáveis na documentação do projeto."
  port_map: "0"
