name: github-desktop
services:
  github-desktop:
    image: lscr.io/linuxserver/github-desktop:latest
    container_name: github-desktop
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=GitHub Desktop"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21064"
        protocol: tcp
      - target: 3001
        published: "21065"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/github-desktop/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.github-desktop
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: github-desktop
  author: MrStore
  developer: LinuxServer.io
  category: Developer
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/github-desktop.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/github-desktop.png
  title:
    en_US: "GitHub Desktop"
  tagline:
    en_US: "GitHub Desktop (LinuxServer.io)"
  description:
    en_US: "GitHub Desktop — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/github-desktop:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-github-desktop/"
  port_map: "21064"
  index: /
