name: openshot
services:
  openshot:
    image: lscr.io/linuxserver/openshot:latest
    container_name: openshot
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=OpenShot"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21108"
        protocol: tcp
      - target: 3001
        published: "21109"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/openshot/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.openshot
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: openshot
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/openshot/icon.svg
  thumbnail: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/openshot/icon.svg
  title:
    en_US: "OpenShot"
  tagline:
    en_US: "OpenShot (LinuxServer.io)"
  description:
    en_US: "OpenShot — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/openshot:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-openshot/"
  port_map: "21108"
  index: /
