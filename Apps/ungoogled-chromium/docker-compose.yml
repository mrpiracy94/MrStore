name: ungoogled-chromium
services:
  ungoogled-chromium:
    image: lscr.io/linuxserver/ungoogled-chromium:latest
    container_name: ungoogled-chromium
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Ungoogled Chromium"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21156"
        protocol: tcp
      - target: 3001
        published: "21157"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ungoogled-chromium/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.ungoogled-chromium
  version: "1.0.1"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: ungoogled-chromium
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/c00fb6e6dc50b59217a915188be27d0ea55801c8/linuxserver.io/img/ungoogled-chromium-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/c00fb6e6dc50b59217a915188be27d0ea55801c8/linuxserver.io/img/ungoogled-chromium-logo.png
  title:
    en_US: "Ungoogled Chromium"
  tagline:
    en_US: "Ungoogled Chromium (LinuxServer.io)"
  description:
    en_US: "Ungoogled Chromium — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/ungoogled-chromium:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-ungoogled-chromium/"
  port_map: "21156"
  index: /
