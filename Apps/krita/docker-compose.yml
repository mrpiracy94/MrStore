name: krita
services:
  krita:
    image: lscr.io/linuxserver/krita:latest
    container_name: krita
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Krita"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21086"
        protocol: tcp
      - target: 3001
        published: "21087"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/krita/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.krita
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
  main: krita
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/krita/icon.svg
  thumbnail: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/krita/icon.svg
  title:
    en_US: "Krita"
  tagline:
    en_US: "Krita (LinuxServer.io)"
  description:
    en_US: "Krita — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/krita:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-krita/"
  port_map: "21086"
  index: /
