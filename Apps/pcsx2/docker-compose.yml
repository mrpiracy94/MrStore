name: pcsx2
services:
  pcsx2:
    image: lscr.io/linuxserver/pcsx2:latest
    container_name: pcsx2
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=PCSX2"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21114"
        protocol: tcp
      - target: 3001
        published: "21115"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pcsx2/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.pcsx2
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: pcsx2
  author: MrStore
  developer: LinuxServer.io
  category: Others
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/pcsx2.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/pcsx2.png
  title:
    en_US: "PCSX2"
  tagline:
    en_US: "PCSX2 (LinuxServer.io)"
  description:
    en_US: "PCSX2 — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/pcsx2:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-pcsx2/"
  port_map: "21114"
  index: /
