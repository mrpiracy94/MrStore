name: modrinth
services:
  modrinth:
    image: lscr.io/linuxserver/modrinth:latest
    container_name: modrinth
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Modrinth App"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21004"
        protocol: tcp
      - target: 3001
        published: "21005"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.modrinth
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
  main: modrinth
  author: MrStore
  developer: LinuxServer.io
  category: Others
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/modrinth.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/modrinth.png
  title:
    en_US: "Modrinth App"
  tagline:
    en_US: "Modrinth App (LinuxServer.io)"
  description:
    en_US: "Modrinth App — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/modrinth:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-modrinth/"
  port_map: "21004"
  index: /
