name: rutorrent
services:
  rutorrent:
    image: crazymax/rtorrent-rutorrent:latest
    container_name: rutorrent
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8080
        published: "20060"
        protocol: tcp
      - target: 8000
        published: "20061"
        protocol: tcp
      - target: 9000
        published: "20062"
        protocol: tcp
      - target: 50000
        published: "50000"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/rutorrent/data
        target: /data
      - type: bind
        source: /DATA/Downloads
        target: /downloads
      - type: bind
        source: /DATA/AppData/rutorrent/passwd
        target: /passwd
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "8080"
          description:
            en_US: Port 8080/tcp
        - container: "8000"
          description:
            en_US: Port 8000/tcp
        - container: "9000"
          description:
            en_US: Port 9000/tcp
        - container: "50000"
          description:
            en_US: Port 50000/tcp
      volumes:
        - container: /data
          description:
            en_US: /data
        - container: /downloads
          description:
            en_US: /downloads
        - container: /passwd
          description:
            en_US: /passwd

x-casaos:
  id: io.github.mrpiracy94.rutorrent
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: rutorrent
  author: MrStore
  developer: crazy-max
  category: Networking
  icon: https://seedit4.me/assets/img/icons/software/rtorrent.png
  thumbnail: https://seedit4.me/assets/img/icons/software/rtorrent.png
  title:
    en_US: "ruTorrent (rTorrent)"
  tagline:
    en_US: "ruTorrent (rTorrent) (seedit4.me catalog)"
  description:
    en_US: "ruTorrent (rTorrent) — origem: seedit4.me catalog. Imagem: crazymax/rtorrent-rutorrent:latest. Verifica portas/variáveis na documentação do projeto."
  port_map: "20060"
  index: /
