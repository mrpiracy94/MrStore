name: altus
services:
  altus:
    image: lscr.io/linuxserver/altus:latest
    container_name: altus
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Altus"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21012"
        protocol: tcp
      - target: 3001
        published: "21013"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/altus/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.altus
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: altus
  author: MrStore
  developer: LinuxServer.io
  category: Social
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/altus.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/altus.png
  title:
    en_US: "Altus"
  tagline:
    en_US: "Altus (LinuxServer.io)"
  description:
    en_US: "Altus — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/altus:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-altus/"
  port_map: "21012"
  index: /
