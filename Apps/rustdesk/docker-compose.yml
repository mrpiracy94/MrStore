name: rustdesk
services:
  rustdesk:
    image: lscr.io/linuxserver/rustdesk:latest
    container_name: rustdesk
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=RustDesk"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21000"
        protocol: tcp
      - target: 3001
        published: "21001"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/rustdesk/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.rustdesk
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: rustdesk
  author: MrStore
  developer: LinuxServer.io
  category: Networking
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/rustdesk.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/rustdesk.png
  title:
    en_US: "RustDesk"
  tagline:
    en_US: "RustDesk (LinuxServer.io)"
  description:
    en_US: "RustDesk — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/rustdesk:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-rustdesk/"
  port_map: "21000"
  index: /
