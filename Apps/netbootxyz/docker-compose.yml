name: netbootxyz
services:
  netbootxyz:
    image: ghcr.io/mrpiracy94/mrstore-netbootxyz:2026-10-09-secfix@sha256:2a3fda1f77563529dcff6dcb0f4cbc44a48694291ca071f01995a157cc451527
    container_name: netbootxyz
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "WEB_APP_PORT=3000"
      - "NGINX_PORT=8080"
    ports:
      - target: 3000
        published: "20013"
        protocol: tcp
      - target: 69
        published: "69"
        protocol: udp
      - target: 8080
        published: "20014"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/netbootxyz/config
        target: /config
      - type: bind
        source: /DATA/AppData/netbootxyz/assets
        target: /assets
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "69"
          description:
            en_US: Port 69/udp
        - container: "8080"
          description:
            en_US: Port 8080/tcp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /assets
          description:
            en_US: /assets

x-casaos:
  id: io.github.mrpiracy94.netbootxyz
  version: "1.1.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: netbootxyz
  author: MrStore
  developer: netboot.xyz
  category: Networking
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/netbootxyz.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/netbootxyz.png
  title:
    en_US: "netboot.xyz"
  tagline:
    en_US: "Arranque de sistemas e utilitários pela rede"
  description:
    en_US: "netboot.xyz — imagem oficial netboot.xyz com pacotes de segurança atualizados, publicada pelo MrStore no GHCR e fixada em digest imutável. A imagem antiga LinuxServer.io foi descontinuada. Os dados permanecem em /DATA/AppData/netbootxyz; a porta de configuração é 20013, TFTP 69/udp, e servidor de ficheiros 20014. NGINX_PORT=8080 conserva a porta interna existente. Documentação: https://github.com/netbootxyz/docker-netbootxyz"
  port_map: "20013"
  index: /
