name: netbootxyz
services:
  netbootxyz:
    image: lscr.io/linuxserver/netbootxyz:latest
    container_name: netbootxyz
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 3000
        published: "20013"
        protocol: tcp
      - target: 69
        published: "69"
        protocol: udp
      - target: 8080
        published: "20014"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/netbootxyz/config
        target: /config
      - type: bind
        source: /DATA/AppData/netbootxyz/assets
        target: /assets
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "69"
          description:
            en_US: Port 69/udp
        - container: "8080"
          description:
            en_US: Port 8080/tcp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /assets
          description:
            en_US: /assets

x-casaos:
  id: io.github.mrpiracy94.netbootxyz
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: netbootxyz
  author: MrStore
  developer: LinuxServer.io
  category: Networking
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/netbootxyz.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/netbootxyz.png
  title:
    en_US: "netboot.xyz"
  tagline:
    en_US: "netboot.xyz (LinuxServer.io)"
  description:
    en_US: "netboot.xyz — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/netbootxyz:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-netbootxyz/"
  port_map: "20013"
  index: /
