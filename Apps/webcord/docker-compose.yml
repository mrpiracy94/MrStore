name: webcord
services:
  webcord:
    image: lscr.io/linuxserver/webcord:latest
    container_name: webcord
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=WebCord"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21164"
        protocol: tcp
      - target: 3001
        published: "21165"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webcord/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.webcord
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: webcord
  author: MrStore
  developer: LinuxServer.io
  category: Social
  icon: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/webcord/icon.svg
  thumbnail: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/webcord/icon.svg
  title:
    en_US: "WebCord"
  tagline:
    en_US: "WebCord (LinuxServer.io)"
  description:
    en_US: "WebCord — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/webcord:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-webcord/"
  port_map: "21164"
  index: /
