name: lm-studio
services:
  lm-studio:
    image: lscr.io/linuxserver/lm-studio:latest
    container_name: lm-studio
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=LM Studio"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21010"
        protocol: tcp
      - target: 3001
        published: "21011"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/lm-studio/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.lm-studio
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: lm-studio
  author: MrStore
  developer: LinuxServer.io
  category: Others
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/lm-studio.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/lm-studio.png
  title:
    en_US: "LM Studio"
  tagline:
    en_US: "LM Studio (LinuxServer.io)"
  description:
    en_US: "LM Studio — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/lm-studio:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-lm-studio/"
  port_map: "21010"
  index: /
