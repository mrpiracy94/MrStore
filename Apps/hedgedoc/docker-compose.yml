name: hedgedoc
services:
  hedgedoc:
    image: lscr.io/linuxserver/hedgedoc:latest
    container_name: hedgedoc
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "DB_HOST=hedgedoc_db"
      - "DB_PORT=3306"
      - "DB_USER=hedgedoc"
      - "DB_PASS=${HEDGEDOC_DB_PASSWORD:?Set HEDGEDOC_DB_PASSWORD before deployment}"
      - "DB_NAME=hedgedoc"
      - "CMD_DOMAIN=localhost"
      - "CMD_URL_ADDPORT=false"
      - "CMD_PROTOCOL_USESSL=false"
    ports:
      - target: 3000
        published: "20029"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/hedgedoc/config
        target: /config
    x-casaos:
      envs:
        - container: DB_PASS
          description:
            en_US: Required secret; configure a unique value before deployment
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  tips:
    before_install:
      en_US: "SECURITY: Configure required Compose variables HEDGEDOC_DB_PASSWORD before installing. The ZimaOS v2 catalog builder strips service-level x-casaos.envs, so automatic password entry is NOT confirmed. Do not install until your ZimaOS installer securely injects these values. No default credentials are provided. See docs/SECURE_DEPLOYMENT.md in MrStore."
      pt_PT: "SEGURANÇA: Configura as variáveis Compose obrigatórias HEDGEDOC_DB_PASSWORD antes da instalação. O builder ZimaOS v2 remove os campos x-casaos.envs dos serviços; não está confirmado que a interface peça credenciais. Não instales até o ZimaOS conseguir transmitir os valores com segurança. Não existem passwords predefinidas. Consulta docs/SECURE_DEPLOYMENT.md na MrStore."
  id: io.github.mrpiracy94.hedgedoc
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: hedgedoc
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/hedgedoc.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/hedgedoc.png
  title:
    en_US: "HedgeDoc"
  tagline:
    en_US: "HedgeDoc (LinuxServer.io)"
  description:
    en_US: "HedgeDoc — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/hedgedoc:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-hedgedoc/"
  port_map: "20029"
  index: /
