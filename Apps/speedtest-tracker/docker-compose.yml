name: speedtest-tracker
services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "APP_KEY=base64:${SPEEDTEST_TRACKER_APP_KEY:?Set SPEEDTEST_TRACKER_APP_KEY before deployment}"
      - "DB_CONNECTION=sqlite"
    ports:
      - target: 80
        published: "20010"
        protocol: tcp
      - target: 443
        published: "20011"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/speedtest-tracker/config
        target: /config
    x-casaos:
      envs:
        - container: APP_KEY
          description:
            en_US: Required secret; configure a unique value before deployment
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "80"
          description:
            en_US: Port 80/tcp
        - container: "443"
          description:
            en_US: Port 443/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  tips:
    before_install:
      en_US: "SECURITY: Configure required Compose variables SPEEDTEST_TRACKER_APP_KEY before installing. The ZimaOS v2 catalog builder strips service-level x-casaos.envs, so automatic password entry is NOT confirmed. Do not install until your ZimaOS installer securely injects these values. No default credentials are provided. See docs/SECURE_DEPLOYMENT.md in MrStore."
      pt_PT: "SEGURANÇA: Configura as variáveis Compose obrigatórias SPEEDTEST_TRACKER_APP_KEY antes da instalação. O builder ZimaOS v2 remove os campos x-casaos.envs dos serviços; não está confirmado que a interface peça credenciais. Não instales até o ZimaOS conseguir transmitir os valores com segurança. Não existem passwords predefinidas. Consulta docs/SECURE_DEPLOYMENT.md na MrStore."
  id: io.github.mrpiracy94.speedtest-tracker
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: speedtest-tracker
  author: MrStore
  developer: LinuxServer.io
  category: Networking
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/speedtest-tracker.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/speedtest-tracker.png
  title:
    en_US: "Speedtest Tracker"
  tagline:
    en_US: "Speedtest Tracker (LinuxServer.io)"
  description:
    en_US: "Speedtest Tracker — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/speedtest-tracker:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-speedtest-tracker/"
  port_map: "20010"
  index: /
