name: pocket-id
services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:latest
    container_name: pocket-id
    restart: unless-stopped
    environment:
      - "APP_URL=http://zimaos.local:1411"
      - "TRUST_PROXY=true"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 1411
        published: "1411"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pocket-id
        target: /app/data
    x-casaos:
      envs:
        - container: APP_URL
          description:
            en_US: APP_URL
        - container: TRUST_PROXY
          description:
            en_US: TRUST_PROXY
        - container: TZ
          description:
            en_US: TZ
      ports:
        - container: "1411"
          description:
            en_US: Port 1411/tcp
      volumes:
        - container: /app/data
          description:
            en_US: /app/data

x-casaos:
  id: io.github.mrpiracy94.pocket-id
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: pocket-id
  author: MrStore
  developer: Pocket ID
  category: Networking
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/pocket-id.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/pocket-id.png
  title:
    en_US: "Pocket ID"
  tagline:
    en_US: "Servidor OIDC simples com passkeys"
  description:
    en_US: "Servidor OIDC simples com passkeys. Estado: verificado em out/2026 (ativo, discussão de out/2026). Confirma portas e variáveis na documentação do projeto."
  port_map: "1411"
  index: /
