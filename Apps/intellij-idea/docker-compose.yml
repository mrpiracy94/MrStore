name: intellij-idea
services:
  intellij-idea:
    image: lscr.io/linuxserver/intellij-idea:latest
    container_name: intellij-idea
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=IntelliJ IDEA"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21076"
        protocol: tcp
      - target: 3001
        published: "21077"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/intellij-idea/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.intellij-idea
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
  main: intellij-idea
  author: MrStore
  developer: LinuxServer.io
  category: Developer
  icon: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/intellij-idea/icon.svg
  thumbnail: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/intellij-idea/icon.svg
  title:
    en_US: "IntelliJ IDEA"
  tagline:
    en_US: "IntelliJ IDEA (LinuxServer.io)"
  description:
    en_US: "IntelliJ IDEA — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/intellij-idea:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-intellij-idea/"
  port_map: "21076"
  index: /
