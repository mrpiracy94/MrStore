name: sqlitebrowser
services:
  sqlitebrowser:
    image: lscr.io/linuxserver/sqlitebrowser:latest
    container_name: sqlitebrowser
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=DB Browser for SQLite"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21146"
        protocol: tcp
      - target: 3001
        published: "21147"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/sqlitebrowser/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.sqlitebrowser
  version: "1.0.1"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: sqlitebrowser
  author: MrStore
  developer: LinuxServer.io
  category: Developer
  icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/57e939e504eda0ea764098015da93aa666ad6f31/png/sqlitebrowser.png
  thumbnail: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/57e939e504eda0ea764098015da93aa666ad6f31/png/sqlitebrowser.png
  title:
    en_US: "DB Browser for SQLite"
  tagline:
    en_US: "DB Browser for SQLite (LinuxServer.io)"
  description:
    en_US: "DB Browser for SQLite — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/sqlitebrowser:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-sqlitebrowser/"
  port_map: "21146"
  index: /
