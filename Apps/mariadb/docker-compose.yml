name: mariadb
services:
  mariadb:
    image: lscr.io/linuxserver/mariadb:latest
    container_name: mariadb
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD before deployment}"
    ports:
      - target: 3306
        published: "3306"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mariadb/config
        target: /config
    x-casaos:
      envs:
        - container: MYSQL_ROOT_PASSWORD
          description:
            en_US: Required secret; configure a unique value before deployment
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3306"
          description:
            en_US: Port 3306/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  tips:
    before_install:
      en_US: "SECURITY: Configure required Compose variables MARIADB_ROOT_PASSWORD before installing. The ZimaOS v2 catalog builder strips service-level x-casaos.envs, so automatic password entry is NOT confirmed. Do not install until your ZimaOS installer securely injects these values. No default credentials are provided. See docs/SECURE_DEPLOYMENT.md in MrStore."
      pt_PT: "SEGURANÇA: Configura as variáveis Compose obrigatórias MARIADB_ROOT_PASSWORD antes da instalação. O builder ZimaOS v2 remove os campos x-casaos.envs dos serviços; não está confirmado que a interface peça credenciais. Não instales até o ZimaOS conseguir transmitir os valores com segurança. Não existem passwords predefinidas. Consulta docs/SECURE_DEPLOYMENT.md na MrStore."
  id: io.github.mrpiracy94.mariadb
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: mariadb
  author: MrStore
  developer: LinuxServer.io
  category: Developer
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/mariadb.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/mariadb.png
  title:
    en_US: "MariaDB"
  tagline:
    en_US: "MariaDB (LinuxServer.io)"
  description:
    en_US: "MariaDB — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/mariadb:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-mariadb/"
  port_map: "3306"
  index: /
