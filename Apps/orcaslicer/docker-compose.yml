name: orcaslicer
services:
  orcaslicer:
    image: lscr.io/linuxserver/orcaslicer:latest
    container_name: orcaslicer
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=OrcaSlicer"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21112"
        protocol: tcp
      - target: 3001
        published: "21113"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/orcaslicer/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.orcaslicer
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: orcaslicer
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/orcaslicer.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/orcaslicer.png
  title:
    en_US: "OrcaSlicer"
  tagline:
    en_US: "OrcaSlicer (LinuxServer.io)"
  description:
    en_US: "OrcaSlicer — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/orcaslicer:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-orcaslicer/"
  port_map: "21112"
  index: /
