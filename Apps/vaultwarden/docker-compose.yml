name: vaultwarden
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
      - "SIGNUPS_ALLOWED=false"
    ports:
      - target: 80
        published: "30003"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vaultwarden
        target: /data
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: TZ
        - container: SIGNUPS_ALLOWED
          description:
            en_US: SIGNUPS_ALLOWED
      ports:
        - container: "80"
          description:
            en_US: Port 80/tcp
      volumes:
        - container: /data
          description:
            en_US: /data

x-casaos:
  id: io.github.mrpiracy94.vaultwarden
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: vaultwarden
  author: MrStore
  developer: Vaultwarden
  category: Others
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/vaultwarden.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/vaultwarden.png
  title:
    en_US: "Vaultwarden"
  tagline:
    en_US: "Servidor compatível com Bitwarden"
  description:
    en_US: "Servidor compatível com Bitwarden. Estado: projeto muito ativo (conhecimento até meados de 2026); NÃO verificado em out/2026. Confirma portas e variáveis na documentação do projeto."
  port_map: "30003"
  index: /
