name: vaultwarden
services:
  vaultwarden:
    image: vaultwarden/server:1.37.4-alpine
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
      - "SIGNUPS_ALLOWED=false"
    ports:
      - target: 80
        published: "30003"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vaultwarden
        target: /data
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: TZ
        - container: SIGNUPS_ALLOWED
          description:
            en_US: SIGNUPS_ALLOWED
      ports:
        - container: "80"
          description:
            en_US: Port 80/tcp
      volumes:
        - container: /data
          description:
            en_US: /data

x-casaos:
  id: io.github.mrpiracy94.vaultwarden
  version: "1.0.2"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: vaultwarden
  author: MrStore
  developer: Vaultwarden
  category: Others
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/vaultwarden.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/vaultwarden.png
  title:
    en_US: "Vaultwarden"
    pt_PT: "Vaultwarden"
  tagline:
    en_US: "Servidor compatível com Bitwarden"
  description:
    en_US: "Servidor compatível com Bitwarden. Variante Alpine oficial fixada na versão 1.37.4 para reduzir CVEs sem mudar a versão do Vaultwarden. Os dados continuam em /DATA/AppData/vaultwarden. Antes de atualizar: parar o contentor, fazer backup completo do diretório e testar login, cofres, anexos e sincronização após a atualização. Não expor sem HTTPS."
    pt_PT: "Servidor de palavras-passe compatível com clientes Bitwarden. O registo de novas contas está desativado por predefinição. Protege os dados em /DATA/AppData/vaultwarden, faz backups e utiliza HTTPS antes de expor o serviço."
  port_map: "30003"
  index: /
