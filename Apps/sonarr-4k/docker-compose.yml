name: sonarr-4k
services:
  sonarr-4k:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr-4k
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8989
        published: "20067"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/sonarr-4k/config
        target: /config
      - type: bind
        source: /DATA/Media/TV4K
        target: /tv
      - type: bind
        source: /DATA/Downloads
        target: /downloads
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "8989"
          description:
            en_US: Port 8989/tcp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /tv
          description:
            en_US: /tv
        - container: /downloads
          description:
            en_US: /downloads

x-casaos:
  id: io.github.mrpiracy94.sonarr-4k
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: sonarr-4k
  author: MrStore
  developer: LinuxServer.io
  category: Media
  icon: https://seedit4.me/assets/img/icons/software/sonarr.png
  thumbnail: https://seedit4.me/assets/img/icons/software/sonarr.png
  title:
    en_US: "Sonarr 4K"
  tagline:
    en_US: "Sonarr 4K (seedit4.me catalog (instância extra))"
  description:
    en_US: "Sonarr 4K — origem: seedit4.me catalog (instância extra). Imagem: lscr.io/linuxserver/sonarr:latest. Verifica portas/variáveis na documentação do projeto."
  port_map: "20067"
  index: /
