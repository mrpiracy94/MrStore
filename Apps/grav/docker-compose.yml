name: grav
services:
  grav:
    image: lscr.io/linuxserver/grav:latest
    container_name: grav
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 80
        published: "20031"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "80"
          description:
            en_US: Port 80/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.grav
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: grav
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/grav.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/grav.png
  title:
    en_US: "Grav"
  tagline:
    en_US: "Grav (LinuxServer.io)"
  description:
    en_US: "Grav — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/grav:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-grav/"
  port_map: "20031"
  index: /
