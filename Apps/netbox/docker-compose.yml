name: netbox
services:
  netbox:
    image: lscr.io/linuxserver/netbox:latest
    container_name: netbox
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "SUPERUSER_EMAIL=admin@example.com"
      - "SUPERUSER_PASSWORD=${NETBOX_SUPERUSER_PASSWORD:?Set NETBOX_SUPERUSER_PASSWORD before deployment}"
      - "ALLOWED_HOST=*"
      - "DB_NAME=netbox"
      - "DB_USER=netbox"
      - "DB_PASSWORD=${NETBOX_DB_PASSWORD:?Set NETBOX_DB_PASSWORD before deployment}"
      - "DB_HOST=netbox_db"
      - "DB_PORT=5432"
      - "REDIS_HOST=netbox_redis"
      - "REDIS_PORT=6379"
    ports:
      - target: 8000
        published: "20048"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/netbox/config
        target: /config
    x-casaos:
      envs:
        - container: SUPERUSER_PASSWORD
          description:
            en_US: Required secret; configure a unique value before deployment
        - container: DB_PASSWORD
          description:
            en_US: Required secret; configure a unique value before deployment
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "8000"
          description:
            en_US: Port 8000/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  tips:
    before_install:
      en_US: "SECURITY: Configure required Compose variables NETBOX_SUPERUSER_PASSWORD, NETBOX_DB_PASSWORD before installing. The ZimaOS v2 catalog builder strips service-level x-casaos.envs, so automatic password entry is NOT confirmed. Do not install until your ZimaOS installer securely injects these values. No default credentials are provided. See docs/SECURE_DEPLOYMENT.md in MrStore."
      pt_PT: "SEGURANÇA: Configura as variáveis Compose obrigatórias NETBOX_SUPERUSER_PASSWORD, NETBOX_DB_PASSWORD antes da instalação. O builder ZimaOS v2 remove os campos x-casaos.envs dos serviços; não está confirmado que a interface peça credenciais. Não instales até o ZimaOS conseguir transmitir os valores com segurança. Não existem passwords predefinidas. Consulta docs/SECURE_DEPLOYMENT.md na MrStore."
  id: io.github.mrpiracy94.netbox
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: netbox
  author: MrStore
  developer: LinuxServer.io
  category: Developer
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/netbox.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/netbox.png
  title:
    en_US: "NetBox"
  tagline:
    en_US: "NetBox (LinuxServer.io)"
  description:
