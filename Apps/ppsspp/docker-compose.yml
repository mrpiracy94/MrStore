name: ppsspp
services:
  ppsspp:
    image: lscr.io/linuxserver/ppsspp:latest
    container_name: ppsspp
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=PPSSPP"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21118"
        protocol: tcp
      - target: 3001
        published: "21119"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ppsspp/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.ppsspp
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: ppsspp
  author: MrStore
  developer: LinuxServer.io
  category: Others
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/ppsspp.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/ppsspp.png
  title:
    en_US: "PPSSPP"
  tagline:
    en_US: "PPSSPP (LinuxServer.io)"
  description:
    en_US: "PPSSPP — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/ppsspp:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-ppsspp/"
  port_map: "21118"
  index: /
