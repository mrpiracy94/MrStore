name: gitea
services:
  gitea:
    image: docker.io/gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    environment:
      - "USER_UID=1000"
      - "USER_GID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 3000
        published: "30000"
        protocol: tcp
      - target: 22
        published: "30001"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gitea
        target: /data
    x-casaos:
      envs:
        - container: USER_UID
          description:
            en_US: USER_UID
        - container: USER_GID
          description:
            en_US: USER_GID
        - container: TZ
          description:
            en_US: TZ
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "22"
          description:
            en_US: Port 22/tcp
      volumes:
        - container: /data
          description:
            en_US: /data

x-casaos:
  id: io.github.mrpiracy94.gitea
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: gitea
  author: MrStore
  developer: Gitea
  category: Developer
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/gitea.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/gitea.png
  title:
    en_US: "Gitea"
  tagline:
    en_US: "Servidor Git self-hosted"
  description:
    en_US: "Servidor Git self-hosted. Estado: verificado em out/2026 (v28.0.0, out/2026). Confirma portas e variáveis na documentação do projeto."
  port_map: "30000"
  index: /
