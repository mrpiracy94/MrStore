name: planka
services:
  planka:
    image: lscr.io/linuxserver/planka:latest
    container_name: planka
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "BASE_URL=http://zimaos.local:1337"
      - "DATABASE_URL=postgresql://postgres@planka_db/planka"
      - "SECRET_KEY=${PLANKA_SECRET_KEY:?Set PLANKA_SECRET_KEY before deployment}"
    ports:
      - target: 1337
        published: "1337"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/planka/config
        target: /config
    x-casaos:
      envs:
        - container: SECRET_KEY
          description:
            en_US: Required secret; configure a unique value before deployment
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "1337"
          description:
            en_US: Port 1337/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  tips:
    before_install:
      en_US: "SECURITY: Configure required Compose variables PLANKA_SECRET_KEY before installing. The ZimaOS v2 catalog builder strips service-level x-casaos.envs, so automatic password entry is NOT confirmed. Do not install until your ZimaOS installer securely injects these values. No default credentials are provided. See docs/SECURE_DEPLOYMENT.md in MrStore."
      pt_PT: "SEGURANÇA: Configura as variáveis Compose obrigatórias PLANKA_SECRET_KEY antes da instalação. O builder ZimaOS v2 remove os campos x-casaos.envs dos serviços; não está confirmado que a interface peça credenciais. Não instales até o ZimaOS conseguir transmitir os valores com segurança. Não existem passwords predefinidas. Consulta docs/SECURE_DEPLOYMENT.md na MrStore."
  id: io.github.mrpiracy94.planka
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: planka
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/planka.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/planka.png
  title:
    en_US: "Planka"
  tagline:
    en_US: "Planka (LinuxServer.io)"
  description:
    en_US: "Planka — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/planka:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-planka/"
  port_map: "1337"
  index: /
