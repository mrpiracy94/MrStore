name: planka
services:
  planka:
    image: lscr.io/linuxserver/planka:latest
    container_name: planka
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "BASE_URL=http://zimaos.local:1337"
      - "DATABASE_URL=postgresql://postgres@planka_db/planka"
      - "SECRET_KEY=${PLANKA_SECRET_KEY:?Set PLANKA_SECRET_KEY before deployment}"
    ports:
      - target: 1337
        published: "1337"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/planka/config
        target: /config
    x-casaos:
      envs:
        - container: SECRET_KEY
          description:
            en_US: Required secret; configure a unique value before deployment
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "1337"
          description:
            en_US: Port 1337/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.planka
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: planka
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/planka.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/planka.png
  title:
    en_US: "Planka"
  tagline:
    en_US: "Planka (LinuxServer.io)"
  description:
    en_US: "Planka — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/planka:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-planka/"
  port_map: "1337"
  index: /
