name: libreoffice
services:
  libreoffice:
    image: lscr.io/linuxserver/libreoffice:latest
    container_name: libreoffice
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=LibreOffice"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21088"
        protocol: tcp
      - target: 3001
        published: "21089"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/libreoffice/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.libreoffice
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: libreoffice
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/libreoffice.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/libreoffice.png
  title:
    en_US: "LibreOffice"
  tagline:
    en_US: "LibreOffice (LinuxServer.io)"
  description:
    en_US: "LibreOffice — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/libreoffice:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-libreoffice/"
  port_map: "21088"
  index: /
