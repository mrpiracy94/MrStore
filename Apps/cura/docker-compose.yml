name: cura
services:
  cura:
    image: lscr.io/linuxserver/cura:latest
    container_name: cura
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Cura"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21036"
        protocol: tcp
      - target: 3001
        published: "21037"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/cura/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.cura
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
  main: cura
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/png/cura.png
  thumbnail: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/png/cura.png
  title:
    en_US: "Cura"
  tagline:
    en_US: "Cura (LinuxServer.io)"
  description:
    en_US: "Cura — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/cura:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-cura/"
  port_map: "21036"
  index: /
