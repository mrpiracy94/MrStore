name: qbittorrent
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "WEBUI_PORT=8080"
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
      - target: 6881
        published: "6881"
        protocol: tcp
      - target: 6881
        published: "6881"
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/qbittorrent/config
        target: /config
      - type: bind
        source: /DATA/Downloads
        target: /downloads
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "8080"
          description:
            en_US: Port 8080/tcp
        - container: "6881"
          description:
            en_US: Port 6881/tcp
        - container: "6881"
          description:
            en_US: Port 6881/udp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /downloads
          description:
            en_US: /downloads

x-casaos:
  id: io.github.mrpiracy94.qbittorrent
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: qbittorrent
  author: MrStore
  developer: LinuxServer.io
  category: Networking
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/qbittorrent.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/qbittorrent.png
  title:
    en_US: "qBittorrent"
    pt_PT: "qBittorrent"
  tagline:
    en_US: "qBittorrent (LinuxServer.io)"
  description:
    en_US: "qBittorrent — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/qbittorrent:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-qbittorrent/"
    pt_PT: "Cliente BitTorrent com interface web para gerir torrents e transferências. Guarda a configuração em /DATA/AppData/qbittorrent/config e os downloads em /DATA/Downloads. Confirma a porta 8080 e as permissões antes de instalar."
  port_map: "8080"
  index: /
