name: beets
services:
  beets:
    image: ghcr.io/mrpiracy94/mrstore-python-beets@sha256:731e25db040b766afade34c113195d361575806de141f6b1227447ae64ad1ab0
    container_name: beets
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8337
        published: "8337"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/beets/config
        target: /config
      - type: bind
        source: /DATA/Media/Music
        target: /music
      - type: bind
        source: /DATA/Downloads
        target: /downloads
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "8337"
          description:
            en_US: Port 8337/tcp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /music
          description:
            en_US: /music
        - container: /downloads
          description:
            en_US: /downloads

x-casaos:
  id: io.github.mrpiracy94.beets
  version: "1.0.1"
  update_at: "2026-10-10"
  architectures:
    - amd64
    - arm64
  main: beets
  author: MrStore
  developer: LinuxServer.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/beets.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/beets.png
  title:
    en_US: "Beets"
  tagline:
    en_US: "Beets (LinuxServer.io)"
  description:
    en_US: "Beets — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/beets:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-beets/"
  port_map: "8337"
  index: /
