name: qbittorrent-4
services:
  qbittorrent-4:
    image: ghcr.io/mrpiracy94/mrstore-qbittorrent:5.2.4-libtorrentv1-secfix-20261009@sha256:6e0475093e34571c90fc0d1ede2920ca847f1b4a1ac127351931eab6e12c6c4c
    container_name: qbittorrent-4
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "WEBUI_PORT=8080"
    ports:
      - target: 8080
        published: "20069"
        protocol: tcp
      - target: 6881
        published: "20070"
        protocol: tcp
      - target: 6881
        published: "6883"
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/qbittorrent-4/config
        target: /config
      - type: bind
        source: /DATA/Downloads
        target: /downloads
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "8080"
          description:
            en_US: Port 8080/tcp
        - container: "6881"
          description:
            en_US: Port 6881/tcp
        - container: "6881"
          description:
            en_US: Port 6881/udp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /downloads
          description:
            en_US: /downloads

x-casaos:
  id: io.github.mrpiracy94.qbittorrent-4
  version: "1.1.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: qbittorrent-4
  author: MrStore
  developer: LinuxServer.io
  category: Networking
  icon: https://seedit4.me/assets/img/icons/software/qbittorrent.png
  thumbnail: https://seedit4.me/assets/img/icons/software/qbittorrent.png
  title:
    en_US: "qBittorrent 5.2 (libtorrent v1)"
  tagline:
    en_US: "Cliente BitTorrent 5.2 com libtorrent v1"
  description:
    en_US: "Variante corrigida de segurança do antigo qBittorrent 4.x, agora 5.2.4 com libtorrent v1. Imagem GitHub GHCR fixada por digest após análise HIGH/CRITICAL sem achados em AMD64 e ARM64. Mantém o ID de catálogo anterior para não perder a ligação às instalações. Antes de atualizar uma instalação 4.x existente: pára o contentor, cria uma cópia de segurança completa de /DATA/AppData/qbittorrent-4/config e confirma compatibilidade, permissões e WebUI. Não é uma migração automática garantida. Fonte: https://docs.linuxserver.io/images/docker-qbittorrent/"
  port_map: "20069"
  index: /
