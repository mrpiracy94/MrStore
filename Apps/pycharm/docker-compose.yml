name: pycharm
services:
  pycharm:
    image: lscr.io/linuxserver/pycharm:latest
    container_name: pycharm
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=PyCharm"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21120"
        protocol: tcp
      - target: 3001
        published: "21121"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pycharm/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.pycharm
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: pycharm
  author: MrStore
  developer: LinuxServer.io
  category: Developer
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/pycharm.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/pycharm.png
  title:
    en_US: "PyCharm"
  tagline:
    en_US: "PyCharm (LinuxServer.io)"
  description:
    en_US: "PyCharm — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/pycharm:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-pycharm/"
  port_map: "21120"
  index: /
