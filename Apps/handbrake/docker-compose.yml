name: handbrake
services:
  handbrake:
    image: lscr.io/linuxserver/handbrake:latest
    container_name: handbrake
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=HandBrake"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21070"
        protocol: tcp
      - target: 3001
        published: "21071"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/handbrake/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.handbrake
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
  main: handbrake
  author: MrStore
  developer: LinuxServer.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/handbrake.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/handbrake.png
  title:
    en_US: "HandBrake"
  tagline:
    en_US: "HandBrake (LinuxServer.io)"
  description:
    en_US: "HandBrake — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/handbrake:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-handbrake/"
  port_map: "21070"
  index: /
