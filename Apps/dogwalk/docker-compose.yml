name: dogwalk
services:
  dogwalk:
    image: lscr.io/linuxserver/dogwalk:latest
    container_name: dogwalk
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Dogwalk"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21006"
        protocol: tcp
      - target: 3001
        published: "21007"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/dogwalk/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.dogwalk
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
  main: dogwalk
  author: MrStore
  developer: LinuxServer.io
  category: Others
  icon: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/dogwalk/icon.svg
  thumbnail: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/dogwalk/icon.svg
  title:
    en_US: "Dogwalk"
  tagline:
    en_US: "Dogwalk (LinuxServer.io)"
  description:
    en_US: "Dogwalk — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/dogwalk:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-dogwalk/"
  port_map: "21006"
  index: /
