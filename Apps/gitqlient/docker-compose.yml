name: gitqlient
services:
  gitqlient:
    image: lscr.io/linuxserver/gitqlient:latest
    container_name: gitqlient
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=GitQlient"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21066"
        protocol: tcp
      - target: 3001
        published: "21067"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gitqlient/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.gitqlient
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: gitqlient
  author: MrStore
  developer: LinuxServer.io
  category: Developer
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/gitqlient.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/gitqlient.png
  title:
    en_US: "GitQlient"
  tagline:
    en_US: "GitQlient (LinuxServer.io)"
  description:
    en_US: "GitQlient — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/gitqlient:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-gitqlient/"
  port_map: "21066"
  index: /
