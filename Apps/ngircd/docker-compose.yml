name: ngircd
services:
  ngircd:
    image: ghcr.io/mrpiracy94/mrstore-lowcve-ngircd:secfix-38353c004df31ee7ac721591496f8937b9013dc9@sha256:8ec35cbc9b8cfbc0ba5645a2a7274662e48b3d706d2447a5f2781195847cc40a
    container_name: ngircd
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 6667
        published: "6667"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ngircd/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "6667"
          description:
            en_US: Port 6667/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.ngircd
  version: "1.0.1"
  update_at: "2026-10-10"
  architectures:
    - amd64
    - arm64
  main: ngircd
  author: MrStore
  developer: LinuxServer.io
  category: Social
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/c00fb6e6dc50b59217a915188be27d0ea55801c8/linuxserver.io/img/ngircd-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/c00fb6e6dc50b59217a915188be27d0ea55801c8/linuxserver.io/img/ngircd-icon.png
  title:
    en_US: "ngIRCd"
  tagline:
    en_US: "ngIRCd (LinuxServer.io)"
  description:
    en_US: "ngIRCd — imagem LinuxServer recompilada com atualizações de segurança, fixada por digest imutável. Trivy 0 HIGH e 0 CRITICAL em AMD64/ARM64, TCP 6667 e persistência /config verificados em CI. Confirma compatibilidade na tua instalação ZimaOS antes de atualizar; mantém backup de /DATA/AppData/ngircd/config. Docs: https://docs.linuxserver.io/images/docker-ngircd/"
  port_map: "6667"
  index: /
