name: mosquitto
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - target: 1883
        published: "1883"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mosquitto/config
        target: /mosquitto/config
      - type: bind
        source: /DATA/AppData/mosquitto/data
        target: /mosquitto/data
      - type: bind
        source: /DATA/AppData/mosquitto/log
        target: /mosquitto/log
    x-casaos:
      envs: []
      ports:
        - container: "1883"
          description:
            en_US: Port 1883/tcp
      volumes:
        - container: /mosquitto/config
          description:
            en_US: /mosquitto/config
        - container: /mosquitto/data
          description:
            en_US: /mosquitto/data
        - container: /mosquitto/log
          description:
            en_US: /mosquitto/log

x-casaos:
  id: io.github.mrpiracy94.mosquitto
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: mosquitto
  author: MrStore
  developer: Mosquitto
  category: Home
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/mosquitto.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/mosquitto.png
  title:
    en_US: "Mosquitto"
  tagline:
    en_US: "Broker MQTT"
  description:
    en_US: "Broker MQTT. Estado: projeto muito ativo (conhecimento até meados de 2026); NÃO verificado em out/2026. Confirma portas e variáveis na documentação do projeto. Cria o ficheiro mosquitto.conf em /DATA/AppData/mosquitto/config (a v2 não aceita ligações remotas sem configuração)."
  port_map: "1883"
  index: /
