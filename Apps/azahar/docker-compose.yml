name: azahar
services:
  azahar:
    image: lscr.io/linuxserver/azahar:latest
    container_name: azahar
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Azahar"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21018"
        protocol: tcp
      - target: 3001
        published: "21019"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/azahar/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.azahar
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: azahar
  author: MrStore
  developer: LinuxServer.io
  category: Others
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/azahar.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/azahar.png
  title:
    en_US: "Azahar"
  tagline:
    en_US: "Azahar (LinuxServer.io)"
  description:
    en_US: "Azahar — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/azahar:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-azahar/"
  port_map: "21018"
  index: /
