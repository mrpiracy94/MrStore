name: adguardhome-sync
services:
  adguardhome-sync:
    image: lscr.io/linuxserver/adguardhome-sync:latest
    container_name: adguardhome-sync
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8080
        published: "20016"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/adguardhome-sync/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "8080"
          description:
            en_US: Port 8080/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.adguardhome-sync
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: adguardhome-sync
  author: MrStore
  developer: LinuxServer.io
  category: Networking
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/adguardhome-sync.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/adguardhome-sync.png
  title:
    en_US: "AdGuardHome Sync"
  tagline:
    en_US: "AdGuardHome Sync (LinuxServer.io)"
  description:
    en_US: "AdGuardHome Sync — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/adguardhome-sync:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-adguardhome-sync/"
  port_map: "20016"
  index: /
