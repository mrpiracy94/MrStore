name: ferdium
services:
  ferdium:
    image: lscr.io/linuxserver/ferdium:latest
    container_name: ferdium
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Ferdium"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21052"
        protocol: tcp
      - target: 3001
        published: "21053"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ferdium/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.ferdium
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: ferdium
  author: MrStore
  developer: LinuxServer.io
  category: Social
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/ferdium.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/ferdium.png
  title:
    en_US: "Ferdium"
  tagline:
    en_US: "Ferdium (LinuxServer.io)"
  description:
    en_US: "Ferdium — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/ferdium:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-ferdium/"
  port_map: "21052"
  index: /
