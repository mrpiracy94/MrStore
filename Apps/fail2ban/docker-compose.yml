name: fail2ban
services:
  fail2ban:
    image: lscr.io/linuxserver/fail2ban:latest
    container_name: fail2ban
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    cap_add:
      - NET_ADMIN
    volumes:
      - type: bind
        source: /DATA/AppData/fail2ban/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.fail2ban
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: fail2ban
  author: MrStore
  developer: LinuxServer.io
  category: Networking
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/fail2ban.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/fail2ban.png
  title:
    en_US: "Fail2ban"
  tagline:
    en_US: "Fail2ban (LinuxServer.io)"
  description:
    en_US: "Fail2ban — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/fail2ban:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-fail2ban/"
  port_map: "0"
  index: /
