name: oscam
services:
  oscam:
    image: lscr.io/linuxserver/oscam:latest
    container_name: oscam
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8888
        published: "20052"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/oscam/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "8888"
          description:
            en_US: Port 8888/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.oscam
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: oscam
  author: MrStore
  developer: LinuxServer.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/oscam.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/oscam.png
  title:
    en_US: "OSCam"
  tagline:
    en_US: "OSCam (LinuxServer.io)"
  description:
    en_US: "OSCam — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/oscam:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-oscam/"
  port_map: "20052"
  index: /
