name: frigate
services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    shm_size: "512mb"
    environment:
      - "TZ=Europe/Lisbon"
      - "FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD:?Set FRIGATE_RTSP_PASSWORD before deployment}"
    ports:
      - target: 8971
        published: "8971"
        protocol: tcp
      - target: 8554
        published: "8554"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/frigate/config
        target: /config
      - type: bind
        source: /DATA/Media/Frigate
        target: /media/frigate
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: TZ
        - container: FRIGATE_RTSP_PASSWORD
          description:
            en_US: FRIGATE_RTSP_PASSWORD
      ports:
        - container: "8971"
          description:
            en_US: Port 8971/tcp
        - container: "8554"
          description:
            en_US: Port 8554/tcp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /media/frigate
          description:
            en_US: /media/frigate
        - container: /etc/localtime
          description:
            en_US: /etc/localtime

x-casaos:
  tips:
    before_install:
      en_US: "SECURITY: Configure required Compose variables FRIGATE_RTSP_PASSWORD before installing. The ZimaOS v2 catalog builder strips service-level x-casaos.envs, so automatic password entry is NOT confirmed. Do not install until your ZimaOS installer securely injects these values. No default credentials are provided. See docs/SECURE_DEPLOYMENT.md in MrStore."
      pt_PT: "SEGURANÇA: Configura as variáveis Compose obrigatórias FRIGATE_RTSP_PASSWORD antes da instalação. O builder ZimaOS v2 remove os campos x-casaos.envs dos serviços; não está confirmado que a interface peça credenciais. Não instales até o ZimaOS conseguir transmitir os valores com segurança. Não existem passwords predefinidas. Consulta docs/SECURE_DEPLOYMENT.md na MrStore."
  id: io.github.mrpiracy94.frigate
  version: "1.0.1"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: frigate
  author: MrStore
  developer: Frigate
  category: Home
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/frigate.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/frigate.png
  title:
    en_US: "Frigate"
  tagline:
    en_US: "NVR com deteção de objetos"
  description:
    en_US: "NVR com deteção de objetos. Estado: projeto muito ativo (conhecimento até meados de 2026); NÃO verificado em out/2026. Confirma portas e variáveis na documentação do projeto. Precisa de config.yml com as tuas câmaras. Por segurança, o container não é privilegiado por omissão. Aceleração por hardware exige mapear explicitamente os dispositivos necessários (ver docs)."
  port_map: "8971"
  index: /
