name: freecad
services:
  freecad:
    image: lscr.io/linuxserver/freecad:latest
    container_name: freecad
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=FreeCAD"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21060"
        protocol: tcp
      - target: 3001
        published: "21061"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/freecad/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.freecad
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: freecad
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/freecad.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/freecad.png
  title:
    en_US: "FreeCAD"
  tagline:
    en_US: "FreeCAD (LinuxServer.io)"
  description:
    en_US: "FreeCAD — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/freecad:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-freecad/"
  port_map: "21060"
  index: /
