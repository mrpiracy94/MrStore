name: scummvm
services:
  scummvm:
    image: lscr.io/linuxserver/scummvm:latest
    container_name: scummvm
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=ScummVM"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21134"
        protocol: tcp
      - target: 3001
        published: "21135"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/scummvm/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.scummvm
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
  main: scummvm
  author: MrStore
  developer: LinuxServer.io
  category: Others
  icon: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/scummvm/icon.svg
  thumbnail: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/scummvm/icon.svg
  title:
    en_US: "ScummVM"
  tagline:
    en_US: "ScummVM (LinuxServer.io)"
  description:
    en_US: "ScummVM — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/scummvm:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-scummvm/"
  port_map: "21134"
  index: /
