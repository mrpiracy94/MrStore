name: sabnzbd
services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8080
        published: "20001"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/sabnzbd/config
        target: /config
      - type: bind
        source: /DATA/Downloads
        target: /downloads
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "8080"
          description:
            en_US: Port 8080/tcp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /downloads
          description:
            en_US: /downloads

x-casaos:
  id: io.github.mrpiracy94.sabnzbd
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: sabnzbd
  author: MrStore
  developer: LinuxServer.io
  category: Networking
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/sabnzbd.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/sabnzbd.png
  title:
    en_US: "SABnzbd"
  tagline:
    en_US: "SABnzbd (LinuxServer.io)"
  description:
    en_US: "SABnzbd — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/sabnzbd:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-sabnzbd/"
  port_map: "20001"
  index: /
