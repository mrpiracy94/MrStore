name: telegram
services:
  telegram:
    image: lscr.io/linuxserver/telegram:latest
    container_name: telegram
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Telegram"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21152"
        protocol: tcp
      - target: 3001
        published: "21153"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/telegram/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.telegram
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: telegram
  author: MrStore
  developer: LinuxServer.io
  category: Social
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/telegram.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/telegram.png
  title:
    en_US: "Telegram"
  tagline:
    en_US: "Telegram (LinuxServer.io)"
  description:
    en_US: "Telegram — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/telegram:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-telegram/"
  port_map: "21152"
  index: /
