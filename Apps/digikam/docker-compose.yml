name: digikam
services:
  digikam:
    image: lscr.io/linuxserver/digikam:latest
    container_name: digikam
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=digiKam"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21040"
        protocol: tcp
      - target: 3001
        published: "21041"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/digikam/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.digikam
  version: "1.0.1"
  update_at: "2026-10-09"
  architectures:
    - amd64
  main: digikam
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://raw.githubusercontent.com/selfhst/icons/2053b70b283ffed5f2cc1424d1e17d9c554a846d/png/digikam.png
  thumbnail: https://raw.githubusercontent.com/selfhst/icons/2053b70b283ffed5f2cc1424d1e17d9c554a846d/png/digikam.png
  title:
    en_US: "digiKam"
  tagline:
    en_US: "digiKam (LinuxServer.io)"
  description:
    en_US: "digiKam — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/digikam:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-digikam/"
  port_map: "21040"
  index: /
