name: signal
services:
  signal:
    image: lscr.io/linuxserver/signal:latest
    container_name: signal
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Signal"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21142"
        protocol: tcp
      - target: 3001
        published: "21143"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/signal/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.signal
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: signal
  author: MrStore
  developer: LinuxServer.io
  category: Social
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/signal.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/signal.png
  title:
    en_US: "Signal"
  tagline:
    en_US: "Signal (LinuxServer.io)"
  description:
    en_US: "Signal — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/signal:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-signal/"
  port_map: "21142"
  index: /
