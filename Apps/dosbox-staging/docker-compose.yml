name: dosbox-staging
services:
  dosbox-staging:
    image: lscr.io/linuxserver/dosbox-staging:latest
    container_name: dosbox-staging
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=DOSBox Staging"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21044"
        protocol: tcp
      - target: 3001
        published: "21045"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/dosbox-staging/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.dosbox-staging
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: dosbox-staging
  author: MrStore
  developer: LinuxServer.io
  category: Others
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/dosbox-staging.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/dosbox-staging.png
  title:
    en_US: "DOSBox Staging"
  tagline:
    en_US: "DOSBox Staging (LinuxServer.io)"
  description:
    en_US: "DOSBox Staging — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/dosbox-staging:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-dosbox-staging/"
  port_map: "21044"
  index: /
