name: vlc
services:
  vlc:
    image: lscr.io/linuxserver/vlc:latest
    container_name: vlc
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=VLC"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21160"
        protocol: tcp
      - target: 3001
        published: "21161"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vlc/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.vlc
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: vlc
  author: MrStore
  developer: LinuxServer.io
  category: Media
  icon: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/vlc/icon.svg
  thumbnail: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/vlc/icon.svg
  title:
    en_US: "VLC"
  tagline:
    en_US: "VLC (LinuxServer.io)"
  description:
    en_US: "VLC — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/vlc:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-vlc/"
  port_map: "21160"
  index: /
