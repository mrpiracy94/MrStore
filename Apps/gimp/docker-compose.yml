name: gimp
services:
  gimp:
    image: lscr.io/linuxserver/gimp:latest
    container_name: gimp
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=GIMP"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21062"
        protocol: tcp
      - target: 3001
        published: "21063"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gimp/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.gimp
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: gimp
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/gimp.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/gimp.png
  title:
    en_US: "GIMP"
  tagline:
    en_US: "GIMP (LinuxServer.io)"
  description:
    en_US: "GIMP — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/gimp:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-gimp/"
  port_map: "21062"
  index: /
