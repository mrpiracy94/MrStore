name: tdarr
services:
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "serverIP=0.0.0.0"
      - "serverPort=8266"
      - "webUIPort=8265"
      - "internalNode=true"
      - "nodeName=InternalNode"
    ports:
      - target: 8265
        published: "8265"
        protocol: tcp
      - target: 8266
        published: "8266"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/tdarr/server
        target: /app/server
      - type: bind
        source: /DATA/AppData/tdarr/configs
        target: /app/configs
      - type: bind
        source: /DATA/AppData/tdarr/logs
        target: /app/logs
      - type: bind
        source: /DATA/AppData/tdarr/temp
        target: /temp
      - type: bind
        source: /DATA/Media
        target: /media
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: PUID
        - container: PGID
          description:
            en_US: PGID
        - container: TZ
          description:
            en_US: TZ
        - container: serverIP
          description:
            en_US: serverIP
        - container: serverPort
          description:
            en_US: serverPort
        - container: webUIPort
          description:
            en_US: webUIPort
        - container: internalNode
          description:
            en_US: internalNode
        - container: nodeName
          description:
            en_US: nodeName
      ports:
        - container: "8265"
          description:
            en_US: Port 8265/tcp
        - container: "8266"
          description:
            en_US: Port 8266/tcp
      volumes:
        - container: /app/server
          description:
            en_US: /app/server
        - container: /app/configs
          description:
            en_US: /app/configs
        - container: /app/logs
          description:
            en_US: /app/logs
        - container: /temp
          description:
            en_US: /temp
        - container: /media
          description:
            en_US: /media

x-casaos:
  id: io.github.mrpiracy94.tdarr
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: tdarr
  author: MrStore
  developer: Tdarr
  category: Media
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/tdarr.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/tdarr.png
  title:
    en_US: "Tdarr"
  tagline:
    en_US: "Transcodificação automática da biblioteca"
  description:
    en_US: "Transcodificação automática da biblioteca. Estado: projeto muito ativo (conhecimento até meados de 2026); NÃO verificado em out/2026. Confirma portas e variáveis na documentação do projeto."
  port_map: "8265"
  index: /
