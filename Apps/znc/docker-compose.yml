name: znc
services:
  znc:
    image: lscr.io/linuxserver/znc:latest
    container_name: znc
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 6501
        published: "6501"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/znc/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "6501"
          description:
            en_US: Port 6501/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.znc
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: znc
  author: MrStore
  developer: LinuxServer.io
  category: Social
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/znc.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/znc.png
  title:
    en_US: "ZNC"
  tagline:
    en_US: "ZNC (LinuxServer.io)"
  description:
    en_US: "ZNC — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/znc:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-znc/"
  port_map: "6501"
  index: /
