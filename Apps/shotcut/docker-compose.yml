name: shotcut
services:
  shotcut:
    image: lscr.io/linuxserver/shotcut:latest
    container_name: shotcut
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Shotcut"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21140"
        protocol: tcp
      - target: 3001
        published: "21141"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/shotcut/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.shotcut
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
  main: shotcut
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/c00fb6e6dc50b59217a915188be27d0ea55801c8/linuxserver.io/img/shotcut-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/c00fb6e6dc50b59217a915188be27d0ea55801c8/linuxserver.io/img/shotcut-logo.png
  title:
    en_US: "Shotcut"
  tagline:
    en_US: "Shotcut (LinuxServer.io)"
  description:
    en_US: "Shotcut — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/shotcut:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-shotcut/"
  port_map: "21140"
  index: /
