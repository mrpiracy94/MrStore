name: karakeep
services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep
    restart: unless-stopped
    depends_on:
      - karakeep-chrome
      - karakeep-meilisearch
    environment:
      - "MEILI_ADDR=http://karakeep-meilisearch:7700"
      - "BROWSER_WEB_URL=http://karakeep-chrome:9222"
      - "NEXTAUTH_SECRET=CHANGE_ME"
      - "MEILI_MASTER_KEY=CHANGE_ME"
      - "NEXTAUTH_URL=http://zimaos.local:3000"
      - "DATA_DIR=/data"
    ports:
      - target: 3000
        published: "30002"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/karakeep/data
        target: /data
    x-casaos:
      envs:
        - container: MEILI_ADDR
          description:
            en_US: MEILI_ADDR
        - container: BROWSER_WEB_URL
          description:
            en_US: BROWSER_WEB_URL
        - container: NEXTAUTH_SECRET
          description:
            en_US: NEXTAUTH_SECRET
        - container: MEILI_MASTER_KEY
          description:
            en_US: MEILI_MASTER_KEY
        - container: NEXTAUTH_URL
          description:
            en_US: NEXTAUTH_URL
        - container: DATA_DIR
          description:
            en_US: DATA_DIR
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
      volumes:
        - container: /data
          description:
            en_US: /data
  karakeep-chrome:
    image: gcr.io/zenika-hub/alpine-chrome:124
    container_name: karakeep-chrome
    restart: unless-stopped
    command: ["--no-sandbox", "--disable-gpu", "--disable-dev-shm-usage", "--remote-debugging-address=0.0.0.0", "--remote-debugging-port=9222", "--hide-scrollbars"]
    x-casaos:
      envs: []
      ports: []
      volumes: []
  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.54.3
    container_name: karakeep-meilisearch
    restart: unless-stopped
    environment:
      - "MEILI_NO_ANALYTICS=true"
      - "MEILI_MASTER_KEY=CHANGE_ME"
    volumes:
      - type: bind
        source: /DATA/AppData/karakeep/meili
        target: /meili_data
    x-casaos:
      envs:
        - container: MEILI_NO_ANALYTICS
          description:
            en_US: MEILI_NO_ANALYTICS
        - container: MEILI_MASTER_KEY
          description:
            en_US: MEILI_MASTER_KEY
      ports: []
      volumes:
        - container: /meili_data
          description:
            en_US: /meili_data

x-casaos:
  id: io.github.mrpiracy94.karakeep
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: karakeep
  author: MrStore
  developer: Karakeep
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/karakeep.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/karakeep.png
  title:
    en_US: "Karakeep"
  tagline:
    en_US: "Guarda tudo: bookmarks, notas, imagens (com IA opcional)"
  description:
    en_US: "Guarda tudo: bookmarks, notas, imagens (com IA opcional). Estado: verificado em out/2026 (patrocinador ativo do selfh.st, ago-out/2026). Confirma portas e variáveis na documentação do projeto. MEILI_MASTER_KEY tem de ser igual nos dois serviços. A tag da imagem meilisearch/chrome é do compose de referência; confirma se há versão mais recente."
  port_map: "30002"
  index: /
