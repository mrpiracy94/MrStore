name: thunderbird
services:
  thunderbird:
    image: lscr.io/linuxserver/thunderbird:latest
    container_name: thunderbird
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Thunderbird"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21154"
        protocol: tcp
      - target: 3001
        published: "21155"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/thunderbird/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.thunderbird
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: thunderbird
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/thunderbird.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/thunderbird.png
  title:
    en_US: "Thunderbird"
  tagline:
    en_US: "Thunderbird (LinuxServer.io)"
  description:
    en_US: "Thunderbird — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/thunderbird:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-thunderbird/"
  port_map: "21154"
  index: /
