name: vscodium
services:
  vscodium:
    image: lscr.io/linuxserver/vscodium:latest
    container_name: vscodium
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=VSCodium"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21162"
        protocol: tcp
      - target: 3001
        published: "21163"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.vscodium
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: vscodium
  author: MrStore
  developer: LinuxServer.io
  category: Developer
  icon: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/vscodium/icon.svg
  thumbnail: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/vscodium/icon.svg
  title:
    en_US: "VSCodium"
  tagline:
    en_US: "VSCodium (LinuxServer.io)"
  description:
    en_US: "VSCodium — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/vscodium:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-vscodium/"
  port_map: "21162"
  index: /
