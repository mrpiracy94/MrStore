name: opera
services:
  opera:
    image: lscr.io/linuxserver/opera:latest
    container_name: opera
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Opera"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21110"
        protocol: tcp
      - target: 3001
        published: "21111"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.opera
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
  main: opera
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/opera.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/opera.png
  title:
    en_US: "Opera"
  tagline:
    en_US: "Opera (LinuxServer.io)"
  description:
    en_US: "Opera — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/opera:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-opera/"
  port_map: "21110"
  index: /
