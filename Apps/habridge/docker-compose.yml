name: habridge
services:
  habridge:
    image: lscr.io/linuxserver/habridge:latest
    container_name: habridge
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8080
        published: "20039"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/habridge/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "8080"
          description:
            en_US: Port 8080/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.habridge
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: habridge
  author: MrStore
  developer: LinuxServer.io
  category: Home
  icon: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/habridge/icon.svg
  thumbnail: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/habridge/icon.svg
  title:
    en_US: "HA Bridge"
  tagline:
    en_US: "HA Bridge (LinuxServer.io)"
  description:
    en_US: "HA Bridge — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/habridge:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-habridge/"
  port_map: "20039"
  index: /
