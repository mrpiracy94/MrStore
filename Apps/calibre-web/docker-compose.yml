name: calibre-web
services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8083
        published: "8083"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/calibre-web/config
        target: /config
      - type: bind
        source: /DATA/Media/Books
        target: /books
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "8083"
          description:
            en_US: Port 8083/tcp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /books
          description:
            en_US: /books

x-casaos:
  id: io.github.mrpiracy94.calibre-web
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: calibre-web
  author: MrStore
  developer: LinuxServer.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/calibre-web.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/calibre-web.png
  title:
    en_US: "Calibre-Web"
  tagline:
    en_US: "Calibre-Web (LinuxServer.io)"
  description:
    en_US: "Calibre-Web — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/calibre-web:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-calibre-web/"
  port_map: "8083"
  index: /
