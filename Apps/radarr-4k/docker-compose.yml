name: radarr-4k
services:
  radarr-4k:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr-4k
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 7878
        published: "20068"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/radarr-4k/config
        target: /config
      - type: bind
        source: /DATA/Media/Movies4K
        target: /movies
      - type: bind
        source: /DATA/Downloads
        target: /downloads
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "7878"
          description:
            en_US: Port 7878/tcp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /movies
          description:
            en_US: /movies
        - container: /downloads
          description:
            en_US: /downloads

x-casaos:
  id: io.github.mrpiracy94.radarr-4k
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: radarr-4k
  author: MrStore
  developer: LinuxServer.io
  category: Media
  icon: https://seedit4.me/assets/img/icons/software/radarr.png
  thumbnail: https://seedit4.me/assets/img/icons/software/radarr.png
  title:
    en_US: "Radarr 4K"
  tagline:
    en_US: "Radarr 4K (seedit4.me catalog (instância extra))"
  description:
    en_US: "Radarr 4K — origem: seedit4.me catalog (instância extra). Imagem: lscr.io/linuxserver/radarr:latest. Verifica portas/variáveis na documentação do projeto."
  port_map: "20068"
  index: /
