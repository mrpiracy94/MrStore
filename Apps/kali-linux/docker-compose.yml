name: kali-linux
services:
  kali-linux:
    image: lscr.io/linuxserver/kali-linux:latest
    container_name: kali-linux
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Kali Linux"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21078"
        protocol: tcp
      - target: 3001
        published: "21079"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kali-linux/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.kali-linux
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: kali-linux
  author: MrStore
  developer: LinuxServer.io
  category: Developer
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/kali-linux.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/kali-linux.png
  title:
    en_US: "Kali Linux"
  tagline:
    en_US: "Kali Linux (LinuxServer.io)"
  description:
    en_US: "Kali Linux — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/kali-linux:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-kali-linux/"
  port_map: "21078"
  index: /
