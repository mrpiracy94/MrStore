name: mediaelch
services:
  mediaelch:
    image: lscr.io/linuxserver/mediaelch:latest
    container_name: mediaelch
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=MediaElch"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21096"
        protocol: tcp
      - target: 3001
        published: "21097"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mediaelch/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.mediaelch
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: mediaelch
  author: MrStore
  developer: LinuxServer.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/mediaelch.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/mediaelch.png
  title:
    en_US: "MediaElch"
  tagline:
    en_US: "MediaElch (LinuxServer.io)"
  description:
    en_US: "MediaElch — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/mediaelch:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-mediaelch/"
  port_map: "21096"
  index: /
