name: code-server
services:
  code-server:
    image: ghcr.io/mrpiracy94/mrstore-code-server:lsio-node-deps-secfix-20261010@sha256:af284b8788aeb604a86496242c23872cbdaa78e74f1b960c88fb146c984895fe
    container_name: code-server
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "DEFAULT_WORKSPACE=/workspace"
    ports:
      - target: 8443
        published: "20045"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/code-server/config
        target: /config
      - type: bind
        source: /DATA/Workspace
        target: /workspace
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "8443"
          description:
            en_US: Port 8443/tcp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /workspace
          description:
            en_US: /workspace

x-casaos:
  id: io.github.mrpiracy94.code-server
  version: "1.0.1"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: code-server
  author: MrStore
  developer: LinuxServer.io
  category: Developer
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/code-server.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/code-server.png
  title:
    en_US: "code-server"
  tagline:
    en_US: "code-server (LinuxServer.io)"
  description:
    en_US: "code-server LinuxServer original com correções individuais de shell-quote 1.11.0 e basic-ftp 6.2.1, imagem GHCR de digest imutável testada em AMD64/ARM64 (Trivy 0 HIGH/CRITICAL, HTTP, volumes e FTP). Mantém /config e /workspace e porta 20045 -> 8443. Faz backup de ambos antes de atualizar e confirma integrações FTP especiais; basic-ftp v6 bloqueia hosts de transferência alternativos por defeito. Ver docs/CODE_SERVER_TARGETED_PATCH.md."
  port_map: "20045"
  index: /
