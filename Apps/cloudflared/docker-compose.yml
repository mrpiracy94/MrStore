name: cloudflared
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      - "TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN:?Set CLOUDFLARED_TUNNEL_TOKEN before deployment}"
    x-casaos:
      envs:
        - container: TUNNEL_TOKEN
          description:
            en_US: TUNNEL_TOKEN
      ports: []
      volumes: []

x-casaos:
  tips:
    before_install:
      en_US: "SECURITY: Configure required Compose variables CLOUDFLARED_TUNNEL_TOKEN before installing. The ZimaOS v2 catalog builder strips service-level x-casaos.envs, so automatic password entry is NOT confirmed. Do not install until your ZimaOS installer securely injects these values. No default credentials are provided. See docs/SECURE_DEPLOYMENT.md in MrStore."
      pt_PT: "SEGURANÇA: Configura as variáveis Compose obrigatórias CLOUDFLARED_TUNNEL_TOKEN antes da instalação. O builder ZimaOS v2 remove os campos x-casaos.envs dos serviços; não está confirmado que a interface peça credenciais. Não instales até o ZimaOS conseguir transmitir os valores com segurança. Não existem passwords predefinidas. Consulta docs/SECURE_DEPLOYMENT.md na MrStore."
  id: io.github.mrpiracy94.cloudflared
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: cloudflared
  author: MrStore
  developer: Cloudflared
  category: Networking
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/cloudflared.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/cloudflared.png
  title:
    en_US: "Cloudflared"
  tagline:
    en_US: "Túnel Cloudflare (sem UI)"
  description:
    en_US: "Túnel Cloudflare (sem UI). Estado: projeto muito ativo (conhecimento até meados de 2026); NÃO verificado em out/2026. Confirma portas e variáveis na documentação do projeto."
  port_map: "0"
  index: /
