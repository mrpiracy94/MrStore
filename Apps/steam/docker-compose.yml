name: steam
services:
  steam:
    image: lscr.io/linuxserver/steam:latest
    container_name: steam
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Steam"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21148"
        protocol: tcp
      - target: 3001
        published: "21149"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/steam/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.steam
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
  main: steam
  author: MrStore
  developer: LinuxServer.io
  category: Others
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/steam.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/steam.png
  title:
    en_US: "Steam"
  tagline:
    en_US: "Steam (LinuxServer.io)"
  description:
    en_US: "Steam — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/steam:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-steam/"
  port_map: "21148"
  index: /
