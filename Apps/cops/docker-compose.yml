name: cops
services:
  cops:
    image: lscr.io/linuxserver/cops:latest
    container_name: cops
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 80
        published: "20054"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/Media/Books
        target: /books
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "80"
          description:
            en_US: Port 80/tcp
      volumes:
        - container: /config
          description:
            en_US: /config
        - container: /books
          description:
            en_US: /books

x-casaos:
  id: io.github.mrpiracy94.cops
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: cops
  author: MrStore
  developer: LinuxServer.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/cops.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/cops.png
  title:
    en_US: "COPS"
  tagline:
    en_US: "COPS (LinuxServer.io)"
  description:
    en_US: "COPS — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/cops:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-cops/"
  port_map: "20054"
  index: /
