name: it-tools
services:
  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    ports:
      - target: 80
        published: "30013"
        protocol: tcp
    x-casaos:
      envs: []
      ports:
        - container: "80"
          description:
            en_US: Port 80/tcp
      volumes: []

x-casaos:
  id: io.github.mrpiracy94.it-tools
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: it-tools
  author: MrStore
  developer: IT-Tools
  category: Developer
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/it-tools.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/it-tools.png
  title:
    en_US: "IT-Tools"
  tagline:
    en_US: "Ferramentas úteis para programadores"
  description:
    en_US: "Ferramentas úteis para programadores. Estado: projeto muito ativo (conhecimento até meados de 2026); NÃO verificado em out/2026. Confirma portas e variáveis na documentação do projeto."
  port_map: "30013"
  index: /
