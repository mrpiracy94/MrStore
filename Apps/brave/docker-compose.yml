name: brave
services:
  brave:
    image: lscr.io/linuxserver/brave:latest
    container_name: brave
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Brave"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21026"
        protocol: tcp
      - target: 3001
        published: "21027"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/brave/config
        target: /config
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "3000"
          description:
            en_US: Port 3000/tcp
        - container: "3001"
          description:
            en_US: Port 3001/tcp
      volumes:
        - container: /config
          description:
            en_US: /config

x-casaos:
  id: io.github.mrpiracy94.brave
  version: "1.0.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: brave
  author: MrStore
  developer: LinuxServer.io
  category: Productivity
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/brave.png
  thumbnail: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/brave.png
  title:
    en_US: "Brave"
  tagline:
    en_US: "Brave (LinuxServer.io)"
  description:
    en_US: "Brave — origem: LinuxServer.io. Imagem: lscr.io/linuxserver/brave:latest. Verifica portas/variáveis na documentação do projeto. Docs: https://docs.linuxserver.io/images/docker-brave/"
  port_map: "21026"
  index: /
