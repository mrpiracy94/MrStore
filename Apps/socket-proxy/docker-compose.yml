name: socket-proxy
services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges:true
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "CONTAINERS=1"
      - "POST=0"
      - "EXEC=0"
      - "BUILD=0"
      - "AUTH=0"
      - "IMAGES=0"
      - "SECRETS=0"
      - "SERVICES=0"
      - "ALLOW_START=0"
      - "ALLOW_STOP=0"
      - "ALLOW_RESTARTS=0"
      - "ALLOW_PAUSE=0"
      - "ALLOW_UNPAUSE=0"
      - "ALLOW_ARCHIVE=0"
      - "ALLOW_CHANGES=0"
      - "ALLOW_EXPORT=0"
      - "ALLOW_TOP=0"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      volumes:
        - container: /var/run/docker.sock
          description:
            en_US: /var/run/docker.sock

x-casaos:
  id: io.github.mrpiracy94.socket-proxy
  version: "1.1.0"
  update_at: "2026-10-09"
  architectures:
    - amd64
    - arm64
  main: socket-proxy
  author: MrStore
  developer: LinuxServer.io
  category: Others
  icon: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/socket-proxy/icon.svg
  thumbnail: https://raw.githubusercontent.com/mrpiracy94/MrStore/main/Apps/socket-proxy/icon.svg
  title:
    en_US: "Socket Proxy"
  tagline:
    en_US: "Socket Proxy (LinuxServer.io)"
  description:
    en_US: "Proxy Docker com API restrita. Apenas leitura GET/HEAD, POST/exec/início/paragem desativados. Socket de host montado só no proxy, sem porta exposta no NAS. NOTA: ligação ao Docker daemon continua sensível; usar apenas em rede privada e não ativar comandos de escrita. Docs: https://docs.linuxserver.io/images/docker-socket-proxy/"
  port_map: "0"
  index: /
