# MrStore — updates automaticos de dependencias
# Renovate gere os 254 Apps/*/docker-compose.yml; nao os duplicar no Dependabot.
# Todas as atualizacoes sao propostas em PRs. Nao existe auto-merge.

version: 2
updates:
  # GitHub Actions (workflows em .github/workflows/)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Python (requirements.txt na raiz)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "07:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 2
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Imagens Docker construidas pela MrStore para corrigir CVEs.
  # Nao monitorizar Apps/: o Renovate ja gere os Compose do catalogo.
  # Manter alteracoes de imagens separadas para revisao e testes multiarch.
  - package-ecosystem: "docker"
    directories:
      - "/security/images/code-server"
      - "/security/images/healthchecks"
      - "/security/images/it-tools"
      - "/security/images/netbootxyz"
      - "/security/images/phpmyadmin"
      - "/security/images/qbittorrent"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "07:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 3
