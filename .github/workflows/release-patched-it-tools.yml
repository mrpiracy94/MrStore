name: Build and release security-rebased IT-Tools
on:
  pull_request:
    paths:
      - 'security/images/it-tools/Dockerfile'
      - 'scripts/test_it_tools_rebase.sh'
      - '.github/workflows/release-patched-it-tools.yml'
  push:
    branches: [main]
    paths:
      - 'security/images/it-tools/Dockerfile'
      - 'scripts/test_it_tools_rebase.sh'
      - '.github/workflows/release-patched-it-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: mrstore-it-tools-security-release
  cancel-in-progress: false
jobs:
  verify_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/mrstore-it-tools
      VERSION: static-nginx-alpine-secfix-20261010
    steps:
      - uses: actions/checkout@v4
      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
      - name: Build patched AMD64 nginx container
        run: docker buildx build --pull --platform linux/amd64 --load -f security/images/it-tools/Dockerfile -t mrstore-it-tools:patched-amd64 .
      - name: Scan AMD64 patched image
        run: |
          mkdir -p out
          trivy image --quiet --image-src docker --platform linux/amd64 --scanners vuln --severity HIGH,CRITICAL --timeout 12m --format json --output out/it-tools-amd64.json mrstore-it-tools:patched-amd64
      - name: Build patched ARM64 nginx container
        run: docker buildx build --pull --platform linux/arm64 --load -f security/images/it-tools/Dockerfile -t mrstore-it-tools:patched-arm64 .
      - name: Scan ARM64 patched image
        run: trivy image --quiet --image-src docker --platform linux/arm64 --scanners vuln --severity HIGH,CRITICAL --timeout 12m --format json --output out/it-tools-arm64.json mrstore-it-tools:patched-arm64
      - name: Gate release on complete zero-HIGH/CRITICAL scans
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter
          lines = ['## IT-Tools security rebase (upstream static app unchanged)', '',
                   '| Arch | CRITICAL | HIGH |', '|---|---:|---:|']
          for arch in ('amd64', 'arm64'):
              with open('out/it-tools-' + arch + '.json', encoding='utf-8') as src:
                  report = json.load(src)
              if not isinstance(report.get('Results'), list) or not report['Results']:
                  raise SystemExit('Incomplete Trivy report for ' + arch)
              counts = Counter(hit.get('Severity')
                               for entry in report['Results']
                               for hit in entry.get('Vulnerabilities') or []
                               if hit.get('Severity') in ('HIGH','CRITICAL'))
              lines.append(f"| {arch} | {counts['CRITICAL']} | {counts['HIGH']} |")
              if counts['CRITICAL'] or counts['HIGH']:
                  raise SystemExit('Cannot publish: patched ' + arch + ' image has HIGH/CRITICAL CVEs')
          summary = '\n'.join(lines) + '\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(summary)
          PY
      - name: Verify original assets, original nginx routing, and HTTP on AMD64
        run: bash scripts/test_it_tools_rebase.sh amd64
      - name: Verify original assets, original nginx routing, and HTTP on ARM64
        run: bash scripts/test_it_tools_rebase.sh arm64
      - name: Preserve vulnerability scans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: it-tools-nginx-security-evidence
          path: out/it-tools-*.json
          if-no-files-found: warn
      - name: Authenticate with GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only tested AMD64 and ARM64 images
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker tag mrstore-it-tools:patched-amd64 "$IMAGE:$VERSION-amd64"
          docker tag mrstore-it-tools:patched-arm64 "$IMAGE:$VERSION-arm64"
          docker push "$IMAGE:$VERSION-amd64"
          docker push "$IMAGE:$VERSION-arm64"
          docker buildx imagetools create -t "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
