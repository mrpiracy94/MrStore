name: Audit Docker image build freshness
on:
  pull_request:
    paths:
      - 'scripts/image_freshness.py'
      - 'tests/test_image_freshness.py'
      - '.github/workflows/image-freshness.yml'
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:
permissions:
  contents: read
# A new PR revision supersedes obsolete full scans, avoiding 8 more jobs per edit.
concurrency:
  group: mrstore-image-freshness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  freshness:
    name: Image build age (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install pinned crane registry client
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Inspect build age of all catalog image references
        id: audit
        continue-on-error: true
        run: >
          python scripts/image_freshness.py --shards 8 --shard ${{ matrix.shard }}
          --workers 2 --output out/freshness-${{ matrix.shard }}.json
          --summary out/freshness-${{ matrix.shard }}.md
      - name: Preserve image build and error evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrstore-image-freshness-shard-${{ matrix.shard }}
          path: |
            out/freshness-${{ matrix.shard }}.json
            out/freshness-${{ matrix.shard }}.md
          if-no-files-found: warn
      - name: Display summary
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          test ! -f "out/freshness-$SHARD.md" || cat "out/freshness-$SHARD.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Report incomplete registry checks
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::Some images have no valid build-age result. Inspect the artifact; they are not considered up-to-date."
          exit 1
