name: Daily Docker image updates
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: mrstore-image-updates
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install crane registry client
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Compare image digests against previous scan
        id: compare
        continue-on-error: true
        run: python scripts/updates.py --workers 4
      - name: Display report
        if: always()
        run: test ! -f out/updates.md || cat out/updates.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mrstore-image-updates
          path: |
            out/updates.*
            data/image-digests.json
          if-no-files-found: warn
      - name: Open an issue for actual digest changes
        if: always() && steps.compare.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          f=Path('out/updates.json')
          if not f.exists():raise SystemExit(0)
          results=json.loads(f.read_text())
          if not results['changed']:raise SystemExit(0)
          title='MrStore image updates — '+datetime.now(timezone.utc).strftime('%Y-%m-%d')
          existing=subprocess.run(['gh','issue','list','--state','all','--search',f'"{title}" in:title','--limit','20','--json','title'],capture_output=True,text=True,check=True)
          if any(t['title']==title for t in json.loads(existing.stdout)):raise SystemExit(0)
          subprocess.run(['gh','issue','create','--title',title,'--body-file','out/updates.md'],check=True)
          PY
      - name: Track persistent registry lookup failures
        if: always() && steps.compare.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          report_file = Path('out/updates.json')
          if not report_file.exists():
              raise SystemExit('No image update report produced.')
          report = json.loads(report_file.read_text(encoding='utf-8'))
          failures = report.get('failed', [])
          title = 'MrStore registry lookup failures'
          existing = subprocess.run(
              ['gh', 'issue', 'list', '--state', 'all', '--limit', '200',
               '--json', 'title,number,state'],
              capture_output=True, text=True, check=True)
          matches = [i for i in json.loads(existing.stdout) if i['title'] == title]
          if len(matches) > 1:
              raise SystemExit('Duplicate registry failure issues; manual review required.')
          issue = matches[0] if matches else None
          if failures:
              if issue:
                  number = str(issue['number'])
                  if issue['state'].upper() != 'OPEN':
                      subprocess.run(['gh', 'issue', 'reopen', number], check=True)
                  subprocess.run(['gh', 'issue', 'edit', number,
                                  '--body-file', 'out/updates.md'], check=True)
                  print(f'Refreshed registry warning #{number}: {len(failures)} failures.')
              else:
                  subprocess.run(['gh', 'issue', 'create', '--title', title,
                                  '--body-file', 'out/updates.md'], check=True)
          elif issue and issue['state'].upper() == 'OPEN':
              number = str(issue['number'])
              subprocess.run(['gh', 'issue', 'comment', number,
                              '--body', 'Nova verificação: todas as imagens consultadas '
                              'sem falhas de registry.'], check=True)
              subprocess.run(['gh', 'issue', 'close', number], check=True)
          else:
              print('All registry image lookups succeeded.')
          PY
      # Digest candidates remain artifacts, not reviewed baseline changes.
      # Maintainers must inspect registry/digest/CVE evidence and use a PR.
      - name: Digest baseline updates require manual pull request
        if: steps.compare.outcome == 'success'
        run: |
          echo 'Registry monitoring did not mutate main.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review data/image-digests.json from the artifact and update through a PR.' >> "$GITHUB_STEP_SUMMARY"
      - name: Treat incomplete registry checks as partial failures
        if: steps.compare.outcome == 'failure'
        run: exit 1
