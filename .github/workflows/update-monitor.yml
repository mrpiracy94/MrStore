name: Monitor Docker image updates
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: monitor-updates
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install registry-inspection crane CLI
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Resolve digests without deploying anything
        id: check
        continue-on-error: true
        run: python scripts/check_updates.py --workers 4
      - name: Write job summary
        if: always()
        run: |
          if [ -f out/image-changes.md ]; then cat out/image-changes.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-update-report
          path: |
            out/image-changes.json
            out/image-changes.md
            data/image-digests.json
          if-no-files-found: warn
      - name: Create GitHub issue for actual digest changes
        if: always() && steps.check.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          file=Path('out/image-changes.json')
          if not file.exists(): raise SystemExit(0)
          changes=json.loads(file.read_text()).get('changed',[])
          if not changes: raise SystemExit(0)
          day=__import__('datetime').datetime.now(__import__('datetime').timezone.utc).strftime('%Y-%m-%d')
          title=f'MrStore: alterações de imagens Docker — {day}'
          found=subprocess.run(['gh','issue','list','--state','all','--search',f'"{title}" in:title','--json','number'],capture_output=True,text=True,check=True)
          if json.loads(found.stdout):raise SystemExit(0)
          subprocess.run(['gh','issue','create','--title',title,'--body-file','out/image-changes.md'],check=True)
          PY
      - name: Commit successful new digest baseline
        if: always() && steps.check.outcome != 'skipped'
        run: |
          if ! git diff --quiet -- data/image-digests.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/image-digests.json
            git commit -m 'chore: refresh monitored image digests [skip ci]'
            git push
          fi
      - name: Mark partial registry failure
        if: steps.check.outcome == 'failure'
        run: exit 1
