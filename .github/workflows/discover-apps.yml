name: Curated new application discovery
on:
  schedule:
    - cron: '17 7 1 * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Propose missing curated applications as review-only issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/discover_apps.py
