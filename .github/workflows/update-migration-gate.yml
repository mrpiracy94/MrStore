name: Review risky app migrations
on:
  pull_request:
    paths:
      - 'Apps/**'
      - 'scripts/review_updates.py'
      - '.github/workflows/update-migration-gate.yml'
permissions:
  contents: read
jobs:
  migration_review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Require backup, migration, tests and rollback plan for dangerous Compose changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/review_updates.py --base-sha "$BASE_SHA"
      - name: Save risk classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrstore-migration-review
          path: out/update-risk.json
          if-no-files-found: warn
