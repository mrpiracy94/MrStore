name: Review stale Docker image candidates
on:
  schedule:
    - cron: '41 5 * * 3'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/maintenance_candidates.py'
      - 'tests/test_maintenance_candidates.py'
      - '.github/workflows/review-maintenance-candidates.yml'
permissions:
  contents: read
concurrency:
  group: mrstore-maintenance-candidates-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  candidate-evidence:
    name: Compare ${{ matrix.app }} on declared architectures
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app: [organizr, series-troxide, dockge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Offline regression tests
        run: python -m unittest discover -s tests -p 'test_maintenance_candidates.py' -v
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Install pinned crane for immutable digest resolution
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.21.7
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
      - name: Scan current and proposed candidates on AMD64/ARM64
        run: >-
          python scripts/maintenance_candidates.py --app ${{ matrix.app }}
          --output out/maintenance-${{ matrix.app }}.json
      - name: Preserve CVEs and inconclusive scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrstore-maintenance-${{ matrix.app }}
          path: out/maintenance-${{ matrix.app }}.json
          if-no-files-found: error
