name: Validate catalog
on:
  push:
    branches: [main]
    paths:
      - 'Apps/**'
      - 'scripts/**'
      - 'tests/**'
      - 'store-config.json'
      - 'supported-languages.json'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/audit_store.py --strict --out out/static-audit.json
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-audit
          path: out/static-audit.json
          if-no-files-found: warn
