name: Validate MrStore
on:
  push:
    branches: [main]
    paths:
      - 'Apps/**'
      - 'scripts/**'
      - 'data/taglines-pt.json'
      - 'data/image-digests.json'
      - 'security/images/**'
      - 'data/zimaos-device-tests.json'
      - 'tests/**'
      - 'store-config.json'
      - 'supported-languages.json'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Reject all source images without approved immutable digests
        run: python scripts/verify_source_digests.py
      - name: Check all Compose manifests and security posture
        run: python scripts/validate.py
      - name: Validate Portuguese app summaries (no modifications)
        run: python scripts/curate_taglines.py --check
      - name: Reject mutable GitHub Action references across every workflow
        run: python scripts/verify_action_pins.py
      - name: Check storefront JavaScript syntax without executing network requests
        run: node --check web/assets/site.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Inventory ZimaOS launcher compatibility (offline, not runtime proof)
        run: python scripts/compatibility.py
      - name: Compatibility summary
        if: always()
        run: test ! -f out/compatibility.md || cat out/compatibility.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compatibility findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zimaos-compatibility-static
          path: out/compatibility.*
          if-no-files-found: warn
      - name: Validate real-device evidence registry and inventory all catalog apps
        run: python scripts/zimaos_coverage.py
      - name: Device coverage summary
        if: always()
        run: test ! -f out/zimaos-coverage.md || cat out/zimaos-coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ZimaOS device evidence coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zimaos-device-coverage
          path: out/zimaos-coverage.*
          if-no-files-found: warn
      - name: Parse every Compose file with official Docker Compose V2 (no containers)
        run: python scripts/compose_preflight.py
      - name: Compose parser summary
        if: always()
        run: test ! -f out/compose-preflight.md || cat out/compose-preflight.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Compose parser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mrstore-compose-v2-preflight
          path: out/compose-preflight.*
          if-no-files-found: warn
      - name: Reject newly introduced dangerous Docker privileges
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA=HEAD^; fi
          python scripts/privilege_policy.py --base "$BASE_SHA"
      - name: Audit every app, container image, secret default and Dockerfile base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA=HEAD^; fi
          python scripts/security_inventory.py --base-sha "$BASE_SHA" --fail-new-high
      - name: Publish all-image inventory summary
        if: always()
        run: test ! -f out/all-image-security.md || cat out/all-image-security.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve all-image findings (not a CVE scan)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mrstore-all-image-security
          path: out/all-image-security.*
          if-no-files-found: warn
      - name: Summary
        if: always()
        run: test ! -f out/audit.md || cat out/audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: manifest-security-audit
          path: out/audit.*
          if-no-files-found: warn
