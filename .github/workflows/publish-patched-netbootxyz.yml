name: Publish security-patched official Netbootxyz
on:
  push:
    branches: [main, security/netbootxyz-official-successor-20261009]
    paths:
      - 'security/images/netbootxyz/Dockerfile'
      - '.github/workflows/publish-patched-netbootxyz.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: patched-netbootxyz-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/mrstore-netbootxyz
      VERSION: 2026-10-09-secfix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
      - name: Build AMD64 security image
        run: docker buildx build --platform linux/amd64 --load -t mrstore-netbootxyz:amd64 -f security/images/netbootxyz/Dockerfile .
      - name: Reject AMD64 HIGH and CRITICAL
        run: trivy image --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --timeout 12m --output scan-amd64.json mrstore-netbootxyz:amd64
      - name: Smoke test AMD64
        run: docker run --rm --platform linux/amd64 --entrypoint /bin/sh mrstore-netbootxyz:amd64 -c 'node --version && test -f /app/package.json && test -d /app/node_modules'
      - name: Build ARM64 security image
        run: docker buildx build --platform linux/arm64 --load -t mrstore-netbootxyz:arm64 -f security/images/netbootxyz/Dockerfile .
      - name: Reject ARM64 HIGH and CRITICAL
        run: trivy image --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --timeout 12m --output scan-arm64.json mrstore-netbootxyz:arm64
      - name: Smoke test ARM64
        run: docker run --rm --platform linux/arm64 --entrypoint /bin/sh mrstore-netbootxyz:arm64 -c 'node --version && test -f /app/package.json && test -d /app/node_modules'
      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only CVE-clean verified multiarchitecture images
        run: |
          set -euo pipefail
          docker tag mrstore-netbootxyz:amd64 "$IMAGE:$VERSION-amd64"
          docker tag mrstore-netbootxyz:arm64 "$IMAGE:$VERSION-arm64"
          docker push "$IMAGE:$VERSION-amd64"
          docker push "$IMAGE:$VERSION-arm64"
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION" | tee netboot-release-manifest.txt
      - name: Persist vulnerability evidence and release digest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patched-netbootxyz-security-evidence
          path: |
            scan-amd64.json
            scan-arm64.json
            netboot-release-manifest.txt
          if-no-files-found: warn
