name: Verify maintained official Netbootxyz replacement
on:
  pull_request:
    paths:
      - 'Apps/netbootxyz/docker-compose.yml'
      - '.github/workflows/verify-netbootxyz-official.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
      - name: Verify official image AMD64 has zero HIGH or CRITICAL
        run: trivy image --image-src remote --quiet --scanners vuln --severity HIGH,CRITICAL --platform linux/amd64 --exit-code 1 --format json --timeout 12m --output netboot-amd64.json ghcr.io/netbootxyz/netbootxyz:latest
      - name: Verify official image ARM64 has zero HIGH or CRITICAL
        run: trivy image --image-src remote --quiet --scanners vuln --severity HIGH,CRITICAL --platform linux/arm64 --exit-code 1 --format json --timeout 12m --output netboot-arm64.json ghcr.io/netbootxyz/netbootxyz:latest
      - name: Check official image manifest and immutable digest
        run: |
          set -euo pipefail
          docker buildx imagetools inspect ghcr.io/netbootxyz/netbootxyz:latest | tee netboot-manifest.txt
          digest="$(awk '/^Digest:/ {print $2; exit}' netboot-manifest.txt)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "Verified upstream digest: $digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve security proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netbootxyz-official-cve-evidence
          path: |
            netboot-amd64.json
            netboot-arm64.json
            netboot-manifest.txt
          if-no-files-found: warn
