name: Verify security-patched Netbootxyz successor
on:
  pull_request:
    paths:
      - 'Apps/netbootxyz/docker-compose.yml'
      - 'security/images/netbootxyz/**'
      - '.github/workflows/verify-netbootxyz-official.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Install Trivy v0.75.0
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
      - name: Build patched AMD64 app image
        run: docker buildx build --platform linux/amd64 --load -t mrstore-netbootxyz:amd64 -f security/images/netbootxyz/Dockerfile .
      - name: Prove patched AMD64 image has zero HIGH or CRITICAL
        run: trivy image --image-src docker --quiet --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --timeout 12m --output netboot-amd64.json mrstore-netbootxyz:amd64
      - name: Smoke-test patched AMD64 Node app
        run: docker run --rm --platform linux/amd64 --entrypoint /bin/sh mrstore-netbootxyz:amd64 -c 'node --version && test -f /app/package.json && test -d /app/node_modules'
      - name: Build patched ARM64 app image
        run: docker buildx build --platform linux/arm64 --load -t mrstore-netbootxyz:arm64 -f security/images/netbootxyz/Dockerfile .
      - name: Prove patched ARM64 image has zero HIGH or CRITICAL
        run: trivy image --image-src docker --quiet --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --timeout 12m --output netboot-arm64.json mrstore-netbootxyz:arm64
      - name: Smoke-test patched ARM64 Node app
        run: docker run --rm --platform linux/arm64 --entrypoint /bin/sh mrstore-netbootxyz:arm64 -c 'node --version && test -f /app/package.json && test -d /app/node_modules'
      - name: Verify released image can be pulled without GHCR login
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker pull --platform linux/amd64 "ghcr.io/mrpiracy94/mrstore-netbootxyz:2026-10-09-secfix@sha256:2a3fda1f77563529dcff6dcb0f4cbc44a48694291ca071f01995a157cc451527"
      - name: Independently re-scan published immutable AMD64 manifest
        run: trivy image --image-src remote --quiet --scanners vuln --severity HIGH,CRITICAL --platform linux/amd64 --exit-code 1 --format json --timeout 12m --output netboot-release-amd64.json "ghcr.io/mrpiracy94/mrstore-netbootxyz:2026-10-09-secfix@sha256:2a3fda1f77563529dcff6dcb0f4cbc44a48694291ca071f01995a157cc451527"
      - name: Independently re-scan published immutable ARM64 manifest
        run: trivy image --image-src remote --quiet --scanners vuln --severity HIGH,CRITICAL --platform linux/arm64 --exit-code 1 --format json --timeout 12m --output netboot-release-arm64.json "ghcr.io/mrpiracy94/mrstore-netbootxyz:2026-10-09-secfix@sha256:2a3fda1f77563529dcff6dcb0f4cbc44a48694291ca071f01995a157cc451527"
      - name: Preserve proof, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netbootxyz-security-patched-evidence
          path: |
            netboot-amd64.json
            netboot-arm64.json
            netboot-release-amd64.json
            netboot-release-arm64.json
          if-no-files-found: warn
