name: Verify PHPMyAdmin LinuxServer targeted CVE patches
on:
  pull_request:
    paths:
      - 'security/images/phpmyadmin/Dockerfile'
      - 'scripts/test_phpmyadmin_lsio_patches.sh'
      - 'scripts/test_phpmyadmin_mariadb_integration.sh'
      - '.github/workflows/verify-phpmyadmin-vendor-patches.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
      - name: Scan existing LinuxServer phpMyAdmin
        run: |
          mkdir -p out
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --platform linux/${{ matrix.arch }} --timeout 12m --format json --output out/previous.json lscr.io/linuxserver/phpmyadmin:latest
      - name: Build with targeted Composer and Alpine patches
        run: |
          docker buildx build --pull --platform linux/${{ matrix.arch }} --load -f security/images/phpmyadmin/Dockerfile -t mrstore-phpmyadmin-patched:${{ matrix.arch }} .
      - name: Scan patched image without hiding findings
        run: |
          trivy image --quiet --image-src docker --scanners vuln --severity HIGH,CRITICAL --platform linux/${{ matrix.arch }} --timeout 12m --format json --output out/patched.json mrstore-phpmyadmin-patched:${{ matrix.arch }}
      - name: Require complete 0-HIGH 0-CRITICAL Trivy report
        run: |
          python - <<'PY'
          import json,os
          from collections import Counter
          def count(path):
              with open(path,encoding='utf-8') as f:
                  data=json.load(f)
              if not isinstance(data.get('Results'),list) or not data['Results']:
                  raise SystemExit('Incomplete scan: '+path)
              return Counter(v.get('Severity') for record in data['Results']
                             for v in record.get('Vulnerabilities') or []
                             if v.get('Severity') in ('HIGH','CRITICAL'))
          before,after=count('out/previous.json'),count('out/patched.json')
          summary=('## phpMyAdmin ${{ matrix.arch }} targeted rebuild\n\n'
                   '| Image | CRITICAL | HIGH |\n|---|---:|---:|\n'
                   f"| LinuxServer original | {before['CRITICAL']} | {before['HIGH']} |\n"
                   f"| Composer/apk patched | {after['CRITICAL']} | {after['HIGH']} |\n")
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write(summary)
          if after['CRITICAL'] or after['HIGH']:
              raise SystemExit('Remaining HIGH/CRITICAL: do not release')
          PY
      - name: Test nginx HTTP and original /config on disposable volume
        run: bash scripts/test_phpmyadmin_lsio_patches.sh ${{ matrix.arch }}
      - name: Verify generated login page and actual MariaDB SQL query
        run: bash scripts/test_phpmyadmin_mariadb_integration.sh ${{ matrix.arch }}
      - name: Retain reports including failed builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpmyadmin-lsio-${{ matrix.arch }}-patch-scan
          path: out/*.json
          if-no-files-found: warn
