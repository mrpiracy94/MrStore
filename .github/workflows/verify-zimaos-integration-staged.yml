name: Validate staged ZimaOS update integration

on:
  push:
    branches:
      - integration/zimaos-updates-staged-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Exercise all unit tests
        run: python -m unittest discover -s tests -v
      - name: Reject ZimaOS main container naming regressions
        run: python scripts/zimaos_update_visibility.py --strict-main-name
      - name: Verify source catalog
        run: python scripts/validate.py

  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Install pinned registry reader
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.21.7
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Prepare stopped fixture only, on isolated runner
        run: |
          docker pull docker.io/library/alpine:3.20
          docker create --name mrstore-oci-probe docker.io/library/alpine:3.20 sh
      - name: Compare actual OCI config digests
        run: |
          python scripts/oci_installed_update_check.py --container mrstore-oci-probe --target docker.io/library/alpine:3.20 --output same.json
          python scripts/oci_installed_update_check.py --container mrstore-oci-probe --target docker.io/library/alpine:3.21 --output different.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('same.json').read_text())
          b=json.loads(Path('different.json').read_text())
          assert a['status']=='same_image',a
          assert b['status']=='candidate_update',b
          assert not a['updated_or_pulled'] and not b['updated_or_pulled']
          PY
      - name: Always delete stopped test container
        if: always()
        run: docker rm -f mrstore-oci-probe 2>/dev/null || true
