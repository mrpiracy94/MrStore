name: MrStore Web browser preview
on:
  pull_request:
    paths:
      - 'web/**'
      - 'assets/branding/**'
      - 'scripts/test_storefront_browser.py'
      - '.github/workflows/web-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real Chromium test tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify screenshot layout and interactions at 1536 and 390 pixels
        run: python scripts/test_storefront_browser.py --fixture
      - name: Save screenshots as downloadable artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrstore-web-preview-${{ github.event.pull_request.number || github.run_number }}
          path: storefront-fixture-*.png
          if-no-files-found: error
