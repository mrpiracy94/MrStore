name: Build, scan, test and publish Healthchecks (native multiarch)
on:
  push:
    branches:
      - main
      - security/healthchecks-complete-20261010
    paths:
      - 'security/images/healthchecks/Dockerfile'
      - 'scripts/test_healthchecks_lsio_patches.sh'
      - '.github/workflows/publish-healthchecks-python-patches.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: healthchecks-secfix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verified_platform:
    name: Scan and test ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/mrstore-healthchecks
      VERSION: lsio-python-venv-secfix-20261010
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Confirm native architecture
        run: |
          case "$ARCH" in
            amd64) test "$(uname -m)" = x86_64 ;;
            arm64) test "$(uname -m)" = aarch64 ;;
            *) exit 2 ;;
          esac
      - uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
      - name: Build exact candidate with official Docker Hub mirror
        run: docker buildx build --pull --platform "linux/$ARCH" --load -f security/images/healthchecks/Dockerfile -t "mrstore-healthchecks-patched:$ARCH" .
      - name: Scan exact built candidate and save report
        run: |
          mkdir -p out
          trivy image --quiet --image-src docker --platform "linux/$ARCH" --scanners vuln --severity HIGH,CRITICAL --timeout 12m --format json --output "out/$ARCH.json" "mrstore-healthchecks-patched:$ARCH"
      - name: Reject HIGH/CRITICAL or incomplete evidence
        run: |
          python - <<'PY'
          import json, os
          path=f"out/{os.environ['ARCH']}.json"
          with open(path,encoding='utf8') as f:
              report=json.load(f)
          results=report.get('Results')
          if not isinstance(results,list) or not results:
              raise SystemExit('FAIL: missing or incomplete Trivy results')
          findings=[v for group in results for v in group.get('Vulnerabilities') or []
                    if v.get('Severity') in ('HIGH','CRITICAL')]
          high=sum(v['Severity']=='HIGH' for v in findings)
          critical=sum(v['Severity']=='CRITICAL' for v in findings)
          print(f"{os.environ['ARCH']}: {critical} CRITICAL / {high} HIGH")
          if findings:
              raise SystemExit('FAIL: vulnerable Healthchecks candidate')
          PY
      - name: Real login page and preserved /config smoke test
        run: bash scripts/test_healthchecks_lsio_patches.sh "$ARCH"
      - name: Preserve raw CVE report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthchecks-secfix-${{ matrix.arch }}
          path: out/*.json
          if-no-files-found: warn
      - name: Authenticate to GHCR only after successful tests
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push exact tested single-architecture image
        run: |
          set -euo pipefail
          tag="$IMAGE:$VERSION-$GITHUB_SHA-$ARCH"
          docker tag "mrstore-healthchecks-patched:$ARCH" "$tag"
          docker push "$tag"

  multiarch:
    name: Publish immutable multiarch digest
    needs: verified_platform
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/mrstore-healthchecks
      VERSION: lsio-python-venv-secfix-20261010
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble manifest only after both native security and runtime checks passed
        run: |
          set -euo pipefail
          tag="$IMAGE:$VERSION-$GITHUB_SHA"
          docker buildx imagetools create -t "$tag" \
            "$IMAGE:$VERSION-$GITHUB_SHA-amd64" \
            "$IMAGE:$VERSION-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$tag" | tee manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt
          grep -E '^Digest:' manifest.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Require public anonymous access before catalog promotion
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          DOCKER_CONFIG="$tmp" docker buildx imagetools inspect "$IMAGE:$VERSION-$GITHUB_SHA"
