name: Publish verified LinuxServer Healthchecks Python security patches
on:
  push:
    branches: [main]
    paths:
      - 'security/images/healthchecks/Dockerfile'
      - 'scripts/test_healthchecks_lsio_patches.sh'
      - '.github/workflows/publish-healthchecks-python-patches.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: mrstore-healthchecks-patched-publication
  cancel-in-progress: false
jobs:
  verified_publication:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/mrstore-healthchecks
      VERSION: lsio-python-venv-secfix-20261010
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
      - name: Build AMD64 patched LinuxServer image
        run: docker buildx build --pull --platform linux/amd64 --load -f security/images/healthchecks/Dockerfile -t mrstore-healthchecks-patched:amd64 .
      - name: Scan AMD64 exact image
        run: |
          mkdir -p out
          trivy image --quiet --image-src docker --platform linux/amd64 --scanners vuln --severity HIGH,CRITICAL --timeout 12m --format json --output out/amd64.json mrstore-healthchecks-patched:amd64
      - name: Build ARM64 patched LinuxServer image
        run: docker buildx build --pull --platform linux/arm64 --load -f security/images/healthchecks/Dockerfile -t mrstore-healthchecks-patched:arm64 .
      - name: Scan ARM64 exact image
        run: trivy image --quiet --image-src docker --platform linux/arm64 --scanners vuln --severity HIGH,CRITICAL --timeout 12m --format json --output out/arm64.json mrstore-healthchecks-patched:arm64
      - name: Require complete and zero HIGH CRITICAL scans
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter
          lines=['## Healthchecks patched runtime security', '',
                 '| Arch | CRITICAL | HIGH |', '|---|---:|---:|']
          for arch in ('amd64', 'arm64'):
              with open(f'out/{arch}.json',encoding='utf-8') as source:
                  result=json.load(source)
              if not isinstance(result.get('Results'),list) or not result['Results']:
                  raise SystemExit('Incomplete Trivy report on '+arch)
              counts=Counter(item.get('Severity') for group in result['Results']
                             for item in group.get('Vulnerabilities') or []
                             if item.get('Severity') in ('HIGH','CRITICAL'))
              lines.append(f"| {arch} | {counts['CRITICAL']} | {counts['HIGH']} |")
              if counts['CRITICAL'] or counts['HIGH']:
                  raise SystemExit('Not publishing vulnerable Healthchecks on '+arch)
          summary='\n'.join(lines)+'\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write(summary)
          PY
      - name: Verify Healthchecks login HTML and original /config on AMD64
        run: bash scripts/test_healthchecks_lsio_patches.sh amd64
      - name: Verify Healthchecks login HTML and original /config on ARM64
        run: bash scripts/test_healthchecks_lsio_patches.sh arm64
      - name: Keep vulnerability evidence even if build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthchecks-secfix-release-cves
          path: out/*.json
          if-no-files-found: warn
      - name: Authenticate to GHCR after all security and functional checks
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both verified platforms with immutable index
        run: |
          set -euo pipefail
          docker tag mrstore-healthchecks-patched:amd64 "$IMAGE:$VERSION-amd64"
          docker tag mrstore-healthchecks-patched:arm64 "$IMAGE:$VERSION-arm64"
          docker push "$IMAGE:$VERSION-amd64"
          docker push "$IMAGE:$VERSION-arm64"
          docker buildx imagetools create -t "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
