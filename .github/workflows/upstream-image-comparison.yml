name: Compare vendor Docker images (read only)
on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 2'
  pull_request:
    paths:
      - 'data/upstream-candidates.json'
      - 'scripts/upstream_image_audit.py'
      - 'tests/test_upstream_image_audit.py'
      - '.github/workflows/upstream-image-comparison.yml'
permissions:
  contents: read
concurrency:
  group: mrstore-upstream-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  compare:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app: [homeassistant, qbittorrent, nextcloud, jellyfin, syncthing, freshrss]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install pinned crane registry client
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install Trivy scanner
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
          cache: true
      - name: Compare selected vendor image with pinned current image on all declared architectures
        run: python scripts/upstream_image_audit.py --compare --app "${{ matrix.app }}"
      - name: Upload comparative evidence without deployment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mrstore-upstream-${{ matrix.app }}
          path: out/upstream-images/upstream-audit-${{ matrix.app }}.*
          if-no-files-found: warn
      - name: Publish summary
        if: always()
        run: |
          test ! -f "out/upstream-images/upstream-audit-${{ matrix.app }}.md" ||
            cat "out/upstream-images/upstream-audit-${{ matrix.app }}.md" >> "$GITHUB_STEP_SUMMARY"
