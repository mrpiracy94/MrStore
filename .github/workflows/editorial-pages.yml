# The editorial catalog is a CI-only preview in rollout-233.yml.
# Neither editorial workflow may overwrite the CVE-gated gh-pages catalog.
name: Validate editorial MrStore selection (no publish)
on:
  push:
    branches: [main]
    paths:
      - 'data/featured-apps.json'
      - 'data/rollout-233.json'
      - 'scripts/featured.py'
      - 'scripts/rollout_233.py'
      - '.github/workflows/editorial-pages.yml'
  pull_request:
    paths:
      - 'data/featured-apps.json'
      - 'data/rollout-233.json'
      - 'scripts/featured.py'
      - 'scripts/rollout_233.py'
      - '.github/workflows/editorial-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate_selection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify policy, 233 application IDs and progressive milestones
        run: |
          python -m unittest discover -s tests -p 'test_rollout_233.py' -v
          python scripts/rollout_233.py --plan data/rollout-233.json
          python scripts/validate.py
      - name: Publication ownership
        run: |
          echo 'No write permissions; this workflow never touches gh-pages.'
          echo 'The rollout-233.yml job produces an uncertified CI preview artifact, never a gh-pages deployment.'
          echo 'The audited publish.yml is the only CVE-gated installer release process.'
