# The editorial catalog is published ONLY by rollout-233.yml.
# This workflow must not race gh-pages and wipe the actual homepage.
name: Validate editorial MrStore selection (no publish)
on:
  push:
    branches: [main]
    paths:
      - 'data/featured-apps.json'
      - 'data/rollout-233.json'
      - 'scripts/featured.py'
      - 'scripts/rollout_233.py'
      - '.github/workflows/editorial-pages.yml'
  pull_request:
    paths:
      - 'data/featured-apps.json'
      - 'data/rollout-233.json'
      - 'scripts/featured.py'
      - 'scripts/rollout_233.py'
      - '.github/workflows/editorial-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate_selection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify policy, 233 application IDs and progressive milestones
        run: |
          python -m unittest discover -s tests -p 'test_rollout_233.py' -v
          python scripts/rollout_233.py --plan data/rollout-233.json
          python scripts/validate.py
      - name: Publication ownership
        run: |
          echo 'No write permissions; this workflow never touches gh-pages.'
          echo 'The coordinated rollout-233.yml job handles editorial publication.'
          echo 'The audited publish.yml is the only CVE-gated installer release process.'
