name: Build and publish MrStore v2
on:
  push:
    branches: [main]
    paths:
      - 'Apps/**'
      # Only catalog/build code should trigger eight security scans + publication.
      # Monitoring scripts continue to run under Validate MrStore.
      - 'scripts/catalog.py'
      - 'scripts/curate_taglines.py'
      - 'scripts/validate.py'
      - 'scripts/verify_dist.py'
      - 'data/taglines-pt.json'
      - 'store-config.json'
      - 'supported-languages.json'
      - 'recommend-list.json'
      - 'requirements.txt'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mrstore-publish
  cancel-in-progress: false
jobs:
  security_audit:
    name: Zero HIGH/CRITICAL gate (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install pinned Trivy scanner
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
      - name: Block release on HIGH, CRITICAL, or incomplete image scans
        run: >
          python scripts/cves.py --shards 8 --shard ${{ matrix.shard }}
          --output out/release-cves-${{ matrix.shard }}.json
          --summary out/release-cves-${{ matrix.shard }}.md
      - name: Preserve failing security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrstore-release-security-shard-${{ matrix.shard }}
          path: |
            out/release-cves-${{ matrix.shard }}.json
            out/release-cves-${{ matrix.shard }}.md
          if-no-files-found: warn
  build:
    # Only all eight successful, complete and zero-HIGH/CRITICAL scans can publish.
    needs: security_audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate 254 source manifests
        run: python scripts/validate.py
      - name: Run regression tests before the expensive catalog build
        run: python -m unittest discover -s tests -v
      - name: Insert Portuguese app summaries (no Docker configuration changes)
        run: python scripts/curate_taglines.py
      # The canonical ZimaOS builder owns the v2 protocol and content_hash.
      # It verifies registry platforms and resolves/converts published icons.
      - name: Build official ZimaOS v2 catalog
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: .
          output: dist
          base-url: https://mrpiracy94.github.io/MrStore
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json
          report-json: out/build-report.json
      - name: Validate generated store endpoints
        run: python scripts/verify_dist.py --expected 254
      - name: Verify 254 published ZimaOS subtitles without external dependencies
        run: python -S scripts/curate_taglines.py --verify-dist dist/index.json
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrstore-v2-build
          path: |
            out/audit.json
            out/build-report.json
            dist/store.json
            dist/index.json
          if-no-files-found: warn
      - name: Publish dist to gh-pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
