name: Build and publish MrStore v2
on:
  push:
    branches: [main]
    paths:
      - 'Apps/**'
      - 'web/**'
      - 'assets/branding/**'
      - 'scripts/test_storefront_browser.py'
      - 'scripts/catalog.py'
      - 'scripts/cves.py'
      - 'scripts/release_scan.py'
      - 'scripts/release_catalog.py'
      - 'scripts/curate_taglines.py'
      - 'scripts/validate.py'
      - 'scripts/verify_dist.py'
      - 'data/taglines-pt.json'
      - 'store-config.json'
      - 'category-list.json'
      - 'recommend-list.json'
      - 'supported-languages.json'
      - 'requirements.txt'
      - '.github/workflows/publish.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'assets/branding/**'
      - 'scripts/test_storefront_browser.py'
      - 'Apps/**'
      - 'scripts/catalog.py'
      - 'scripts/cves.py'
      - 'scripts/release_scan.py'
      - 'scripts/release_catalog.py'
      - 'scripts/curate_taglines.py'
      - 'scripts/validate.py'
      - 'scripts/verify_dist.py'
      - 'scripts/privilege_policy.py'
      - 'scripts/compose_preflight.py'
      - 'tests/**'
      - 'data/taglines-pt.json'
      - 'store-config.json'
      - 'category-list.json'
      - 'recommend-list.json'
      - 'supported-languages.json'
      - 'requirements.txt'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mrstore-publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate original catalog and regression tests before expensive image audit
        run: |
          python scripts/validate.py
          python scripts/curate_taglines.py --check
          python -m unittest discover -s tests -v
      - name: Reject new dangerous Docker privileges
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA=HEAD^; fi
          python scripts/privilege_policy.py --base "$BASE_SHA"
  web_smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test interactive storefront in desktop and mobile Chromium
        run: python scripts/test_storefront_browser.py --fixture
      - name: Upload PR browser screenshots (test fixtures, not real catalog)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrstore-web-pr-fixture-screenshots
          path: storefront-fixture-*.png
          if-no-files-found: warn
  security_audit:
    # PRs use their fast validation, privilege and migration gates. Only
    # main/manual releases launch 8 full multi-platform registry scans.
    if: github.event_name != 'pull_request'
    needs: preflight
    name: Scan release images and platforms (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Install pinned crane registry client
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.21.7
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install pinned Trivy scanner
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
      - name: Scan all catalog images by immutable digest on AMD64 and ARM64
        run: >-
          python scripts/release_scan.py --shards 8 --shard ${{ matrix.shard }}
          --output-dir out
      - name: Preserve complete per-image evidence, including vulnerable/inconclusive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrstore-release-security-shard-${{ matrix.shard }}
          path: out/release-cves-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30
  build:
    needs: security_audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate complete source catalog (254 apps) and regression tests
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -v
      - name: Fetch eight mandatory security evidence reports
        uses: actions/download-artifact@v4
        with:
          pattern: mrstore-release-security-shard-*
          path: out/release-evidence
          merge-multiple: false
      - name: Generate isolated approved release catalog; quarantine everything else
        id: release
        run: |
          python scripts/release_catalog.py --reports out/release-evidence --stage release-source --report out/release-selection.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          selected = json.loads(Path("out/release-selection.json").read_text())
          if selected["approved_count"] < 1:
              raise SystemExit("Empty safe catalog; do not publish misleading empty release")
          with open(os.environ["GITHUB_OUTPUT"], "a") as file:
              file.write(f"approved={selected['approved_count']}\n")
          PY
      - name: Validate staged Compose manifests with official Docker Compose parser
        run: >-
          python scripts/compose_preflight.py --root release-source
          --json out/release-compose.json --md out/release-compose.md
      - name: Build official ZimaOS v2 catalog
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: release-source
          output: dist
          base-url: https://mrpiracy94.github.io/MrStore
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json
          report-json: out/build-report.json
      - name: Verify exact approved count and generated v2 files
        run: python scripts/verify_dist.py --expected ${{ steps.release.outputs.approved }}
      - name: Verify published app set and every image digest was retained
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.release_catalog import verify_published
          report = json.loads(Path("out/release-selection.json").read_text())
          verify_published(Path("dist"), report, Path("release-source"))
          PY
      - name: Verify PT subtitles of approved apps
        run: >-
          python -S scripts/curate_taglines.py --verify-dist dist/index.json
          --approved-file out/release-selection.json
      - name: Add public storefront without changing the approved ZimaOS catalog
        run: |
          test -s dist/index.json
          test -s dist/store.json
          mkdir -p dist/web dist/assets/branding
          cp web/index.html dist/index.html
          cp web/style.css dist/web/style.css
          cp web/app.js dist/web/app.js
          cp web/hero.svg dist/web/hero.svg
          cp assets/branding/mrstore-icon.svg dist/assets/branding/mrstore-icon.svg
          cp assets/branding/mrstore-banner.svg dist/assets/branding/mrstore-banner.svg
      - name: Install Chromium for storefront browser verification
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify storefront at reference and mobile viewport sizes
        run: python scripts/test_storefront_browser.py
      - name: Upload storefront browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrstore-web-browser-screenshots
          path: storefront-*.png
          if-no-files-found: warn
      - name: Publish transparent quarantine details alongside the catalog
        run: |
          cp out/release-selection.json dist/release-status.json
          touch dist/.nojekyll
      - name: Upload publication/quarantine diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrstore-v2-build
          path: |
            out/audit.json
            out/build-report.json
            out/release-selection.json
            out/release-compose.json
            out/release-compose.md
            dist/store.json
            dist/index.json
            dist/release-status.json
          if-no-files-found: warn
      - name: Preserve approved ZimaOS v2 catalog for dry-run and publication
        uses: actions/upload-artifact@v4
        with:
          name: mrstore-v2-approved-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve validated approved ZimaOS catalog
        uses: actions/download-artifact@v4
        with:
          name: mrstore-v2-approved-dist
          path: dist/
      - name: Publish approved dist to gh-pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
