name: MrStore — audited release build (publishes main only)
on:
  push:
    branches: [main]
    paths:
      - 'Apps/**'
      - 'scripts/catalog.py'
      - 'scripts/cves.py'
      - 'scripts/release_scan.py'
      - 'scripts/release_catalog.py'
      - 'scripts/image_freshness.py'
      - 'scripts/privilege_policy.py'
      - 'scripts/compose_preflight.py'
      - 'scripts/curate_taglines.py'
      - 'scripts/validate.py'
      - 'scripts/verify_dist.py'
      - 'data/taglines-pt.json'
      - 'store-config.json'
      - 'web/**'
      - 'scripts/stage_storefront.py'
      - 'scripts/export_universal.py'
      - 'tests/test_export_universal.py'
      - 'scripts/export_portable_catalog.py'
      - 'scripts/export_umbrel_preview.py'
      - 'scripts/export_runtipi_preview.py'
      - 'scripts/export_homedock.py'
      - 'scripts/export_olares_preview.py'
      - 'scripts/platform_support_report.py'
      - 'tests/test_platform_support_report.py'
      - 'tests/test_export_homedock.py'
      - 'tests/test_export_olares_preview.py'
      - 'tests/test_export_umbrel_preview.py'
      - 'tests/test_export_runtipi_preview.py'
      - 'tests/test_export_portable_catalog.py'
      - 'tests/test_storefront.py'
      - 'category-list.json'
      - 'recommend-list.json'
      - 'supported-languages.json'
      - 'requirements.txt'
      - '.github/workflows/publish.yml'
  pull_request:
    paths:
      - 'tests/test_publish_workflow_contract.py'
      - 'scripts/zimaos_coverage.py'
      - 'scripts/platform_support_report.py'
      - 'scripts/export_runtipi_preview.py'
      - 'scripts/export_umbrel_preview.py'
      - 'scripts/export_olares_preview.py'
      - 'scripts/export_homedock.py'
      - 'scripts/export_portable_catalog.py'
      - 'scripts/export_universal.py'
      - 'scripts/native_contract_smoke.py'
      - 'docs/UNIVERSAL_PLATFORMS.md'
      - 'docs/UNIVERSAL_COMPATIBILITY.md'
      - 'Apps/**'
      - 'scripts/catalog.py'
      - 'scripts/cves.py'
      - 'scripts/release_scan.py'
      - 'scripts/release_catalog.py'
      - 'scripts/image_freshness.py'
      - 'scripts/curate_taglines.py'
      - 'scripts/validate.py'
      - 'scripts/verify_dist.py'
      - 'scripts/privilege_policy.py'
      - 'scripts/compose_preflight.py'
      - 'data/taglines-pt.json'
      - 'store-config.json'
      - 'web/**'
      - 'scripts/stage_storefront.py'
      - 'tests/test_storefront.py'
      - 'category-list.json'
      - 'recommend-list.json'
      - 'supported-languages.json'
      - 'requirements.txt'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mrstore-publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate original catalog and regression tests before expensive image audit
        run: |
          python scripts/validate.py
          python scripts/curate_taglines.py --check
          python -m unittest discover -s tests -v
      - name: Reject new dangerous Docker privileges
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA=HEAD^; fi
          python scripts/privilege_policy.py --base "$BASE_SHA"
  security_audit:
    # PRs MUST perform the same eight-shard security scan as production.
    # A green PR must never mean only the cheap preflight ran.
    needs: preflight
    name: Scan release images and platforms (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Install pinned crane registry client
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.21.7
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install pinned Trivy scanner
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
      - name: Scan all catalog images by immutable digest on AMD64 and ARM64
        run: >-
          python scripts/release_scan.py --shards 8 --shard ${{ matrix.shard }}
          --output-dir out
      - name: Preserve complete per-image evidence, including vulnerable/inconclusive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrstore-release-security-shard-${{ matrix.shard }}
          path: out/release-cves-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30
  build:
    needs: security_audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate complete source catalog (254 apps) and regression tests
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -v
      - name: Fetch eight mandatory security evidence reports
        uses: actions/download-artifact@v8
        with:
          pattern: mrstore-release-security-shard-*
          path: out/release-evidence
          merge-multiple: false
      - name: Generate isolated approved release catalog; quarantine everything else
        id: release
        run: |
          python scripts/release_catalog.py --reports out/release-evidence --stage release-source --report out/release-selection.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          selected = json.loads(Path("out/release-selection.json").read_text())
          if selected["approved_count"] < 1:
              raise SystemExit("Empty safe catalog; do not publish misleading empty release")
          with open(os.environ["GITHUB_OUTPUT"], "a") as file:
              file.write(f"approved={selected['approved_count']}\n")
          PY
      - name: Validate staged Compose manifests with official Docker Compose parser
        run: >-
          python scripts/compose_preflight.py --root release-source
          --json out/release-compose.json --md out/release-compose.md
      - name: Build official ZimaOS v2 catalog
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: release-source
          output: dist
          base-url: https://mrpiracy94.github.io/MrStore
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json
          report-json: out/build-report.json
      # The external builder may change the active Python environment.
      # Restore our pinned runtime before importing PyYAML in release verification.
      - name: Restore Python 3.12 after ZimaOS builder
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Restore release verification dependencies
        run: |
          python -m pip install -r requirements.txt
          python -c 'import sys, yaml; assert sys.version_info[:2] == (3, 12); print("PyYAML", yaml.__version__)'
      - name: Verify exact approved count and generated v2 files
        run: python scripts/verify_dist.py --expected ${{ steps.release.outputs.approved }}
      - name: Verify published app set and every image digest was retained
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.release_catalog import verify_published
          report = json.loads(Path("out/release-selection.json").read_text())
          verify_published(Path("dist"), report, Path("release-source"))
          PY
      - name: Export approved CasaOS/Homeio preview archive (no unscanned source apps)
        id: universal_preview
        continue-on-error: true
        run: >-
          python scripts/export_universal.py --source release-source
          --selection out/release-selection.json
          --output dist/store/casaos-homeio-preview.zip
      - name: Report optional universal preview failures without blocking ZimaOS
        if: steps.universal_preview.outcome == 'failure'
        run: echo '::warning::CasaOS/Homeio preview was not built. ZimaOS release stays independent; review exporter logs.'
      - name: Verify PT subtitles of approved apps
        run: >-
          python -S scripts/curate_taglines.py --verify-dist dist/index.json
          --approved-file out/release-selection.json
      - name: Publish transparent quarantine details alongside the catalog
        run: |
          cp out/release-selection.json dist/release-status.json
          touch dist/.nojekyll
      - name: Stage responsive GitHub Pages storefront over verified release only
        run: python scripts/stage_storefront.py --source web --dist dist
      - name: Generate audited universal Compose catalog for eleven platforms
        id: universal_compose
        continue-on-error: true
        run: >-
          python scripts/export_portable_catalog.py --source release-source
          --selection out/release-selection.json --dist dist
      - name: Warn if optional portable compatibility catalog failed
        if: steps.universal_compose.outcome == 'failure'
        run: echo '::warning::Portable universal catalog unavailable. ZimaOS output stays intact.'
      - name: Generate isolated Umbrel community-store pilot ZIP (not certified)
        id: umbrel_preview
        continue-on-error: true
        run: >-
          python scripts/export_umbrel_preview.py --source release-source
          --selection out/release-selection.json
          --output dist/store/umbrel-community-preview.zip
      - name: Generate isolated Runtipi custom-store pilot ZIP (not certified)
        id: runtipi_preview
        continue-on-error: true
        run: >-
          python scripts/export_runtipi_preview.py --source release-source
          --selection out/release-selection.json
          --output dist/store/runtipi-store-preview.zip
      - name: Generate native HomeDock HDS and HDStore packages (device tests pending)
        id: homedock_preview
        continue-on-error: true
        run: >-
          python scripts/export_homedock.py --source release-source
          --selection out/release-selection.json --dist dist
      - name: Generate experimental Olares OAC 0.12 charts (device tests pending)
        id: olares_preview
        continue-on-error: true
        run: >-
          python scripts/export_olares_preview.py --source release-source
          --selection out/release-selection.json --dist dist
      - name: Report native preview generation failures
        if: steps.homedock_preview.outcome == 'failure' || steps.olares_preview.outcome == 'failure'
        run: echo '::warning::A native preview failed. Check build logs; ZimaOS publication remains independent.'
      - name: Verify optional cross-platform packages and publish honest compatibility counts
        shell: bash
        run: |
          set -euo pipefail
          if [ -f dist/universal/catalog.json ]; then
            if ! python scripts/platform_support_report.py --selection out/release-selection.json --dist dist; then
              echo '::warning::A universal preview did not match security evidence. Quarantining ALL optional exports.'
              rm -rf dist/universal dist/homedock dist/olares
              rm -f dist/store/casaos-homeio-preview.zip dist/store/umbrel-community-preview.zip dist/store/runtipi-store-preview.zip
            fi
          else
            echo '::warning::Universal base catalog missing. Quarantining partial platform exports.'
            rm -rf dist/universal dist/homedock dist/olares
            rm -f dist/store/casaos-homeio-preview.zip dist/store/umbrel-community-preview.zip dist/store/runtipi-store-preview.zip
          fi
      - name: REQUIRE real audited ZimaOS and Universal output on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            out/release-selection.json \
            out/release-compose.json \
            out/build-report.json \
            dist/store.json \
            dist/index.json \
            dist/release-status.json \
            dist/universal/catalog.json \
            dist/universal/support-report.json; do
            if [ ! -s "$artifact" ]; then
              echo "::error::Mandatory PR build artifact missing: $artifact"
              exit 1
            fi
          done
          python - <<'PY'
          import json
          from pathlib import Path
          approved = json.loads(Path("out/release-selection.json").read_text())
          idx = json.loads(Path("dist/index.json").read_text())
          universal = json.loads(Path("dist/universal/catalog.json").read_text())
          support = json.loads(Path("dist/universal/support-report.json").read_text())
          total = approved["approved_count"]
          assert total > 0, "Empty approved release"
          assert idx["app_count"] == total, "ZimaOS build did not preserve approved count"
          assert universal["approved_count"] == total, "Universal build did not preserve approved count"
          assert support["security_selection_count"] == total, "Support report not from current audit"
          assert len(support["systems"]) == 11, "Missing Universal system targets"
          assert support["runtime_tested"] is False, "No device testing was executed in CI"
          print(f"Verified actual PR release build: {total} approved apps; 11 targets (format-level only)")
          PY
      - name: Assert publication never happens on pull requests
        if: github.event_name == 'pull_request'
        run: echo "Full audit and catalog build ran. Deployment intentionally reserved for main."
      - name: Upload publication/quarantine diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrstore-v2-build
          path: |
            out/audit.json
            out/build-report.json
            out/release-selection.json
            out/release-compose.json
            out/release-compose.md
            dist/store.json
            dist/index.json
            dist/release-status.json
            dist/store/casaos-homeio-preview.zip
            dist/store/umbrel-community-preview.zip
            dist/store/runtipi-store-preview.zip
            dist/homedock/catalog.json
            dist/homedock/mrstore.hdstore
            dist/olares/catalog.json
            dist/olares/olares-oac-preview.zip
            dist/universal/catalog.json
            dist/universal/support-report.json
          if-no-files-found: warn
      - name: Preserve approved ZimaOS v2 catalog for dry-run and publication
        uses: actions/upload-artifact@v4
        with:
          name: mrstore-v2-approved-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve validated approved ZimaOS catalog
        uses: actions/download-artifact@v8
        with:
          name: mrstore-v2-approved-dist
          path: dist/
      - name: Publish approved dist to gh-pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
