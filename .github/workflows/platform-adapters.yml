name: Verify MrStore platform adapters
on:
  push:
    branches: [main]
    paths:
      - 'Apps/**'
      - 'scripts/platform_export.py'
      - 'data/platform-pilots.json'
      - 'data/image-digests.json'
      - 'tests/test_platform_export.py'
      - '.github/workflows/platform-adapters.yml'
  pull_request:
    paths:
      - 'Apps/**'
      - 'scripts/platform_export.py'
      - 'data/platform-pilots.json'
      - 'data/image-digests.json'
      - 'tests/test_platform_export.py'
      - '.github/workflows/platform-adapters.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned YAML dependency
        run: python -m pip install -r requirements.txt
      - name: Test native package adapters and safety gates
        run: python -m unittest discover -s tests -p 'test_platform_export.py' -v
      - name: Build all platform previews and 254-app static compatibility matrix
        run: python scripts/platform_export.py --platform all --output out/platforms
      - name: Check generated package invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, zipfile, yaml
          dest=Path('out/platforms')
          matrix=json.loads((dest/'compatibility.json').read_text())
          source={x.parent.name for x in Path('Apps').glob('*/docker-compose.yml')}
          assert {x['app'] for x in matrix['apps']} == source
          assert matrix['certification'] == 'not_assessed'
          assert matrix['device_installations_verified'] == 0
          assert yaml.safe_load((dest/'umbrel/umbrel-app-store.yml').read_text())['id'] == 'mrstore'
          for os in ('casaos','homeio'):
              with zipfile.ZipFile(dest/os/f'mrstore-{os}.zip') as archive:
                  assert archive.testzip() is None
                  assert any(x.startswith('Apps/') for x in archive.namelist())
          print('Offline packages inspected; real-device compatibility NOT certified')
          PY
      - name: Preserve auditable package previews (not an automatic installer)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mrstore-cross-platform-preview
          path: out/platforms/
          if-no-files-found: error
          retention-days: 30
