name: Dockerfile base-image vulnerability audit
on:
  pull_request:
    paths:
      - 'scripts/audit_dockerfile_bases.py'
      - 'tests/test_dockerfile_base_scan.py'
      - '.github/workflows/dockerfile-base-scan.yml'
  push:
    branches: [main]
    paths:
      - 'security/images/**/Dockerfile'
      - 'scripts/audit_dockerfile_bases.py'
      - '.github/workflows/dockerfile-base-scan.yml'
  schedule:
    - cron: '14 4 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mrstore-dockerfile-bases-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_dockerfile_base_scan.py' -v
  base_cves:
    if: github.event_name != 'pull_request'
    needs: offline_tests
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache: false
      - name: Install pinned crane client
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.21.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
      - name: Scan base images by digest (AMD64 and ARM64)
        run: python scripts/audit_dockerfile_bases.py --shard ${{ matrix.shard }} --shards 4
      - name: Preserve findings and pending/error states
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mrstore-dockerfile-base-cves-${{ matrix.shard }}
          path: out/dockerfile-base-scan-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30
