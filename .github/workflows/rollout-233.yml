name: Publish curated 254 MrStore applications
on:
  push:
    branches: [main]
    paths:
      - 'Apps/**'
      - 'data/featured-apps.json'
      - 'scripts/publish_editorial.py'
      - '.github/workflows/rollout-233.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mrstore-static-site
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Generate exact 254-app editorial selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          selected = json.loads(Path('data/featured-apps.json').read_text())['apps']
          source = {p.parent.name for p in Path('Apps').glob('*/docker-compose.yml')}
          assert len(selected) == len(set(selected)) == 254 and set(selected) <= source
          Path('out').mkdir(exist_ok=True)
          Path('out/featured-all.json').write_text(json.dumps({'schema': 1, 'description': '254 editorial apps, not certified', 'apps': selected}, indent=2) + chr(10))
          PY
      - name: Stage entire editorial selection
        run: python scripts/publish_editorial.py --featured out/featured-all.json --stage release-source --report out/release-selection.json
      - name: Confirm 254 app definitions before building
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          selected = json.loads(Path("out/featured-all.json").read_text())["apps"]
          staged = {p.parent.name for p in Path("release-source/Apps").glob("*/docker-compose.yml")}
          assert len(selected) == 254 and staged == set(selected)
          print("254 manifests ready")
          PY
      - name: Build official ZimaOS v2 catalog
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: release-source
          output: dist
          base-url: https://mrpiracy94.github.io/MrStore
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json
          report-json: out/build-report.json
      - name: Confirm all 254 applications are in official index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {"io.github.mrpiracy94." + x for x in json.loads(Path("data/featured-apps.json").read_text())["apps"]}
          index = json.loads(Path("dist/index.json").read_text())
          actual = {x["id"] for x in index["apps"]}
          assert index["app_count"] == 254 and actual == expected, f"missing {sorted(expected-actual)}; extra {sorted(actual-expected)}"
          print("Verified", len(actual), "published entries")
          PY
      - name: Stage website and uncertified editorial status
        run: |
          cp out/release-selection.json dist/release-status.json
          python scripts/stage_storefront.py --source web --dist dist
          touch dist/.nojekyll
      - name: Publish complete catalog
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
      - name: Confirm gh-pages contains 254 applications
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = "https://raw.githubusercontent.com/mrpiracy94/MrStore/gh-pages/index.json"
          for attempt in range(15):
              req = urllib.request.Request(url + "?check=" + str(time.time_ns()), headers={"User-Agent": "MrStore-release-check"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      data = json.load(response)
                  if data.get("app_count") == 254 and len(data.get("apps", [])) == 254:
                      print("Confirmed 254 entries on gh-pages")
                      break
              except Exception as exc:
                  print("Waiting for gh-pages:", exc)
              time.sleep(8)
          else:
              raise SystemExit("Published gh-pages index did not reach 254")
          PY
