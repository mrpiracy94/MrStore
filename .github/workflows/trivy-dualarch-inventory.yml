name: Trivy dual-architecture dependency inventory
on:
  push:
    branches:
      - security/group-dualarch-cves-20261010
    paths:
      - 'scripts/group_trivy_findings.py'
      - 'scripts/release_scan.py'
      - '.github/workflows/trivy-dualarch-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Install crane
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.21.7
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
      - name: Scan immutable AMD64 and ARM64 images
        run: python scripts/release_scan.py --shards 8 --shard ${{ matrix.shard }} --output-dir out
      - name: Upload scan JSON even for vulnerable images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dualarch-shard-${{ matrix.shard }}
          path: out/release-cves-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30
  group:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: dualarch-shard-*
          path: out/release-evidence
          merge-multiple: false
      - name: Produce grouped package/CVE reports
        run: python scripts/group_trivy_findings.py --reports out/release-evidence --json out/dualarch-groups.json --md out/dualarch-groups.md
      - name: Upload grouped report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrstore-dualarch-vulnerability-groups
          path: |
            out/dualarch-groups.json
            out/dualarch-groups.md
          if-no-files-found: warn
          retention-days: 30
