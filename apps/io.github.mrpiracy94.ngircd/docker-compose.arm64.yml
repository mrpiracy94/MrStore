name: ngircd
services:
  ngircd:
    image: lscr.io/linuxserver/ngircd:latest@sha256:4b6b78d31bedf9b7039cf0b06fe885ca8b772cc028e3cc87ff6e99506c316cf3
    container_name: ngircd
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 6667
        published: "6667"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ngircd/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.ngircd
  version: "1.0.1"
  main: ngircd
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.ngircd/assets/icon.svg
  title:
    en_US: "ngIRCd"
  port_map: "6667"
  index: /
