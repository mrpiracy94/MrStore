name: ngircd
services:
  ngircd:
    image: ghcr.io/mrpiracy94/mrstore-lowcve-ngircd:secfix-38353c004df31ee7ac721591496f8937b9013dc9@sha256:8ec35cbc9b8cfbc0ba5645a2a7274662e48b3d706d2447a5f2781195847cc40a
    container_name: ngircd
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 6667
        published: "6667"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ngircd/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.ngircd
  version: "1.0.2"
  main: ngircd
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.ngircd/assets/icon.png
  title:
    en_US: "ngIRCd"
  port_map: "6667"
  index: /
