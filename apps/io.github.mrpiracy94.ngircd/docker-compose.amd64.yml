name: ngircd
services:
  ngircd:
    image: lscr.io/linuxserver/ngircd:latest@sha256:25983b264c52d4a8a8c1808c1f4ed5ee636e663051d9032f3b9945b2f4e945fc
    container_name: ngircd
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 6667
        published: "6667"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ngircd/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.ngircd
  version: "1.0.0"
  main: ngircd
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.ngircd/assets/icon.svg
  title:
    en_US: "ngIRCd"
  port_map: "6667"
  index: /
