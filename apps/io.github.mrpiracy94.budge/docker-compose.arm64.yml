name: budge
services:
  budge:
    image: lscr.io/linuxserver/budge:latest@sha256:a38541a63242cd9924acd5ed624fd08fb3f0080cc89d7c54a71aa431634130c2
    container_name: budge
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 80
        published: "20055"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/budge/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.budge
  version: "1.0.0"
  main: budge
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.budge/assets/icon.svg
  title:
    en_US: "Budge"
  port_map: "20055"
  index: /
