name: budge
services:
  budge:
    image: lscr.io/linuxserver/budge:latest@sha256:187a8087588bd1d8dc6601a81a771549fcfe3cb72388633acb5e19dea11f338e
    container_name: budge
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 80
        published: "20055"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/budge/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.budge
  version: "1.0.1"
  main: budge
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.budge/assets/icon.svg
  title:
    en_US: "Budge"
  port_map: "20055"
  index: /
