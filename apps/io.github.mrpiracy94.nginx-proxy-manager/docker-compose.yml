name: nginx-proxy-manager
services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - target: 81
        published: "81"
        protocol: tcp
      - target: 80
        published: "30009"
        protocol: tcp
      - target: 443
        published: "30010"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/nginx-proxy-manager/data
        target: /data
      - type: bind
        source: /DATA/AppData/nginx-proxy-manager/letsencrypt
        target: /etc/letsencrypt
x-casaos:
  id: io.github.mrpiracy94.nginx-proxy-manager
  version: "1.0.0"
  main: nginx-proxy-manager
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.nginx-proxy-manager/assets/icon.png
  title:
    en_US: "Nginx Proxy Manager"
  port_map: "81"
  index: /
