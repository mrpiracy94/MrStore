name: wikijs
services:
  wikijs:
    image: lscr.io/linuxserver/wikijs:latest@sha256:977e142dfe0aea806873f28dc0f452c251749a610be72982fee8f5bd4c673930
    container_name: wikijs
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 3000
        published: "20027"
        protocol: tcp
      - target: 3001
        published: "3001"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/wikijs/config
        target: /config
      - type: bind
        source: /DATA/AppData/wikijs/data
        target: /data
x-casaos:
  id: io.github.mrpiracy94.wikijs
  version: "1.0.1"
  main: wikijs
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.wikijs/assets/icon.png
  title:
    en_US: "Wiki.js"
  port_map: "20027"
  index: /
