name: ferdium
services:
  ferdium:
    image: lscr.io/linuxserver/ferdium:latest@sha256:38e8f096081ada46a332bba4bb69ba6c23577a124c071cffec8ef359152a468e
    container_name: ferdium
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Ferdium"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21052"
        protocol: tcp
      - target: 3001
        published: "21053"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ferdium/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.ferdium
  version: "1.0.1"
  main: ferdium
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.ferdium/assets/icon.png
  title:
    en_US: "Ferdium"
  port_map: "21052"
  index: /
