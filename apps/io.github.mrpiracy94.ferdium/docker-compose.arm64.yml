name: ferdium
services:
  ferdium:
    image: lscr.io/linuxserver/ferdium:latest@sha256:dac53f9bd3a5b5d3a99c2f914ac1ca5925cf5f23c49b647768b7f454f243e62f
    container_name: ferdium
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Ferdium"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21052"
        protocol: tcp
      - target: 3001
        published: "21053"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ferdium/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.ferdium
  version: "1.0.1"
  main: ferdium
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.ferdium/assets/icon.png
  title:
    en_US: "Ferdium"
  port_map: "21052"
  index: /
