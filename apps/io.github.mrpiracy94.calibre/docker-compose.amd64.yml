name: calibre
services:
  calibre:
    image: lscr.io/linuxserver/calibre:latest@sha256:8bff661d2509d8c2dc006c40064ccd440da769af2f667350e7b9c13499468b7f
    container_name: calibre
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Calibre"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21028"
        protocol: tcp
      - target: 3001
        published: "21029"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/calibre/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.calibre
  version: "1.0.0"
  main: calibre
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.calibre/assets/icon.png
  title:
    en_US: "Calibre"
  port_map: "21028"
  index: /
