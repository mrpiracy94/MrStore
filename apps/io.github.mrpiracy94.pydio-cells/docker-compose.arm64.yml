name: pydio-cells
services:
  pydio-cells:
    image: lscr.io/linuxserver/pydio-cells:latest@sha256:e0afb01da3fba65db89e9ffee23dfee09c2d3cd57c47be386b95386670bd761f
    container_name: pydio-cells
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8080
        published: "20022"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pydio-cells/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.pydio-cells
  version: "1.0.2"
  main: pydio-cells
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.pydio-cells/assets/icon.svg
  title:
    en_US: "Pydio Cells"
  port_map: "20022"
  index: /
