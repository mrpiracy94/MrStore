name: immich
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release@sha256:79bebf8e2cb9a727016c3f4fe51ab6fd531b2d1075ef8e618bffc00204010de9
    container_name: immich-server
    restart: unless-stopped
    depends_on:
      - immich-redis
      - immich-database
    environment:
      - "DB_HOSTNAME=immich-database"
      - "DB_USERNAME=postgres"
      - "DB_PASSWORD=CHANGE_ME"
      - "DB_DATABASE_NAME=immich"
      - "REDIS_HOSTNAME=immich-redis"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 2283
        published: "2283"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/Gallery/immich
        target: /data
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release@sha256:51d161360e316f54ee04cf5f75d1dc90b5d318d170ef7f361377ebce1d204a5f
    container_name: immich-machine-learning
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
    volumes:
      - type: bind
        source: /DATA/AppData/immich/model-cache
        target: /cache
  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:5a6ac3cceea0d4cebe48911dfa5f393f49feea86a2c55c5ac6b0ba733a1713b6
    container_name: immich-redis
    restart: unless-stopped
  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:6244e923bfde05b58bc4fc26b21025415c166c6239b6b9886fb0e806dcc99001
    container_name: immich-database
    restart: unless-stopped
    environment:
      - "POSTGRES_PASSWORD=CHANGE_ME"
      - "POSTGRES_USER=postgres"
      - "POSTGRES_DB=immich"
      - "POSTGRES_INITDB_ARGS=--data-checksums"
    volumes:
      - type: bind
        source: /DATA/AppData/immich/postgres
        target: /var/lib/postgresql/data
x-casaos:
  id: io.github.mrpiracy94.immich
  version: "1.0.1"
  main: immich-server
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.immich/assets/icon.png
  title:
    en_US: "Immich"
  port_map: "2283"
  index: /
