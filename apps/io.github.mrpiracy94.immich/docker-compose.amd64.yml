name: immich
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release@sha256:db996e352359771c6a3db121a0ed8761516b22f727fc092a0f46dcfef82c1bc1
    container_name: immich-server
    restart: unless-stopped
    depends_on:
      - immich-redis
      - immich-database
    environment:
      - "DB_HOSTNAME=immich-database"
      - "DB_USERNAME=postgres"
      - "DB_PASSWORD=CHANGE_ME"
      - "DB_DATABASE_NAME=immich"
      - "REDIS_HOSTNAME=immich-redis"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 2283
        published: "2283"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/Gallery/immich
        target: /data
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release@sha256:513c831cfb010ad319341a0c86b42c575a0d5b688d3e8cae346ee624074a58ed
    container_name: immich-machine-learning
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
    volumes:
      - type: bind
        source: /DATA/AppData/immich/model-cache
        target: /cache
  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    container_name: immich-redis
    restart: unless-stopped
  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-database
    restart: unless-stopped
    environment:
      - "POSTGRES_PASSWORD=CHANGE_ME"
      - "POSTGRES_USER=postgres"
      - "POSTGRES_DB=immich"
      - "POSTGRES_INITDB_ARGS=--data-checksums"
    volumes:
      - type: bind
        source: /DATA/AppData/immich/postgres
        target: /var/lib/postgresql/data
x-casaos:
  id: io.github.mrpiracy94.immich
  version: "1.0.1"
  main: immich-server
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.immich/assets/icon.png
  title:
    en_US: "Immich"
  port_map: "2283"
  index: /
