name: immich
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release@sha256:96c6ec77cdea5a3c90539b81baf8c276b834deb595b1603c4aefc1903ab6a05b
    container_name: immich-server
    restart: unless-stopped
    depends_on:
      - immich-redis
      - immich-database
    environment:
      - "DB_HOSTNAME=immich-database"
      - "DB_USERNAME=postgres"
      - "DB_PASSWORD=CHANGE_ME"
      - "DB_DATABASE_NAME=immich"
      - "REDIS_HOSTNAME=immich-redis"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 2283
        published: "2283"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/Gallery/immich
        target: /data
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release@sha256:df34e834183d6fe179877fe4f4822338bc9a1d9fc776a3c40966f17a09b0d30a
    container_name: immich-machine-learning
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
    volumes:
      - type: bind
        source: /DATA/AppData/immich/model-cache
        target: /cache
  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:ac9c858b86dc81f3482d53a9d854547379a5f41e012500f839ab257c399063e0
    container_name: immich-redis
    restart: unless-stopped
  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:b1d33572a9a0634aa6d344077467ad32847812a37fa3859f702952cba22a2f55
    container_name: immich-database
    restart: unless-stopped
    environment:
      - "POSTGRES_PASSWORD=CHANGE_ME"
      - "POSTGRES_USER=postgres"
      - "POSTGRES_DB=immich"
      - "POSTGRES_INITDB_ARGS=--data-checksums"
    volumes:
      - type: bind
        source: /DATA/AppData/immich/postgres
        target: /var/lib/postgresql/data
x-casaos:
  id: io.github.mrpiracy94.immich
  version: "1.0.0"
  main: immich-server
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.immich/assets/icon.png
  title:
    en_US: "Immich"
  port_map: "2283"
  index: /
