name: webstation
services:
  webstation:
    image: lscr.io/linuxserver/webstation:latest@sha256:e80246dc15f1688df59358527c0ec77ae66b59eab7c6ae6976dfd71dffd1cf6a
    container_name: webstation
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Webstation"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21008"
        protocol: tcp
      - target: 3001
        published: "21009"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webstation/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.webstation
  version: "1.0.1"
  main: webstation
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.webstation/assets/icon.png
  title:
    en_US: "Webstation"
  port_map: "21008"
  index: /
