name: altus
services:
  altus:
    image: lscr.io/linuxserver/altus:latest@sha256:b30469512067e807063735f9bc671c8840438e67ade0acfaa31b7c7abe6b4384
    container_name: altus
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Altus"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21012"
        protocol: tcp
      - target: 3001
        published: "21013"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/altus/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.altus
  version: "1.0.1"
  main: altus
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.altus/assets/icon.svg
  title:
    en_US: "Altus"
  port_map: "21012"
  index: /
