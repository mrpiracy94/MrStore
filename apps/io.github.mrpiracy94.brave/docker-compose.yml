name: brave
services:
  brave:
    image: lscr.io/linuxserver/brave:latest
    container_name: brave
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Brave"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21026"
        protocol: tcp
      - target: 3001
        published: "21027"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/brave/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.brave
  version: "1.0.0"
  main: brave
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.brave/assets/icon.png
  title:
    en_US: "Brave"
  port_map: "21026"
  index: /
