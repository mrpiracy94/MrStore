name: freecad
services:
  freecad:
    image: lscr.io/linuxserver/freecad:latest@sha256:79e4344533aa28a03799cb1a36376f17ffee98c78890ef78d8297908eed301e8
    container_name: freecad
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=FreeCAD"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21060"
        protocol: tcp
      - target: 3001
        published: "21061"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/freecad/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.freecad
  version: "1.0.1"
  main: freecad
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.freecad/assets/icon.png
  title:
    en_US: "FreeCAD"
  port_map: "21060"
  index: /
