name: krita
services:
  krita:
    image: lscr.io/linuxserver/krita:latest
    container_name: krita
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Krita"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21086"
        protocol: tcp
      - target: 3001
        published: "21087"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/krita/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.krita
  version: "1.0.0"
  main: krita
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.krita/assets/icon.svg
  title:
    en_US: "Krita"
  port_map: "21086"
  index: /
