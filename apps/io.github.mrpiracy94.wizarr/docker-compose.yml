name: wizarr
services:
  wizarr:
    image: ghcr.io/wizarrrr/wizarr:latest
    container_name: wizarr
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
    ports:
      - target: 5690
        published: "5690"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/wizarr
        target: /data/database
x-casaos:
  id: io.github.mrpiracy94.wizarr
  version: "1.0.1"
  main: wizarr
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.wizarr/assets/icon.png
  title:
    en_US: "Wizarr"
  port_map: "5690"
  index: /
