name: minisatip
services:
  minisatip:
    image: lscr.io/linuxserver/minisatip:latest@sha256:e4aa5d3b399b5e4eeaf69ee41159821b1cdf1096f9e3b2691a1c9dbcddd48cc6
    container_name: minisatip
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8875
        published: "8875"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/minisatip/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.minisatip
  version: "1.0.1"
  main: minisatip
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.minisatip/assets/icon.svg
  title:
    en_US: "minisatip"
  port_map: "8875"
  index: /
