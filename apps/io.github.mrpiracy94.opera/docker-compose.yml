name: opera
services:
  opera:
    image: lscr.io/linuxserver/opera:latest
    container_name: opera
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Opera"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21110"
        protocol: tcp
      - target: 3001
        published: "21111"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.opera
  version: "1.0.0"
  main: opera
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.opera/assets/icon.png
  title:
    en_US: "Opera"
  port_map: "21110"
  index: /
