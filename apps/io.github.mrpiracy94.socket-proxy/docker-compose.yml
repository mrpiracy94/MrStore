name: socket-proxy
services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "CONTAINERS=1"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
x-casaos:
  id: io.github.mrpiracy94.socket-proxy
  version: "1.0.1"
  main: socket-proxy
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.socket-proxy/assets/icon.svg
  title:
    en_US: "Socket Proxy"
  port_map: "0"
  index: /
