name: doplarr_rs
services:
  doplarr_rs:
    image: lscr.io/linuxserver/doplarr_rs:latest@sha256:6b3617fc61d3603b1272c4489b83e4bb2d2694d4ca15f1b48bfaf4f62475aec6
    container_name: doplarr_rs
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    volumes:
      - type: bind
        source: /DATA/AppData/doplarr_rs/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.doplarr_rs
  version: "1.0.2"
  main: doplarr_rs
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.doplarr_rs/assets/icon.png
  title:
    en_US: "Doplarr RS"
  port_map: "0"
  index: /
