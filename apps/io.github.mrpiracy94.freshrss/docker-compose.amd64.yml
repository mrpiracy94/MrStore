name: freshrss
services:
  freshrss:
    image: lscr.io/linuxserver/freshrss:latest@sha256:bd13d4a611959bad42bd79965d3202c518494bd775be4a0f61e4b81098b18b01
    container_name: freshrss
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 80
        published: "20032"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/freshrss/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.freshrss
  version: "1.0.1"
  main: freshrss
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.freshrss/assets/icon.png
  title:
    en_US: "FreshRSS"
  port_map: "20032"
  index: /
