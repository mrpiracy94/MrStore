name: retroarch
services:
  retroarch:
    image: lscr.io/linuxserver/retroarch:latest@sha256:595c0096f3f3c2a6887296d2495a31f520aea22e1a29d9c5d216212d1424c3bd
    container_name: retroarch
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=RetroArch"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21130"
        protocol: tcp
      - target: 3001
        published: "21131"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/retroarch/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.retroarch
  version: "1.0.1"
  main: retroarch
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.retroarch/assets/icon.png
  title:
    en_US: "RetroArch"
  port_map: "21130"
  index: /
