name: luanti
services:
  luanti:
    image: lscr.io/linuxserver/luanti:latest@sha256:846403972723cf16f524fc0684b830a94b08d66015d3c14ade69fc4d373c52d6
    container_name: luanti
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 30000
        published: "30000"
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/luanti/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.luanti
  version: "1.0.1"
  main: luanti
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.luanti/assets/icon.png
  title:
    en_US: "Luanti"
  port_map: "0"
  index: /
