name: uptime-kuma
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2@sha256:91b9ed75424d8c638124e5a04f3012c34b0fbe06e928191e576bdbc362a2b3ad
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
    ports:
      - target: 3001
        published: "30004"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/uptime-kuma
        target: /app/data
x-casaos:
  id: io.github.mrpiracy94.uptime-kuma
  version: "1.0.0"
  main: uptime-kuma
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.uptime-kuma/assets/icon.png
  title:
    en_US: "Uptime Kuma"
  port_map: "30004"
  index: /
