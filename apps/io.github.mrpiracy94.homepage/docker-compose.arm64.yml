name: homepage
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest@sha256:57c4a0531937889c0b968b120fe9c2560bbe036b5c9e18c49a9e2479de9975d1
    container_name: homepage
    restart: unless-stopped
    environment:
      - "HOMEPAGE_ALLOWED_HOSTS=zimaos.local:30007"
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 3000
        published: "30007"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/homepage
        target: /app/config
x-casaos:
  id: io.github.mrpiracy94.homepage
  version: "1.0.2"
  main: homepage
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.homepage/assets/icon.png
  title:
    en_US: "Homepage"
  port_map: "30007"
  index: /
