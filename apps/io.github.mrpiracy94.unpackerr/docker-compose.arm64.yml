  version: "1.0.1"
  main: unpackerr
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.unpackerr/assets/icon.png
  title:
    en_US: "Unpackerr"
  port_map: "0"
  index: /
