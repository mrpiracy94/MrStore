name: eden
services:
  eden:
    image: lscr.io/linuxserver/eden:latest
    container_name: eden
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Eden"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21050"
        protocol: tcp
      - target: 3001
        published: "21051"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/eden/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.eden
  version: "1.0.1"
  main: eden
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.eden/assets/icon.svg
  title:
    en_US: "Eden"
  port_map: "21050"
  index: /
