name: pwndrop
services:
  pwndrop:
    image: lscr.io/linuxserver/pwndrop:latest@sha256:fcd33898bee69e9efc90a4f2d9a7757b5f891ec4812be5ee99a93b9fe76d7447
    container_name: pwndrop
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8080
        published: "20059"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pwndrop/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.pwndrop
  version: "1.0.1"
  main: pwndrop
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.pwndrop/assets/icon.png
  title:
    en_US: "pwndrop"
  port_map: "20059"
  index: /
