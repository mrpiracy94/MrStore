name: mysql-workbench
services:
  mysql-workbench:
    image: lscr.io/linuxserver/mysql-workbench:latest@sha256:d78ad9fa149d2f2f8c5db7229099c3e50aa73023a4cc24d27e5a847ba942ab4f
    container_name: mysql-workbench
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=MySQL Workbench"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21104"
        protocol: tcp
      - target: 3001
        published: "21105"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mysql-workbench/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.mysql-workbench
  version: "1.0.1"
  main: mysql-workbench
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.mysql-workbench/assets/icon.png
  title:
    en_US: "MySQL Workbench"
  port_map: "21104"
  index: /
