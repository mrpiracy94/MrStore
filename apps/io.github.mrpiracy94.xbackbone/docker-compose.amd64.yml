name: xbackbone
services:
  xbackbone:
    image: lscr.io/linuxserver/xbackbone:latest@sha256:49fe1906d4c5ef7d38baa95e7c4cd756d193b9220b56a71d431959108ca5eb46
    container_name: xbackbone
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 80
        published: "20023"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/xbackbone/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.xbackbone
  version: "1.0.0"
  main: xbackbone
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.xbackbone/assets/icon.png
  title:
    en_US: "XBackBone"
  port_map: "20023"
  index: /
