name: adguardhome-sync
services:
  adguardhome-sync:
    image: lscr.io/linuxserver/adguardhome-sync:latest@sha256:846b9964e92e446ff22f74d9b514876ceb3c67b18bee5da371d1152b1df1d19b
    container_name: adguardhome-sync
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8080
        published: "20016"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/adguardhome-sync/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.adguardhome-sync
  version: "1.0.0"
  main: adguardhome-sync
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.adguardhome-sync/assets/icon.svg
  title:
    en_US: "AdGuardHome Sync"
  port_map: "20016"
  index: /
