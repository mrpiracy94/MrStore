name: firefox
services:
  firefox:
    image: lscr.io/linuxserver/firefox:latest@sha256:7bfbe3a646be4326c339ff20d19ac60ff6402bcc0bbefc3c9e6fb36e4ab05c20
    container_name: firefox
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Firefox"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21056"
        protocol: tcp
      - target: 3001
        published: "21057"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/firefox/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.firefox
  version: "1.0.0"
  main: firefox
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.firefox/assets/icon.png
  title:
    en_US: "Firefox"
  port_map: "21056"
  index: /
