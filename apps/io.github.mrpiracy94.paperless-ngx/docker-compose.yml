name: paperless-ngx
services:
  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    restart: unless-stopped
    depends_on:
      - paperless-broker
    environment:
      - "PAPERLESS_REDIS=redis://paperless-broker:6379"
      - "PAPERLESS_SECRET_KEY=CHANGE_ME"
      - "PAPERLESS_TIME_ZONE=Europe/Lisbon"
      - "PAPERLESS_OCR_LANGUAGE=por+eng"
      - "USERMAP_UID=1000"
      - "USERMAP_GID=1000"
    ports:
      - target: 8000
        published: "30020"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/paperless/data
        target: /usr/src/paperless/data
      - type: bind
        source: /DATA/AppData/paperless/media
        target: /usr/src/paperless/media
      - type: bind
        source: /DATA/AppData/paperless/export
        target: /usr/src/paperless/export
      - type: bind
        source: /DATA/Documents/consume
        target: /usr/src/paperless/consume
  paperless-broker:
    image: docker.io/library/redis:8
    container_name: paperless-broker
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/paperless/redis
        target: /data
x-casaos:
  id: io.github.mrpiracy94.paperless-ngx
  version: "1.0.1"
  main: paperless-ngx
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.paperless-ngx/assets/icon.png
  title:
    en_US: "Paperless-ngx"
  port_map: "30020"
  index: /
