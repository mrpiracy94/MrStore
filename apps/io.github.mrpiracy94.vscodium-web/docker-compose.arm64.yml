name: vscodium-web
services:
  vscodium-web:
    image: lscr.io/linuxserver/vscodium-web:latest@sha256:c1bc670d4f9bf10994090715923d0e62ff339749c19028c2d483759568e139e6
    container_name: vscodium-web
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 3000
        published: "20047"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium-web/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.vscodium-web
  version: "1.0.2"
  main: vscodium-web
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.vscodium-web/assets/icon.png
  title:
    en_US: "VSCodium Web"
  port_map: "20047"
  index: /
