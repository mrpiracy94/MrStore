name: nginx
services:
  nginx:
    image: lscr.io/linuxserver/nginx:latest@sha256:18589f85a30440a4d4ebcd2967c948013bd0a02e9021c7df2378edff4d0a07aa
    container_name: nginx
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 80
        published: "20043"
        protocol: tcp
      - target: 443
        published: "20044"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/nginx/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.nginx
  version: "1.0.1"
  main: nginx
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.nginx/assets/icon.png
  title:
    en_US: "NGINX"
  port_map: "20043"
  index: /
