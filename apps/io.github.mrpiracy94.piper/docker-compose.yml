name: piper
services:
  piper:
    image: lscr.io/linuxserver/piper:latest
    container_name: piper
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "PIPER_VOICE=en_US-lessac-medium"
    ports:
      - target: 10200
        published: "10200"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/piper/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.piper
  version: "1.0.1"
  main: piper
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.piper/assets/icon.svg
  title:
    en_US: "Piper"
  port_map: "10200"
  index: /
