name: pelorus
services:
  pelorus:
    image: lscr.io/linuxserver/pelorus:latest@sha256:2ce1c2b9b6add922a6592cafae11481b988d3a5dc6bb7ed0634ec31db2f0bc0a
    container_name: pelorus
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 3000
        published: "20057"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.pelorus
  version: "1.0.1"
  main: pelorus
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.pelorus/assets/icon.png
  title:
    en_US: "Pelorus"
  port_map: "20057"
  index: /
