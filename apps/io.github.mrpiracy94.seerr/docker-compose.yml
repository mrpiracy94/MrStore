name: seerr
services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    init: true
    user: "1000:1000"
    environment:
      - "LOG_LEVEL=info"
      - "PORT=5055"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 5055
        published: "5055"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/seerr
        target: /app/config
x-casaos:
  id: io.github.mrpiracy94.seerr
  version: "1.0.0"
  main: seerr
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.seerr/assets/icon.png
  title:
    en_US: "Seerr"
  port_map: "5055"
  index: /
