name: librewolf
services:
  librewolf:
    image: lscr.io/linuxserver/librewolf:latest@sha256:bfab548d2c6c66234d04309d8abbf9584a63989bbd5944f3ea56fed1f3fb01ac
    container_name: librewolf
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=LibreWolf"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21090"
        protocol: tcp
      - target: 3001
        published: "21091"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/librewolf/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.librewolf
  version: "1.0.1"
  main: librewolf
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.librewolf/assets/icon.png
  title:
    en_US: "LibreWolf"
  port_map: "21090"
  index: /
