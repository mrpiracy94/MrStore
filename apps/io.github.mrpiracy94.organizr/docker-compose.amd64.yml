name: organizr
services:
  organizr:
    image: organizr/organizr:latest@sha256:1ce319d73cdfd2666ec7ef21e15907531fabc8a6f333c4ac61e2b2e9d2d162f5
    container_name: organizr
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
    ports:
      - target: 80
        published: "20066"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/organizr/config
        target: /config
