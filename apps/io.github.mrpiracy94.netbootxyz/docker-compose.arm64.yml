name: netbootxyz
services:
  netbootxyz:
    image: lscr.io/linuxserver/netbootxyz:latest
    container_name: netbootxyz
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 3000
        published: "20013"
        protocol: tcp
      - target: 69
        published: "69"
        protocol: udp
      - target: 8080
        published: "20014"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/netbootxyz/config
        target: /config
      - type: bind
        source: /DATA/AppData/netbootxyz/assets
        target: /assets
x-casaos:
  id: io.github.mrpiracy94.netbootxyz
  version: "1.0.0"
  main: netbootxyz
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.netbootxyz/assets/icon.png
  title:
    en_US: "netboot.xyz"
  port_map: "20013"
  index: /
