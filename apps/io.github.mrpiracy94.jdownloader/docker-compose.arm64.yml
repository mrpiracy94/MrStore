name: jdownloader
services:
  jdownloader:
    image: ghcr.io/mrpiracy94/mrstore-jdownloader:v26.09.1-alpine-secfix-20261010@sha256:b0778ccce498d81b3a10f16beb52525b6e7b93e204cb00a308719915dacf62cf
    container_name: jdownloader
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
    ports:
      - target: 5800
        published: "5800"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/jdownloader/config
        target: /config
      - type: bind
        source: /DATA/Downloads
        target: /output
x-casaos:
  id: io.github.mrpiracy94.jdownloader
  version: "1.0.2"
  main: jdownloader
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.jdownloader/assets/icon.png
  title:
    en_US: "JDownloader 2"
  port_map: "5800"
  index: /
