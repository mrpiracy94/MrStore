name: chrome
services:
  chrome:
    image: lscr.io/linuxserver/chrome:latest@sha256:1c3299f19d843195ba16d56d02f1e23a05a1d8604c567e0cb9c1e275229c9dee
    container_name: chrome
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Chrome"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21032"
        protocol: tcp
      - target: 3001
        published: "21033"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/chrome/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.chrome
  version: "1.0.0"
  main: chrome
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.chrome/assets/icon.png
  title:
    en_US: "Chrome"
  port_map: "21032"
  index: /
