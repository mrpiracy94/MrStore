name: synclounge
services:
  synclounge:
    image: lscr.io/linuxserver/synclounge:latest@sha256:0d21be07263d4b0187a290649d949ecb899bc8fa9994b3d1648546ca7e054ce7
    container_name: synclounge
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8088
        published: "8088"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/synclounge/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.synclounge
  version: "1.0.1"
  main: synclounge
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.synclounge/assets/icon.png
  title:
    en_US: "SyncLounge"
  port_map: "8088"
  index: /
