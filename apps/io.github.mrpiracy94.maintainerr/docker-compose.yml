name: maintainerr
services:
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest@sha256:8251a1f0ba5d71acc878846a727fba566ec87cbfbf6a914fb881a5953af53d46
    container_name: maintainerr
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
    ports:
      - target: 6246
        published: "6246"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/maintainerr
        target: /opt/data
x-casaos:
  id: io.github.mrpiracy94.maintainerr
  version: "1.0.1"
  main: maintainerr
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.maintainerr/assets/icon.png
  title:
    en_US: "Maintainerr"
  port_map: "6246"
  index: /
