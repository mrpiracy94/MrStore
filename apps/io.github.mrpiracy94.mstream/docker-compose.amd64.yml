name: mstream
services:
  mstream:
    image: lscr.io/linuxserver/mstream:latest@sha256:2315a37305acc7f3648d937756c97c26f97e6b02f9f061a9fccbda4e16d967d8
    container_name: mstream
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 3000
        published: "3000"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mstream/config
        target: /config
      - type: bind
        source: /DATA/Media/Music
        target: /music
x-casaos:
  id: io.github.mrpiracy94.mstream
  version: "1.0.1"
  main: mstream
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.mstream/assets/icon.png
  title:
    en_US: "mStream"
  port_map: "3000"
  index: /
