name: chromium
services:
  chromium:
    image: lscr.io/linuxserver/chromium:latest@sha256:771fd8f445a3e57610aec343c37af7905201abcc483be1af44e7984c5eaa5b3a
    container_name: chromium
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Chromium"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21034"
        protocol: tcp
      - target: 3001
        published: "21035"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/chromium/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.chromium
  version: "1.0.0"
  main: chromium
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.chromium/assets/icon.png
  title:
    en_US: "Chromium"
  port_map: "21034"
  index: /
