name: radarr-4k
services:
  radarr-4k:
    image: lscr.io/linuxserver/radarr:latest@sha256:2fce439bf4e1001b55b58eac915918ed101fa51ed2d396475ecc4c99c70062c2
    container_name: radarr-4k
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 7878
        published: "20068"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/radarr-4k/config
        target: /config
      - type: bind
        source: /DATA/Media/Movies4K
        target: /movies
      - type: bind
        source: /DATA/Downloads
        target: /downloads
x-casaos:
  id: io.github.mrpiracy94.radarr-4k
  version: "1.0.1"
  main: radarr-4k
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.radarr-4k/assets/icon.png
  title:
    en_US: "Radarr 4K"
  port_map: "20068"
  index: /
