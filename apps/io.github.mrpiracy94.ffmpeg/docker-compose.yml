name: ffmpeg
services:
  ffmpeg:
    image: ghcr.io/mrpiracy94/mrstore-pebble-ffmpeg@sha256:f162f645eec4d4c4b91ee3323a52ccbf8798faef184edb75ad12a0f772d8cb97
    container_name: ffmpeg
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    volumes:
      - type: bind
        source: /DATA/AppData/ffmpeg/config
        target: /config
      - type: bind
        source: /DATA/Media
        target: /data
x-casaos:
  id: io.github.mrpiracy94.ffmpeg
  version: "1.0.2"
  main: ffmpeg
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.ffmpeg/assets/icon.png
  title:
    en_US: "FFmpeg"
  port_map: "0"
  index: /
