name: mariadb
services:
  mariadb:
    image: lscr.io/linuxserver/mariadb:latest@sha256:fa63c6ff84bd6bab0a188d68e1b4cd1e4e1b34c22101fc52d544a53dfd502d45
    container_name: mariadb
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "MYSQL_ROOT_PASSWORD=CHANGE_ME"
    ports:
      - target: 3306
        published: "3306"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mariadb/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.mariadb
  version: "1.0.0"
  main: mariadb
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.mariadb/assets/icon.png
  title:
    en_US: "MariaDB"
  port_map: "3306"
  index: /
