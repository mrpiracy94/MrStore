name: prowlarr
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:011b80780dc8cb3c9bfc04c693f4039baf9360df5c2d07b04cc296f31c2b93f2
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 9696
        published: "9696"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/prowlarr/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.prowlarr
  version: "1.0.1"
  main: prowlarr
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.prowlarr/assets/icon.png
  title:
    en_US: "Prowlarr"
  port_map: "9696"
  index: /
