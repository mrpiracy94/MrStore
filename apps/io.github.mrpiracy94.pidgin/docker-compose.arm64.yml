name: pidgin
services:
  pidgin:
    image: lscr.io/linuxserver/pidgin:latest@sha256:12c0f4103b37b53b4e84e3c5b7cea10992ff16e6f103c652d8eedfae11ba15a4
    container_name: pidgin
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Pidgin"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21116"
        protocol: tcp
      - target: 3001
        published: "21117"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pidgin/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.pidgin
  version: "1.0.1"
  main: pidgin
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.pidgin/assets/icon.png
  title:
    en_US: "Pidgin"
  port_map: "21116"
  index: /
