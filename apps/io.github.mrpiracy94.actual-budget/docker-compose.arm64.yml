  version: "1.0.1"
  main: actual-budget
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.actual-budget/assets/icon.png
  title:
    en_US: "Actual Budget"
  port_map: "5006"
  index: /
