name: qui
services:
  qui:
    image: ghcr.io/autobrr/qui:latest@sha256:d7acbca96d0c834d4efc4adce44025a2d6e2980a73230be3c221e9e774a3a139
    container_name: qui
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
    ports:
      - target: 7476
