name: karakeep
services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release@sha256:6a35e9caccb26ac4e1ba47341326f3a59d8cfbc6508e7ca0011189847dd1836a
    container_name: karakeep
    restart: unless-stopped
    depends_on:
      - karakeep-chrome
      - karakeep-meilisearch
    environment:
      - "MEILI_ADDR=http://karakeep-meilisearch:7700"
      - "BROWSER_WEB_URL=http://karakeep-chrome:9222"
      - "NEXTAUTH_SECRET=CHANGE_ME"
      - "MEILI_MASTER_KEY=CHANGE_ME"
      - "NEXTAUTH_URL=http://zimaos.local:3000"
      - "DATA_DIR=/data"
    ports:
      - target: 3000
        published: "30002"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/karakeep/data
        target: /data
  karakeep-chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release@sha256:8da7a0ebbfb0bc8a4e820db87c72ee9bd05ec16d0fa975b43d3c547feb152f85
    container_name: karakeep-chrome
    restart: unless-stopped
    init: true
    command: ["--disable-gpu", "--disable-dev-shm-usage", "--hide-scrollbars", "--disable-blink-features=AutomationControlled", "--window-size=1440,900"]
  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.13.3@sha256:f263792c693d855fc2b4ccfe561166092533a409d4abd76ee114741753d10fdd
    container_name: karakeep-meilisearch
    restart: unless-stopped
    environment:
      - "MEILI_NO_ANALYTICS=true"
      - "MEILI_MASTER_KEY=CHANGE_ME"
    volumes:
      - type: bind
        source: /DATA/AppData/karakeep/meili
        target: /meili_data
x-casaos:
  id: io.github.mrpiracy94.karakeep
  version: "1.0.2"
  main: karakeep
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.karakeep/assets/icon.png
  title:
    en_US: "Karakeep"
  port_map: "30002"
  index: /
