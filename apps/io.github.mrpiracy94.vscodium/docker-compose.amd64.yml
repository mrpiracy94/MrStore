name: vscodium
services:
  vscodium:
    image: lscr.io/linuxserver/vscodium:latest
    container_name: vscodium
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=VSCodium"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21162"
        protocol: tcp
      - target: 3001
        published: "21163"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.vscodium
  version: "1.0.1"
  main: vscodium
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.vscodium/assets/icon.svg
  title:
    en_US: "VSCodium"
  port_map: "21162"
  index: /
