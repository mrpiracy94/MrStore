name: homarr
services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest@sha256:6219bd7a50f046fad2403c469366f2e463bde1558c5676828586ae98c44e7a75
    container_name: homarr
    restart: unless-stopped
    environment:
      - "SECRET_ENCRYPTION_KEY=CHANGE_ME_64_HEX"
    ports:
      - target: 7575
        published: "7575"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/homarr
        target: /appdata
x-casaos:
  id: io.github.mrpiracy94.homarr
  version: "1.0.2"
  main: homarr
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.homarr/assets/icon.png
  title:
    en_US: "Homarr"
  port_map: "7575"
  index: /
