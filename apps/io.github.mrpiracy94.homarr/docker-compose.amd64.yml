name: homarr
services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest@sha256:447267051fd7f3c76087498ad96c8b969f57c6762eaeb78717b69388ae1a781a
    container_name: homarr
    restart: unless-stopped
    environment:
      - "SECRET_ENCRYPTION_KEY=CHANGE_ME_64_HEX"
    ports:
      - target: 7575
        published: "7575"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/homarr
        target: /appdata
x-casaos:
  id: io.github.mrpiracy94.homarr
  version: "1.0.2"
  main: homarr
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.homarr/assets/icon.png
  title:
    en_US: "Homarr"
  port_map: "7575"
  index: /
