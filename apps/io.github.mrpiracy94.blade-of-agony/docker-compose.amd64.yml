name: blade-of-agony
services:
  blade-of-agony:
    image: lscr.io/linuxserver/blade-of-agony:latest@sha256:a4fff0e69ae1427e11bc53d8778cf2a288a5a230acd725ffddca3c306de80c73
    container_name: blade-of-agony
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Blade of Agony"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21182"
        protocol: tcp
      - target: 3001
        published: "21183"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/blade-of-agony/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.blade-of-agony
  version: "1.0.1"
  main: blade-of-agony
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.blade-of-agony/assets/icon.svg
  title:
    en_US: "Blade of Agony"
  port_map: "21182"
  index: /
