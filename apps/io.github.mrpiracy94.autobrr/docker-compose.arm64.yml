name: autobrr
services:
  autobrr:
    image: ghcr.io/autobrr/autobrr:latest@sha256:09a6b42e9f53d8fa2b413d455fb40b34ba6c6c60a38b8593da702e920817aae4
    container_name: autobrr
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
    ports:
      - target: 7474
        published: "7474"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/autobrr/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.autobrr
  version: "1.0.1"
  main: autobrr
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.autobrr/assets/icon.png
  title:
    en_US: "Autobrr"
  port_map: "7474"
  index: /
