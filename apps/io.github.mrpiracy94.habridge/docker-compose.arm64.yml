name: habridge
services:
  habridge:
    image: lscr.io/linuxserver/habridge:latest@sha256:e1b479165a5b32b0a072e8d3cdd3750266a2860ac304bbdb448635a4e1336e69
    container_name: habridge
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8080
        published: "20039"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/habridge/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.habridge
  version: "1.0.1"
  main: habridge
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.habridge/assets/icon.png
  title:
    en_US: "HA Bridge"
  port_map: "20039"
  index: /
