name: habridge
services:
  habridge:
    image: lscr.io/linuxserver/habridge:latest@sha256:905ef73339dabd7b77384cc7e59d11f3b7e53a7e3fc6ff5a362d299f7ebdc621
    container_name: habridge
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8080
        published: "20039"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/habridge/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.habridge
  version: "1.0.1"
  main: habridge
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.habridge/assets/icon.png
  title:
    en_US: "HA Bridge"
  port_map: "20039"
  index: /
