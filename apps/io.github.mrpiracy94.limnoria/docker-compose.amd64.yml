name: limnoria
services:
  limnoria:
    image: lscr.io/linuxserver/limnoria:latest@sha256:a511704388d4c157823b9287383c20307daa7997ab599ba716481299c2868130
    container_name: limnoria
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8080
        published: "20006"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/limnoria/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.limnoria
  version: "1.0.0"
  main: limnoria
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.limnoria/assets/icon.svg
  title:
    en_US: "Limnoria"
  port_map: "20006"
  index: /
