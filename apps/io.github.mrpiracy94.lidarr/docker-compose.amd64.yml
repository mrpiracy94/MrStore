name: lidarr
services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest@sha256:2ef08aa615642fdb7c5821fb708d5b0d051b2539c6f75a88c6044a3b1971e742
    container_name: lidarr
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8686
        published: "8686"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/lidarr/config
        target: /config
      - type: bind
        source: /DATA/Media/Music
        target: /music
      - type: bind
        source: /DATA/Downloads
        target: /downloads
x-casaos:
  id: io.github.mrpiracy94.lidarr
  version: "1.0.0"
  main: lidarr
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.lidarr/assets/icon.png
  title:
    en_US: "Lidarr"
  port_map: "8686"
  index: /
