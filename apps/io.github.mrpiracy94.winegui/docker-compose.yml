name: winegui
services:
  winegui:
    image: lscr.io/linuxserver/winegui:latest
    container_name: winegui
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=WineGUI"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21186"
        protocol: tcp
      - target: 3001
        published: "21187"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/winegui/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.winegui
  version: "1.0.1"
  main: winegui
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.winegui/assets/icon.png
  title:
    en_US: "WineGUI"
  port_map: "21186"
  index: /
