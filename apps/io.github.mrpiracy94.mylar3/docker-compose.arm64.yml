name: mylar3
services:
  mylar3:
    image: lscr.io/linuxserver/mylar3:latest@sha256:8a8a76038a9b24670879e6486624884850171f07704e041e998d5ebb9e6b16ff
    container_name: mylar3
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8090
        published: "8090"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mylar3/config
        target: /config
      - type: bind
        source: /DATA/Media/Comics
        target: /comics
      - type: bind
        source: /DATA/Downloads
        target: /downloads
x-casaos:
  id: io.github.mrpiracy94.mylar3
  version: "1.0.2"
  main: mylar3
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.mylar3/assets/icon.png
  title:
    en_US: "Mylar3"
  port_map: "8090"
  index: /
