name: esphome
services:
  esphome:
    image: ghcr.io/esphome/esphome:latest@sha256:55e24cac77eed45a128aadf1ebfaeb754322f4d752aa9dfc91051eda48270b48
    container_name: esphome
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
    ports:
      - target: 6052
        published: "6052"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/esphome
        target: /config
x-casaos:
  id: io.github.mrpiracy94.esphome
  version: "1.0.0"
  main: esphome
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.esphome/assets/icon.png
  title:
    en_US: "ESPHome"
  port_map: "6052"
  index: /
