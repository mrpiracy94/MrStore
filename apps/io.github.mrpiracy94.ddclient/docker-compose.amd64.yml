name: ddclient
services:
  ddclient:
    image: lscr.io/linuxserver/ddclient:latest@sha256:974d9aab3f1eb9944e88f4f461b5b4372a455132c7955a4977dff67a91a914fb
    container_name: ddclient
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    volumes:
      - type: bind
        source: /DATA/AppData/ddclient/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.ddclient
  version: "1.0.1"
  main: ddclient
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.ddclient/assets/icon.png
  title:
    en_US: "ddclient"
  port_map: "0"
  index: /
