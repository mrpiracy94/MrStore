name: calibre-web
services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest@sha256:1d0c050d6e6d0f302d4d3113348bb61aa146258632c983a0f039754e056b1fdf
    container_name: calibre-web
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 8083
        published: "8083"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/calibre-web/config
        target: /config
      - type: bind
        source: /DATA/Media/Books
        target: /books
x-casaos:
  id: io.github.mrpiracy94.calibre-web
  version: "1.0.0"
  main: calibre-web
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.calibre-web/assets/icon.png
  title:
    en_US: "Calibre-Web"
  port_map: "8083"
  index: /
