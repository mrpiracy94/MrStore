name: wireguard
services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest@sha256:f9194fcf2353fc63bac023487f3a67b35f8334abb0ba4f79e81bd876de9f3e1e
    container_name: wireguard
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "SERVERURL=auto"
      - "PEERS=1"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - target: 51820
        published: "51820"
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/wireguard/config
        target: /config
      - type: bind
        source: /lib/modules
        target: /lib/modules
x-casaos:
  id: io.github.mrpiracy94.wireguard
  version: "1.0.1"
  main: wireguard
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.wireguard/assets/icon.png
  title:
    en_US: "WireGuard"
  port_map: "0"
  index: /
