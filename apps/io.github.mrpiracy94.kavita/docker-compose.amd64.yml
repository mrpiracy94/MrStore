name: kavita
services:
  kavita:
    image: lscr.io/linuxserver/kavita:latest@sha256:956618554afe620fbd6eb51d4b2a1ff0cdece7e33a83d1425f2f18e545b89d26
    container_name: kavita
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 5000
        published: "5000"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kavita/config
        target: /config
      - type: bind
        source: /DATA/Media/Books
        target: /data
x-casaos:
  id: io.github.mrpiracy94.kavita
  version: "1.0.1"
  main: kavita
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.kavita/assets/icon.png
  title:
    en_US: "Kavita"
  port_map: "5000"
  index: /
