name: kavita
services:
  kavita:
    image: lscr.io/linuxserver/kavita:latest@sha256:1a74624c346fc00b6bbc5ea7fc4017dad7e4a0ba7e509e562a7387d5141379f1
    container_name: kavita
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 5000
        published: "5000"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kavita/config
        target: /config
      - type: bind
        source: /DATA/Media/Books
        target: /data
x-casaos:
  id: io.github.mrpiracy94.kavita
  version: "1.0.1"
  main: kavita
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.kavita/assets/icon.png
  title:
    en_US: "Kavita"
  port_map: "5000"
  index: /
