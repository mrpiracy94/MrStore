name: xemu
services:
  xemu:
    image: lscr.io/linuxserver/xemu:latest@sha256:a363a96b09dd5ab8e91f2dc2d7bf540d04f63f94c15f6e7b893e18460704cf37
    container_name: xemu
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=xemu"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21174"
        protocol: tcp
      - target: 3001
        published: "21175"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/xemu/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.xemu
  version: "1.0.0"
  main: xemu
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.xemu/assets/icon.svg
  title:
    en_US: "xemu"
  port_map: "21174"
  index: /
