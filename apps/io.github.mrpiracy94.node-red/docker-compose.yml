name: node-red
services:
  node-red:
    image: nodered/node-red:latest@sha256:b5adb6c9dd29ab80c852d82bc87daed84e729dcff9b00ca1bf958e6de470f2c1
    container_name: node-red
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
    ports:
      - target: 1880
        published: "1880"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/node-red
        target: /data
x-casaos:
  id: io.github.mrpiracy94.node-red
  version: "1.0.1"
  main: node-red
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.node-red/assets/icon.png
  title:
    en_US: "Node-RED"
  port_map: "1880"
  index: /
