name: node-red
services:
  node-red:
    image: nodered/node-red:latest@sha256:148cf534d628591aa605f808971153d7de03b5ea5ca84b569daeadd97dc52769
    container_name: node-red
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
    ports:
      - target: 1880
        published: "1880"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/node-red
        target: /data
x-casaos:
  id: io.github.mrpiracy94.node-red
  version: "1.0.0"
  main: node-red
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.node-red/assets/icon.png
  title:
    en_US: "Node-RED"
  port_map: "1880"
  index: /
