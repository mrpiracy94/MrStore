name: inkscape
services:
  inkscape:
    image: lscr.io/linuxserver/inkscape:latest
    container_name: inkscape
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Inkscape"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21074"
        protocol: tcp
      - target: 3001
        published: "21075"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/inkscape/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.inkscape
  version: "1.0.2"
  main: inkscape
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.inkscape/assets/icon.svg
  title:
    en_US: "Inkscape"
  port_map: "21074"
  index: /
