name: zen
services:
  zen:
    image: lscr.io/linuxserver/zen:latest@sha256:64fb7d084e234d0b6cdbfacf7d43d6d2a2dcbec43a74a523b7c82d1037db7ae1
    container_name: zen
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Zen Browser"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21178"
        protocol: tcp
      - target: 3001
        published: "21179"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/zen/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.zen
  version: "1.0.0"
  main: zen
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.zen/assets/icon.svg
  title:
    en_US: "Zen Browser"
  port_map: "21178"
  index: /
