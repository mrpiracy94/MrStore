name: audacity
services:
  audacity:
    image: lscr.io/linuxserver/audacity:latest@sha256:6e0761fff5269228c515e754e6d2bef8be353f939cf2a2eca3d30af7b4a6ee0f
    container_name: audacity
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=Audacity"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21016"
        protocol: tcp
      - target: 3001
        published: "21017"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/audacity/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.audacity
  version: "1.0.1"
  main: audacity
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.audacity/assets/icon.png
  title:
    en_US: "Audacity"
  port_map: "21016"
  index: /
