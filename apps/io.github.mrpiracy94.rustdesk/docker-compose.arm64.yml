name: rustdesk
services:
  rustdesk:
    image: lscr.io/linuxserver/rustdesk:latest@sha256:bb4c5161f1df20602c791a025c69a6dbb88231e4b3e33801f1771f04a6d06487
    container_name: rustdesk
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=RustDesk"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21000"
        protocol: tcp
      - target: 3001
        published: "21001"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/rustdesk/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.rustdesk
  version: "1.0.1"
  main: rustdesk
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.rustdesk/assets/icon.png
  title:
    en_US: "RustDesk"
  port_map: "21000"
  index: /
