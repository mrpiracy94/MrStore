name: metube
services:
  metube:
    image: ghcr.io/alexta69/metube:latest@sha256:8d1b7f30e3c8c2aea82ad17b0428488661e376fd78e1b6e672d321478ace4cb4
    container_name: metube
    restart: unless-stopped
    environment:
      - "UID=1000"
      - "GID=1000"
    ports:
      - target: 8081
        published: "30017"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/Downloads/metube
        target: /downloads
x-casaos:
  id: io.github.mrpiracy94.metube
  version: "1.0.1"
  main: metube
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.metube/assets/icon.png
  title:
    en_US: "MeTube"
  port_map: "30017"
  index: /
