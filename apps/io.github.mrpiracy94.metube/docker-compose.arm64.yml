name: metube
services:
  metube:
    image: ghcr.io/alexta69/metube:latest@sha256:1e1883fad47c2cf80d5f07664bad68f4544b6f39fd73ed0dadde09813fe36240
    container_name: metube
    restart: unless-stopped
    environment:
      - "UID=1000"
      - "GID=1000"
    ports:
      - target: 8081
        published: "30017"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/Downloads/metube
        target: /downloads
x-casaos:
  id: io.github.mrpiracy94.metube
  version: "1.0.0"
  main: metube
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.metube/assets/icon.png
  title:
    en_US: "MeTube"
  port_map: "30017"
  index: /
