name: mame
services:
  mame:
    image: lscr.io/linuxserver/mame:latest@sha256:0968ba5bd934527a550d0b76cdaaff5bcf1cda16c6ac2850b7f5e68a4b7868d9
    container_name: mame
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "TITLE=MAME"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    ports:
      - target: 3000
        published: "21094"
        protocol: tcp
      - target: 3001
        published: "21095"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mame/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.mame
  version: "1.0.1"
  main: mame
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.mame/assets/icon.png
  title:
    en_US: "MAME"
  port_map: "21094"
  index: /
