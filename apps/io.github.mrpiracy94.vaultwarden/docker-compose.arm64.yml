name: vaultwarden
services:
  vaultwarden:
    image: vaultwarden/server:1.37.4-alpine@sha256:c82bc74bb0a88821fd3fbce48e7867e8aca4e492e512970a309d02a629ab91d4
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
      - "SIGNUPS_ALLOWED=false"
    ports:
      - target: 80
        published: "30003"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vaultwarden
        target: /data
x-casaos:
  id: io.github.mrpiracy94.vaultwarden
  version: "1.0.3"
  main: vaultwarden
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.vaultwarden/assets/icon.png
  title:
    en_US: "Vaultwarden"
  port_map: "30003"
  index: /
