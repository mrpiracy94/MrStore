name: vaultwarden
services:
  vaultwarden:
    image: vaultwarden/server:1.37.4-alpine@sha256:19ea2b669945d842dadc3d500f2d6a795866a003330f59a47b9634658bae98bb
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
      - "SIGNUPS_ALLOWED=false"
    ports:
      - target: 80
        published: "30003"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vaultwarden
        target: /data
x-casaos:
  id: io.github.mrpiracy94.vaultwarden
  version: "1.0.3"
  main: vaultwarden
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.vaultwarden/assets/icon.png
  title:
    en_US: "Vaultwarden"
  port_map: "30003"
  index: /
