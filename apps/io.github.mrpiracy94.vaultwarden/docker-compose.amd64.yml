name: vaultwarden
services:
  vaultwarden:
    image: vaultwarden/server:latest@sha256:2bb2e0344616c62a6d76ea10558497499f8ed3f731400e143dc7bf17b757b5b9
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - "TZ=Europe/Lisbon"
      - "SIGNUPS_ALLOWED=false"
    ports:
      - target: 80
        published: "30003"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vaultwarden
        target: /data
x-casaos:
  id: io.github.mrpiracy94.vaultwarden
  version: "1.0.1"
  main: vaultwarden
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.vaultwarden/assets/icon.png
  title:
    en_US: "Vaultwarden"
  port_map: "30003"
  index: /
