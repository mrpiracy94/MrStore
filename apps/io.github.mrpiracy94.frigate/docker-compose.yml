name: frigate
services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    privileged: true
    shm_size: "512mb"
    environment:
      - "TZ=Europe/Lisbon"
      - "FRIGATE_RTSP_PASSWORD=CHANGE_ME"
    ports:
      - target: 8971
        published: "8971"
        protocol: tcp
      - target: 8554
        published: "8554"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/frigate/config
        target: /config
      - type: bind
        source: /DATA/Media/Frigate
        target: /media/frigate
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
x-casaos:
  id: io.github.mrpiracy94.frigate
  version: "1.0.0"
  main: frigate
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.frigate/assets/icon.png
  title:
    en_US: "Frigate"
  port_map: "8971"
  index: /
