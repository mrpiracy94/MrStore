name: foldingathome
services:
  foldingathome:
    image: lscr.io/linuxserver/foldingathome:latest@sha256:22a754347784371ae920895709d7d7dc99ba4bec779577f48af6a40b5ea33c3d
    container_name: foldingathome
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
    ports:
      - target: 7396
        published: "7396"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/foldingathome/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.foldingathome
  version: "1.0.0"
  main: foldingathome
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.foldingathome/assets/icon.png
  title:
    en_US: "Folding@home"
  port_map: "7396"
  index: /
