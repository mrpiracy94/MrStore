name: plex
services:
  plex:
    image: ghcr.io/mrpiracy94/mrstore-pebble-plex@sha256:0d624cc85c6911c0d5af20f33fd733f90f86d612ae15f84424dab0e0187bcbbb
    container_name: plex
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "VERSION=docker"
    ports:
      - target: 32400
        published: "32400"
        protocol: tcp
      - target: 1900
        published: "1900"
        protocol: udp
      - target: 3005
        published: "3005"
        protocol: tcp
      - target: 5353
        published: "5353"
        protocol: udp
      - target: 8324
        published: "8324"
        protocol: tcp
      - target: 32410
        published: "32410"
        protocol: udp
      - target: 32412
        published: "32412"
        protocol: udp
      - target: 32413
        published: "32413"
        protocol: udp
      - target: 32414
        published: "32414"
        protocol: udp
      - target: 32469
        published: "32469"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/plex/config
        target: /config
      - type: bind
        source: /DATA/Media/TV
        target: /tv
      - type: bind
        source: /DATA/Media/Movies
        target: /movies
      - type: bind
        source: /DATA/Media/Music
        target: /music
x-casaos:
  id: io.github.mrpiracy94.plex
  version: "1.0.2"
  main: plex
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.plex/assets/icon.png
  title:
    en_US: "Plex"
  port_map: "32400"
  index: /
