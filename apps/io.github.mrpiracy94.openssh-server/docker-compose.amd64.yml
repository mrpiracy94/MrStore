name: openssh-server
services:
  openssh-server:
    image: lscr.io/linuxserver/openssh-server:latest@sha256:9d2b39c55f0b454345af2a8f825eb5955d80e845719ebb9bceaaf80fbdce33ab
    container_name: openssh-server
    restart: unless-stopped
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/Lisbon"
      - "PASSWORD_ACCESS=true"
      - "USER_NAME=admin"
    ports:
      - target: 2222
        published: "2222"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/openssh-server/config
        target: /config
x-casaos:
  id: io.github.mrpiracy94.openssh-server
  version: "1.0.1"
  main: openssh-server
  icon: https://mrpiracy94.github.io/MrStore/apps/io.github.mrpiracy94.openssh-server/assets/icon.png
  title:
    en_US: "OpenSSH Server"
  port_map: "2222"
  index: /
